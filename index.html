<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Playbook">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F24" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Playbook Logger</title>
<style>
/* layout: one-screen phone app — top bar, real-scale field canvas, bottom control panel */
/* 0.13.0: the engine's look — white, ink navy, one cobalt, coral for what changed; a navy night version of the same */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --raise:#EEF1FF; --raise2:#DDE2F5; --line:#DDE2F5;
  --fg:#14163A; --fg2:#5B5F86; --accent:#2B50FF; --on-accent:#FFFFFF;
  --danger:#D9480F; --warn:#9A4A00; --ok:#1E7B3A; --toast:#FFFFFF;
  --soft:#EEF1FF; --coral:#FF6B4A; --coral-bg:#FFF4F1; --run:#D9480F; --pass:#2B50FF;
  --t-data-bg:#E7F6EC; --t-data-fg:#1E7B3A; --t-ipad-bg:#FFF1E0; --t-ipad-fg:#9A4A00; --t-pick-bg:#EEF1FF; --t-pick-fg:#2B50FF;
  --t-you-bg:#14163A; --t-you-fg:#FFFFFF; --t-rule-bg:#F3F4FA; --t-rule-fg:#5B5F86; --t-out-bg:#FFE4DC; --t-out-fg:#B23A0E;
  --qz-bg:#EEF1FF; --qz-line:rgba(43,80,255,.10); --qz-hash:rgba(43,80,255,.22); --qz-los:rgba(43,80,255,.55); --qz-ol:#9DA3C9; --qz-qb:#FFFFFF;
  --qz-ink:#14163A; --qz-lb:#3A3F75; --qz-sub:#5B5F86; --qz-zone:rgba(43,80,255,.07); --qz-zone2:rgba(43,80,255,.13);
  --font:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F24; --panel:#14173A; --raise:#1C2050; --raise2:#2A2F66; --line:rgba(201,206,234,.14);
  --fg:#EEF1FF; --fg2:#9DA3C9; --accent:#5B7BFF; --on-accent:#FFFFFF;
  --danger:#FF7A5C; --warn:#FFB066; --ok:#4CC27A; --toast:#1C2050;
  --soft:#1C2050; --coral:#FF6B4A; --coral-bg:rgba(255,107,74,.14); --run:#FF7A45; --pass:#7C95FF;
  --t-data-bg:rgba(76,194,122,.16); --t-data-fg:#6FE39A; --t-ipad-bg:rgba(255,176,102,.16); --t-ipad-fg:#FFC08A; --t-pick-bg:rgba(91,123,255,.2); --t-pick-fg:#A9B8FF;
  --t-you-bg:#EEF1FF; --t-you-fg:#14163A; --t-rule-bg:rgba(255,255,255,.06); --t-rule-fg:#9DA3C9; --t-out-bg:rgba(255,107,74,.18); --t-out-fg:#FFAE96;
  --qz-bg:#171A3A; --qz-line:rgba(157,163,201,.12); --qz-hash:rgba(157,163,201,.25); --qz-los:rgba(124,149,255,.65); --qz-ol:#4A5080; --qz-qb:#EEF1FF;
  --qz-ink:#EEF1FF; --qz-lb:#9DA3C9; --qz-sub:#9DA3C9; --qz-zone:rgba(124,149,255,.08); --qz-zone2:rgba(124,149,255,.15);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D0F24; --panel:#14173A; --raise:#1C2050; --raise2:#2A2F66; --line:rgba(201,206,234,.14);
  --fg:#EEF1FF; --fg2:#9DA3C9; --accent:#5B7BFF; --on-accent:#FFFFFF;
  --danger:#FF7A5C; --warn:#FFB066; --ok:#4CC27A; --toast:#1C2050;
  --soft:#1C2050; --coral:#FF6B4A; --coral-bg:rgba(255,107,74,.14); --run:#FF7A45; --pass:#7C95FF;
  --t-data-bg:rgba(76,194,122,.16); --t-data-fg:#6FE39A; --t-ipad-bg:rgba(255,176,102,.16); --t-ipad-fg:#FFC08A; --t-pick-bg:rgba(91,123,255,.2); --t-pick-fg:#A9B8FF;
  --t-you-bg:#EEF1FF; --t-you-fg:#14163A; --t-rule-bg:rgba(255,255,255,.06); --t-rule-fg:#9DA3C9; --t-out-bg:rgba(255,107,74,.18); --t-out-fg:#FFAE96;
  --qz-bg:#171A3A; --qz-line:rgba(157,163,201,.12); --qz-hash:rgba(157,163,201,.25); --qz-los:rgba(124,149,255,.65); --qz-ol:#4A5080; --qz-qb:#EEF1FF;
  --qz-ink:#EEF1FF; --qz-lb:#9DA3C9; --qz-sub:#9DA3C9; --qz-zone:rgba(124,149,255,.08); --qz-zone2:rgba(124,149,255,.15);
  color-scheme:dark;}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button,select{font-family:var(--font);touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.top{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px}
.icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:var(--raise);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.icon-btn[hidden]{display:none!important}
.top-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
#topTitle{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topSub{font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.view{flex:1;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 32px}
.editor{display:flex;flex-direction:column}
#fieldWrap{flex:1;min-height:220px;position:relative;touch-action:none;background:#122019;overflow:hidden}
#field{position:absolute;inset:0;width:100%;height:100%;display:block}
#fitBtn{position:absolute;right:10px;top:10px;height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(255,255,255,.25);
  background:rgba(20,26,30,.75);color:#F2F4F3;font-size:13px;font-weight:700}
.panel{flex:none;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;position:relative;box-shadow:0 -10px 28px rgba(0,0,0,.28);
  padding:14px 16px 14px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg2)}
.row{display:flex;gap:8px;align-items:center}
.btn{height:50px;border-radius:14px;border:0;background:var(--raise);color:var(--fg);font-size:16px;font-weight:600;padding:0 14px;flex:1;min-width:0}
.btn.pri{background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.def{background:#FF8A3D;color:#111418;font-weight:700}
.btn.danger{color:var(--danger)}
.btn.slim{flex:0 0 auto}
.btn.small{height:40px;font-size:14px;border-radius:11px;padding:0 12px}
.keys{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.key{height:44px;border:0;border-radius:9px;background:var(--raise);color:var(--fg);font-size:15px;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
.key.on{background:#FF8A3D;color:#111418}
.key.up{background:transparent;box-shadow:inset 0 0 0 2px #FF8A3D;color:#FF8A3D}
.key.lb{background:var(--raise2);box-shadow:inset 0 0 0 2px var(--fg)}
.key.dim{box-shadow:inset 0 -3px 0 rgba(255,138,61,.7)}
.key.key0{width:56px;flex:none}
.mid{display:flex;gap:6px;align-items:center}
.mid .side{flex:1;font-size:12px;color:var(--fg2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.mid .side.r{text-align:right}
.status.code-line{font-family:var(--mono);font-size:13px;color:var(--fg)}
/* home, v0.5 */
.sub{color:var(--fg2);margin:-8px 0 16px;font-size:14px;font-variant-numeric:tabular-nums}
.hero{display:flex;gap:14px;align-items:center;width:100%;padding:16px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);text-align:left;box-sizing:border-box}
.hero b{font-size:19px;display:block}
.hero small{display:block;opacity:.82;font-size:13px;margin-top:3px;line-height:17px}
.hero-ic{width:46px;height:46px;border-radius:23px;background:rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 26px}
.tile{min-height:84px;border-radius:18px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:3px;box-sizing:border-box}
.tile i{width:22px;height:5px;border-radius:3px;display:block;margin-bottom:6px}
.tile b{font-size:15px}
.tile small{font-size:12.5px;color:var(--fg2);line-height:16px}
.chev{color:var(--fg2);flex:none;font-size:18px}
/* 0.12.0 the three doors */
.door{display:flex;flex-direction:column;gap:9px;width:100%;padding:14px 16px;border-radius:22px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-align:left;box-sizing:border-box;margin-bottom:12px}
.door.one{background:var(--fg);color:var(--bg);border-color:transparent}
.door.one .door-k,.door.one .door-s{color:inherit;opacity:.72}
.door.one .btn{background:var(--accent);color:var(--on-accent)}
.door.two{background:var(--raise)}
.door-k{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--fg2)}
.door-t{font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.door-t small{font-size:13px;font-weight:700;color:var(--fg2);white-space:nowrap}
.door-s{font-size:13px;color:var(--fg2);line-height:18px}
.door .row .btn{height:44px;font-size:15px}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:6px;background:var(--accent)}
.lately{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 20px;padding:0 16px}
.lately::-webkit-scrollbar{display:none}
.lately .chip{height:32px;font-size:13px;font-weight:700}
.drive summary{font-size:14px}
.drive summary span{font-size:12px}
.li.on{background:var(--raise)}
.li.done .li-n{color:var(--ok)}
.li.np{opacity:.6}
/* 0.13.0 the engine: one question a screen */
.flow{padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.fl-top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;margin:0 -16px 6px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px}
.fl-segs{display:flex;gap:4px;flex:none}
.fl-segs i{display:block;width:16px;height:6px;border-radius:3px;background:var(--raise2)}
.fl-segs i.on{background:var(--accent);width:22px}
.fl-segs i.cur{background:var(--accent);width:34px}
.fl-segs.def i.on,.fl-segs.def i.cur{background:var(--coral)}
.fl-ctx{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-x{width:44px;height:44px;border-radius:22px;border:0;background:var(--soft);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.fl-x svg{width:18px;height:18px}
.fl-link{height:36px;border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:700;padding:0 4px;flex:none}
.fl-badge{padding:3px 9px;border-radius:9px;font-size:12px;font-weight:800;flex:none}
.fl-k{font-size:13px;font-weight:500;color:var(--fg2);margin:2px 0 8px;line-height:18px}
.fl-lead{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--fg2);margin:2px 0 2px}
.fl-h{font-size:32px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin:2px 0 6px}
.fl-sub{font-size:14px;color:var(--fg2);margin:0 0 14px;line-height:19px}
.known{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.kc{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:700;white-space:nowrap}
.kc svg{width:12px;height:12px;flex:none}
.src-data{background:var(--t-data-bg);color:var(--t-data-fg)}
.src-ipad{background:var(--t-ipad-bg);color:var(--t-ipad-fg)}
.src-pick{background:var(--t-pick-bg);color:var(--t-pick-fg)}
.src-you{background:var(--t-you-bg);color:var(--t-you-fg)}
.src-rule{background:var(--t-rule-bg);color:var(--t-rule-fg)}
.src-out{background:var(--t-out-bg);color:var(--t-out-fg)}
.fl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 14px}
.fl-set{position:relative;display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:18px;border:2px solid var(--line);background:var(--bg);text-align:left;color:var(--fg);min-width:0}
.fl-set.on{border:3px solid var(--accent);background:var(--soft);padding:7px}
.fl-set b{font-size:17px;line-height:1.15;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-set small{font-size:12px;color:var(--fg2)}
.fl-art{display:block;border-radius:11px;overflow:hidden;background:var(--qz-bg)}
.fl-art svg{display:block;width:100%;height:100%}
.fl-tag{position:absolute;right:8px;top:8px;padding:3px 8px;border-radius:9px;background:var(--coral);color:#14163A;font-size:11px;font-weight:800}
.fl-big{width:100%;height:56px;border-radius:18px;border:2px solid var(--accent);background:var(--bg);color:var(--accent);display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:800;margin:2px 0 12px}
.fl-big svg{width:20px;height:20px}
.fl-sw{display:flex;align-items:center;gap:12px;padding:2px 4px 10px}
.fl-sw span{flex:1;display:flex;flex-direction:column;gap:1px}.fl-sw b{font-size:14px}.fl-sw small{font-size:12px;color:var(--fg2)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--raise2);position:relative;border:0;padding:0;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(20,22,58,.3);transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:23px}
.fl-note{font-size:13px;color:var(--fg2);text-align:center;margin:6px 0 10px;line-height:18px}
.fl-q{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.fl-q .lab{font-size:13px;font-weight:700}
.fl-q .qh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fl-q .qh b{font-size:15px;font-weight:800}.fl-q .qh small{font-size:12px;font-weight:700;text-align:right}
.fl-chips{display:flex;gap:6px;flex-wrap:wrap}
.fc{height:34px;min-width:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font-size:14px;font-weight:800}
.fc.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fc.lock{border-color:var(--soft);color:var(--raise2)}
.fc.lock.on{background:var(--t-data-bg);color:var(--t-data-fg);border-color:transparent}
.fl-film{position:relative;display:block;width:100%;border:0;padding:0;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;margin:0 0 12px}
.fl-film img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fl-film span{position:absolute;left:10px;top:10px;padding:3px 9px;border-radius:9px;background:rgba(20,22,58,.85);color:#fff;font-size:12px;font-weight:700}
.fl-opts{display:flex;flex-direction:column;gap:10px;margin:0 0 14px}
.fl-opt{display:flex;align-items:center;gap:12px;min-height:86px;padding:7px;border-radius:18px;border:2px solid var(--line);background:var(--bg);color:var(--fg);text-align:left;width:100%}
.fl-opt.on{border:3px solid var(--accent);background:var(--soft);padding:6px}
.fl-opt .fl-art{width:136px;height:68px;flex:none}
.fl-opt > span:last-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fl-opt b{font-size:19px;font-weight:800}
.fl-opt small{font-size:12px;line-height:16px;color:var(--fg2)}
.fl-opt em{font-style:normal;font-size:11px;font-weight:800;color:var(--t-pick-fg)}
.fl-next{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.fl-next span{height:28px;padding:0 10px;border-radius:14px;border:1.5px dashed var(--fg2);display:flex;align-items:center;font-size:13px;font-weight:700;color:var(--fg2)}
.fl-row{display:flex;gap:10px;margin:8px 0}
.fb{flex:1;height:54px;border-radius:18px;border:0;background:var(--soft);color:var(--fg);font-size:15px;font-weight:700;min-width:0;padding:0 10px}
.fb.pri{flex:2;background:var(--accent);color:#fff;font-size:16px;font-weight:800}
.fb.out{background:var(--bg);border:2px solid var(--accent);color:var(--accent);font-weight:800}
.fb:disabled{opacity:.4}
.fseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:36px;border-radius:18px;background:var(--soft);padding:3px;box-sizing:border-box;margin:0 0 10px}
.fseg button{border:0;border-radius:15px;background:transparent;color:var(--fg2);font-size:13px;font-weight:700;padding:0}
.fseg button.on{background:var(--bg);color:var(--fg);font-weight:800;box-shadow:0 1px 3px rgba(20,22,58,.15)}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 10px}
.tray.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.tm{height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg);padding:0}
.tm small{font-size:11px;font-weight:700;color:var(--fg2)}
.tm i{width:22px;height:22px;border-radius:11px;background:var(--fg);color:var(--bg);font-style:normal;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.tm.open i{background:transparent;border:2px dashed var(--raise2)}
.tm.cur{border-color:var(--coral);background:var(--coral-bg)}
.tm.cur i{background:var(--bg);border:2px solid var(--coral);color:var(--run)}
.cgrid{display:grid;grid-template-columns:66px repeat(5,minmax(0,1fr));border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:0 0 12px}
.cgrid .ch{height:30px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--soft);font-size:9px;font-weight:800;letter-spacing:.04em;line-height:1.1;color:var(--fg2)}
.cgrid .rh{height:48px;display:flex;align-items:center;padding-left:8px;border-top:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:.04em;line-height:1.2;color:var(--fg2)}
.cc{height:48px;padding:0;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center}
.cc i{width:28px;height:28px;border-radius:14px;box-sizing:border-box;border:2px solid var(--raise2);font-style:normal;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.cc.taken i{background:var(--fg);border:0;color:var(--bg);opacity:.35}
.cc.me{background:var(--soft)}.cc.me i{background:var(--accent);border:0;color:#fff}
.cc.grey{background:var(--t-rule-bg)}.cc.grey i{border-style:dashed}
.backs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 12px}

<body>


<div id="app">
  <header class="top" id="top">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="topLIcon" d="M15 5l-7 7 7 7"></path></svg>
    </button>

    <button id="topR" class="icon-btn" data-act="topR" aria-label="Diagnostics">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
    </button>
  </header>
  <main id="home" class="view scroll home"></main>
  <main id="flow" class="view scroll flow" hidden></main>
  <section id="editor" class="view editor" hidden>
    <div id="fieldWrap"><svg id="field" role="img" aria-label="Football field"></svg><button id="fitBtn" data-act="fit" hidden>Fit field</button><button id="filmBtn" data-act="film" hidden>Film</button></div>
    <div id="panel" class="panel"></div>
  </section>
  <section id="diag" class="view scroll diag" hidden></section>
  <nav id="tabs" class="tabs" hidden aria-label="Sections">
    <button data-act="tab" data-v="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home<span class="bdg" id="tabBadge" hidden></span></button>
    <button data-act="tab" data-v="sheet" aria-label="Call sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16"/></svg>Sheet</button>
    <button data-act="tab" data-v="band" aria-label="Wristband"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M5 9h14M5 15h14M12 9v12"/></svg>Band</button>

  </nav>
</div>

  <div class="zoomTop"><span><b id="zoomTitle"></b> <span id="zoomSub"></span></span><button data-act="zoomClose">Done</button></div>
  <div id="zoomStage"><img id="zoomImg" alt="The frame, up close"></div>
  <div class="zoomBar"><div class="shots" id="zoomShots"></div><small>Pinch to zoom · drag to pan · double-tap in and out</small></div>
</div>

<script>
(() => {
'use strict';
const VERSION = '0.16.0';
const KEYS = {store:'pb.store', diag:'pb.diag', dumps:'pb.dumps', base:'pb.baseline', bad:'pb.store.bad'};
const LETTER_COLOR = {X:'#FF5A4E', Y:'#FFD23F', Z:'#B78CFF', H:'#4DA3FF', F:'#3DDC84'};
const PERS = ['11','12','10','13','21','22','20','23','01','02','00','31','30'];
const QB_DEPTH = {under:1, pistol:4, gun:5};
const QB_LETTER = {under:'U', pistol:'P', gun:'G'};
const QB_FROM_LETTER = {U:'under', P:'pistol', G:'gun'};
const QB_LABEL = {under:'Under C', pistol:'Pistol', gun:'Gun'};
const OL = [{x:-4,l:'LT'},{x:-2,l:'LG'},{x:0,l:''},{x:2,l:'RG'},{x:4,l:'RT'}];
/* techniques in yards from the ball (center 0, guards ±2, tackles ±4, tight end ±6) */
const TECH_X = [['0',0],['1',0.5],['2i',1.5],['2',2],['3',2.5],['4i',3.5],['4',4],['5',4.5],['7',5.5],['6',6],['9',6.5]];
const TECH_SPOTS = TECH_X.flatMap(([t,x]) => x === 0 ? [x] : [-x, x]);
const techOf = x => { const a = Math.abs(x); const hit = TECH_X.find(([,v]) => Math.abs(v - a) < 0.01); return hit ? hit[0] : String(a); };
/* NFL field: 53⅓ yd wide, hashes 70'9" from each sideline */
const FW = 160 / 3, HASH_L = 70.75 / 3, HASH_R = FW - 70.75 / 3;
const BALL_X = {L:HASH_L, M:FW / 2, R:HASH_R};
/* ---- slots ----
   Offense receiver slot  "L|R : I|T|S|N|W : 0|1|3"   (0 on the ball, 1 off, 3 stack)
   Offense backfield slot "L|M|R:FB" fullback depth (beside the QB in the gun) · "M:TB" tailback · "L|R:HB" H-back
   Defense back slot      "L|R : I|T|S|N|W : p|o|d"  or "M:M:o|d" (middle of the field)
   I T S sit 6, 9, 12 yd from the ball; N and W sit 8 and 4 yd in from the sideline. */
const RCOLS = ['I','T','S','N','W'];
const BALL_COL = {I:6, T:9, S:12};
const SIDE_COL = {N:8, W:4};
const OROWS = [0,1,3];
const OMARK = {0:'', 1:"'", 3:'"'};
const MARK_ROW = {'':0, "'":1, '"':3};
const COL_RANK = {I:1, O:1, T:2, S:3, N:4, W:5};
const OFF_KEYS = ['L','R'].flatMap(s => RCOLS.flatMap(c => OROWS.map(r => `${s}:${c}:${r}`))).concat(['L:FB','M:FB','R:FB','M:TB','L:HB','R:HB']);
const DROW_DEPTH = {p:1, o:6, d:12};
const DMARK = {p:'', o:"'", d:'"'};
const DNOM = {I:6, T:9, S:12, N:18, W:22, M:0};
const DB_KEYS = ['L','R'].flatMap(s => RCOLS.flatMap(c => ['p','o','d'].map(r => `${s}:${c}:${r}`))).concat(['M:M:o','M:M:d']);
const TYPE_LABEL = {B:'RB', T:'TE', W:'WR', L:'OL'};
const DEF_ORANGE = '#FF8A3D';
const $ = s => document.querySelector(s);
const svg = $('#field');
const mirrorKey = k => { const p = k.split(':'); p[0] = p[0] === 'L' ? 'R' : p[0] === 'R' ? 'L' : p[0]; return p.join(':'); };
/* inside chalk on the iPad (window.PB_EMBED set by chalk): no sync, nothing written to that page's storage */
const EMBED = window.PB_EMBED && typeof window.PB_EMBED === 'object' ? window.PB_EMBED : null;
const MEM = new Map();

/* ================= diagnostics: always on ================= */
let DIAG = [];
let diagTimer = null;
let failing = false;
function lsGetRaw(k){ if (EMBED) return MEM.has(k) ? MEM.get(k) : null; try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSetRaw(k,v){ if (EMBED){ MEM.set(k, String(v)); return true; } try { localStorage.setItem(k,v); return true; } catch(e){ return e; } }
function lsGetJSON(k, fb){ const raw = lsGetRaw(k); if (raw == null) return fb; try { return JSON.parse(raw); } catch(e){ return fb; } }
function diag(stage, msg, data){
  const e = {t:Date.now(), s:stage, m:msg};
  if (data !== undefined) e.d = data;
  DIAG.push(e);
  if (DIAG.length > 400) DIAG.splice(0, DIAG.length - 400);
  try { console.log('[pb]', stage, msg, data === undefined ? '' : data); } catch(_){}
  if (!diagTimer) diagTimer = setTimeout(() => { diagTimer = null; lsSetRaw(KEYS.diag, JSON.stringify(DIAG)); }, 400);
}
function snapshot(){
  try { return JSON.parse(JSON.stringify({view:VIEW, W, V})); } catch(e){ return {snapshotError:String(e)}; }
}
function dump(stage, expected, got, extra){
  let arr = lsGetJSON(KEYS.dumps, []);
  if (!Array.isArray(arr)) arr = [];
  const n = (arr.length ? (arr[arr.length-1].n|0) : 0) + 1;
  arr.push({n, t:new Date().toISOString(), version:VERSION, stage, expected, got, extra:extra === undefined ? null : extra, state:snapshot()});
  while (arr.length > 5) arr.shift();
  lsSetRaw(KEYS.dumps, JSON.stringify(arr));
  diag(stage, `FAIL expected ${expected}, got ${got} → dump #${n}`);
  return n;
}
function fail(stage, expected, got, extra){
  if (failing) return 0;
  failing = true;
  let n = 0;
  try { n = dump(stage, expected, got, extra); toast(`<b>${esc(stage)}</b>: expected ${esc(expected)}, got ${esc(got)}. Dump #${n} in Diagnostics.`, 'err'); }
  finally { failing = false; }
  return n;
}
window.addEventListener('error', ev => fail('runtime', 'no error', `${ev.message} @${ev.lineno}:${ev.colno}`, ev.error && ev.error.stack ? String(ev.error.stack) : null));
window.addEventListener('unhandledrejection', ev => fail('runtime.promise', 'no rejection', String(ev.reason && ev.reason.message || ev.reason)));

/* ================= slot geometry (pure) ================= */
function slotXY(key, hash, qb){
  const [side, col, row] = key.split(':');
  const bxv = BALL_X[hash] != null ? BALL_X[hash] : BALL_X.M;
  const sg = side === 'R' ? 1 : -1;
  if (col in BALL_COL) return {x:sg * BALL_COL[col], r:+row};
  if (col in SIDE_COL) return {x:(side === 'R' ? FW - SIDE_COL[col] : SIDE_COL[col]) - bxv, r:+row};
  if (col === 'FB') return {x:side === 'M' ? 0 : sg * 2, r:qb === 'gun' ? 5 : 4};
  if (col === 'TB') return {x:0, r:7};
  if (col === 'HB') return {x:sg * 4, r:1};
  return null;
}
function slotOK(key, type, qb){
  const [side, col, row] = key.split(':');
  if (RCOLS.includes(col)) return type !== 'L' || row === '0';
  if (type === 'L') return false;
  if (col === 'FB' && side === 'M') return qb === 'under';
  return true;
}
function dbXY(key, hash){
  const [side, col, row] = key.split(':');
  const bxv = BALL_X[hash] != null ? BALL_X[hash] : BALL_X.M;
  const d = DROW_DEPTH[row], sg = side === 'R' ? 1 : -1;
  if (col === 'M') return {x:FW / 2 - bxv, d};
  if (col in BALL_COL) return {x:sg * BALL_COL[col], d};
  return {x:(side === 'R' ? FW - SIDE_COL[col] : SIDE_COL[col]) - bxv, d};
}

/* ================= formation code (strong / weak) =================
   O + personnel (6/ in front for a sixth lineman) + QB letter, then each man in 2–3 characters:
   s strong / w weak + I T S N W (O = extra lineman) + nothing on the ball, ' off, " stack
   backfield Hw Bw B T Bs Hs. Order: weak outside → in, backfield, strong inside → out.
   Strong = the tight end's side (the side with more of them); no tight end (or one each side) → more men on that side
   (receivers + H-backs); still even → the code that sorts first. */
function sideCounts(tokens){
  const c = {L:{n:0, t:0}, R:{n:0, t:0}};
  tokens.forEach(t => {
    if (!t.slot || t.type === 'L') return;
    const [side, col] = t.slot.split(':');
    if (side === 'M') return;
    if (RCOLS.includes(col) || col === 'HB'){ c[side].n++; if (t.type === 'T') c[side].t++; }
  });
  return c;
}
function codeBody(tokens, strong){
  const sw = side => side === strong ? 's' : 'w';
  const items = tokens.filter(t => t.slot).map(t => {
    const [side, col, row] = t.slot.split(':');
    if (RCOLS.includes(col)){
      const c = t.type === 'L' ? 'O' : col, st = sw(side), ri = OROWS.indexOf(+row);
      return {k:st === 'w' ? -100 + (5 - COL_RANK[c]) * 10 + ri : 100 + COL_RANK[c] * 10 + ri, s:st + c + OMARK[+row]};
    }
    if (col === 'FB'){ if (side === 'M') return {k:-10, s:'B'}; const st = sw(side); return {k:st === 'w' ? -15 : 5, s:'B' + st}; }
    if (col === 'TB') return {k:-5, s:'T'};
    if (col === 'HB'){ const st = sw(side); return {k:st === 'w' ? -20 : 10, s:'H' + st}; }
    return {k:999, s:'?'};
  });
  items.sort((a,b) => a.k - b.k || (a.s < b.s ? -1 : a.s > b.s ? 1 : 0));
  return items.map(i => i.s).join(' ');
}
function strengthOf(tokens){
  const c = sideCounts(tokens);
  if (c.L.t !== c.R.t) return c.R.t > c.L.t ? 'R' : 'L';
  if (c.L.n !== c.R.n) return c.R.n > c.L.n ? 'R' : 'L';
  return codeBody(tokens, 'R') <= codeBody(tokens, 'L') ? 'R' : 'L';
}
const persStr = (pers, xol) => (xol ? '6/' : '') + pers;
function formationCodeOf(off){ return `O${persStr(off.pers, off.xol)}${QB_LETTER[off.qb]} ${codeBody(off.tokens, strengthOf(off.tokens))}`; }
const spotStr = sp => sp === 50 ? '50' : (sp < 0 ? String(sp) : '+' + sp);
const spotLabel = sp => sp === 50 ? '50' : (sp < 0 ? `Own ${-sp}` : `Opp ${sp}`);
const spotAbs = sp => sp === 50 ? 50 : (sp < 0 ? -sp : 100 - sp);
function defCode(def, strong){
  const sgnSide = side => side === strong ? 1 : -1;
  const items = [];
  def.box.forEach(b => {
    const side = b.x > 0 ? 'R' : 'L';
    const st = b.x === 0 ? '' : (side === strong ? 's' : 'w');
    items.push({k:b.x === 0 ? 0 : sgnSide(side) * Math.abs(b.x), d:b.d, s:st + techOf(b.x) + (b.d === 1 ? (b.hand === 'up' ? '^' : '') : "'")});
  });
  def.dbs.forEach(o => {
    const [side, col, row] = o.slot.split(':');
    if (col === 'M') items.push({k:0, d:DROW_DEPTH[row], s:'M' + DMARK[row]});
    else items.push({k:sgnSide(side) * DNOM[col], d:DROW_DEPTH[row], s:(side === strong ? 's' : 'w') + col + DMARK[row]});
  });
  items.sort((a,b) => a.k - b.k || a.d - b.d || (a.s < b.s ? -1 : a.s > b.s ? 1 : 0));
  return 'D ' + items.map(i => i.s).join(' ');
}
function playCode(p){
  let s = `${p.fcode} | ${p.strength}${p.hash}${spotStr(p.spot)}`;
  if (p.def) s += ' | ' + defCode(p.def, p.strength) + (p.def.cov ? ` | ${p.def.cov.code} ${p.def.cov.rcode}` : '');
  return s;
}
function parseFormation(text){
  const errors = [];
  const parts = String(text || '').trim().split('|').map(s => s.trim());
  const s = (parts[0] || '').replace(/\s+/g, ' ');
  const m = s.match(/^O(6\/)?(\d\d)([UPG])\s+(.+)$/);
  if (!m) return {errors:[`header: expected like O11G or O6/22U, got "${s.slice(0, 12)}"`]};
  const xol = !!m[1], pers = m[2], qb = QB_FROM_LETTER[m[3]];
  const out = [];
  m[4].split(' ').forEach(tk => {
    let r;
    if ((r = tk.match(/^([sw])([ITSNWO])(['"]?)$/))) out.push({slot:`${r[1] === 's' ? 'R' : 'L'}:${r[2] === 'O' ? 'I' : r[2]}:${MARK_ROW[r[3]]}`, ol:r[2] === 'O'});
    else if ((r = tk.match(/^B([sw]?)$/))) out.push({slot:`${r[1] === '' ? 'M' : (r[1] === 's' ? 'R' : 'L')}:FB`});
    else if (tk === 'T') out.push({slot:'M:TB'});
    else if ((r = tk.match(/^H([sw])$/))) out.push({slot:`${r[1] === 's' ? 'R' : 'L'}:HB`});
    else errors.push(`token: expected like wN sS' Bs T Hw, got "${tk}"`);
  });
  const nol = out.filter(o => o.ol).length;
  if (out.length !== 5) errors.push(`players: expected 5, got ${out.length}`);
  if (nol !== (xol ? 1 : 0)) errors.push(`extra lineman: expected ${xol ? 1 : 0} O token, got ${nol}`);
  if (new Set(out.map(o => o.slot)).size !== out.length) errors.push('slots: two men in one slot');
  if (+pers[0] + +pers[1] > 5 - (xol ? 1 : 0)) errors.push(`personnel: ${persStr(pers, xol)} needs more skill players than fit`);
  let sit = null;
  if (parts[1]){
    const sm = parts[1].match(/^([LR])([LMR])(50|[+-]\d{1,2})$/);
    if (sm) sit = {strength:sm[1], hash:sm[2], spot:sm[3] === '50' ? 50 : parseInt(sm[3], 10)};
    else errors.push(`situation: expected like RM-35, got "${parts[1].slice(0, 10)}"`);
  }
  return {errors, xol, pers, qb, out, sit};
}
function inferTypes(out, pers){
  const type = {};
  out.forEach((o,i) => { if (o.ol) type[i] = 'L'; });
  const free = pred => out.map((o,i) => i).filter(i => !type[i] && pred(out[i]));
  const take = (list, n, t) => { for (const i of list){ if (n <= 0) break; if (!type[i]){ type[i] = t; n--; } } return n; };
  let nb = +pers[0], nt = +pers[1];
  nb = take(free(o => o.slot === 'M:TB'), nb, 'B');
  nb = take(free(o => /:FB$/.test(o.slot)), nb, 'B');
  nb = take(free(o => /:HB$/.test(o.slot)), nb, 'B');
  take(free(() => true), nb, 'B');
  nt = take(free(o => /:I:0$/.test(o.slot)), nt, 'T');
  nt = take(free(o => /:I:/.test(o.slot)), nt, 'T');
  nt = take(free(o => /:HB$/.test(o.slot)), nt, 'T');
  take(free(() => true), nt, 'T');
  return out.map((o,i) => type[i] || 'W');
}

      const q = slotXY(k, hash, qb);

   phone.json — written only by this app: formations, fronts, designs, plays, deleted ids, hold.
   ipad.json  — written only by chalk on the iPad: queue (plays waiting to be logged), tags (sets picked there).

const GIST_DESC = 'chalk-playbook sync v1';
const SYNC = {token:null, id:null, etag:null, state:'off', err:null, lastPull:0, lastPush:0, ipad:{queue:[], tags:[], adds:[], at:null},
  hold:null, timer:null, wtimer:null, writing:false, dirty:false, deleted:[], merged:false, failed:false, framesCleared:null, backoffUntil:0};

  const d = lsGetJSON('pb.deleted', []); SYNC.deleted = Array.isArray(d) ? d : [];

async function gh(method, path, body, etag){

  const t0 = performance.now(), lim = method === 'GET' ? 45000 : 30000;   // 0.16.0: a slow GitHub isn't a dead one, but a hung request doesn't wait forever
  const headers = {'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + SYNC.token, 'X-GitHub-Api-Version':'2022-11-28'};
  if (etag) headers['If-None-Match'] = etag;
  const ctl = typeof AbortController === 'function' ? new AbortController() : null, timer = ctl ? setTimeout(() => ctl.abort(), lim) : null;
  let res, text = '';
  try {
    res = await fetch('https://api.github.com' + path, {method, headers, body:body ? JSON.stringify(body) : undefined, cache:'no-store', signal:ctl ? ctl.signal : undefined});
    if (res.status !== 304) text = await res.text();

  catch(e){ throw {status:0, msg:e && e.name === 'AbortError' ? `GitHub took over ${lim / 1000} s` : 'network: ' + String(e && e.message || e)}; }

  if (res.status === 304) return {status:304};
  let json = null; try { json = text ? JSON.parse(text) : null; } catch(_){}
  diag('sync.http', `${method} ${path.replace(/\?.*/, '')} → ${res.status} in ${ms} ms, ${left} calls left this hour`);
  if (!res.ok){
    const err = {status:res.status, msg:(json && json.message) || text.slice(0, 160), body:text.slice(0, 2000), left, retry:res.headers.get('retry-after'), reset:res.headers.get('x-ratelimit-reset')};

}
function ghBackoff(e){   // 0.16.0: GitHub said slow down — a secondary limit (403/429, maybe with a wait) or the hour's calls spent: every request waits it out
  if (!e || !(e.status === 403 || e.status === 429)) return;
  if (!(/rate limit|abuse|too many|secondary/i.test(String(e.msg || '')) || e.retry != null || String(e.left) === '0')) return;
  let wait = e.retry != null && isFinite(+e.retry) ? +e.retry * 1000 : 0;
  if (!wait && String(e.left) === '0' && e.reset != null && isFinite(+e.reset)) wait = +e.reset * 1000 - Date.now();
  wait = Math.min(3600e3, Math.max(60e3, wait || 60e3));
  if (Date.now() + wait <= (SYNC.backoffUntil || 0)) return;
  SYNC.backoffUntil = Date.now() + wait;

function validateOffense(o){

  if (!(o.qb in QB_DEPTH)) e.push(`qb: expected under|pistol|gun, got ${JSON.stringify(o.qb)}`);
  if (!Array.isArray(o.tokens) || o.tokens.length !== 5){
    e.push(`players: expected 5, got ${Array.isArray(o.tokens) ? o.tokens.length : typeof o.tokens}`);
    return e;
  }
  const seen = new Set();
  o.tokens.forEach((t,i) => {
    if (!t || !OFF_KEYS.includes(t.slot)) e.push(`player[${i}].slot: expected a slot like R:S:1, got ${t && t.slot}`);
    else if (!slotOK(t.slot, t.type, o.qb)) e.push(`player[${i}]: ${TYPE_LABEL[t.type] || t.type} cannot stand at ${t.slot} with the QB ${o.qb}`);
    if (!/^[BTWL]$/.test(t && t.type || '')) e.push(`player[${i}].type: expected B/T/W/L, got ${t && t.type}`);
    if (t && seen.has(t.slot)) e.push(`player[${i}]: slot ${t.slot} used twice`);

function validateDefense(d){

function pt(e){ const r = svg.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }

function offDown(p){

function routeDown(p){

  const selM = M.find(m => m.id === W.rsel);

    if (h && Math.hypot(h.q[0] - p.x, h.q[1] - p.y) < 26){

        const q = scr([d.x, d.Y]), hm = nearest(M, manXY, p);
        const dd = Math.hypot(q[0] - p.x, q[1] - p.y), md = hm ? Math.hypot(manXY(hm)[0] - p.x, manXY(hm)[1] - p.y) : Infinity;

  drag.dX = dX; drag.dY = dY;

function routeUp(){

/* chips: tap one to give it to the picked man, or drag it onto any man. Whole-play chips stamp all 11. */
function chipTargets(g){
  const M = men();
  if (g === 'route' || g === 'motion') return M.filter(m => m.kind === 'skill');
  if (g === 'run' || g === 'concept') return M.filter(m => m.kind !== 'ol');

function dropTarget(cx, cy, g){
  const rc = svg.getBoundingClientRect();
  const p = {x:cx - rc.left, y:cy - rc.top - 28};
  if (p.x < 0 || p.x > rc.width || p.y < -20 || p.y > rc.height) return null;
  let best = null, bd = 48;
  chipTargets(g).forEach(m => { const q = manXY(m); const d = Math.hypot(q[0] - p.x, q[1] - p.y); if (d < bd){ bd = d; best = m.id; } });

function applyChip(g, name, m){
  const ps = W.pside;

    if (name === 'Pass pro'){ men().filter(q => q.kind === 'ol').forEach(q => setArt(q, 'block', BLK.pro(q))); W.concept = null; }
    else { const c = CONCEPTS.find(q => q[1] === name); if (!c){ W.rhist.pop(); fail('chip', 'a known concept', name); return; } buildConcept(c[0], ps, m ? m.id : null); }

  }
  if (g === 'route') setRoute(m, name);
  else if (g === 'motion'){ if (name === 'None') delete W.motion[m.id]; else setMotion(m, name); }
  else if (g === 'run'){ if (!(m.kind === 'qb' ? setQB(m, name, ps) : setCarry(m, name, ps))){ W.rhist.pop(); fail('chip', 'a known run', name); return; } }

    const a = W.routes[m.id];
    if (name === 'Pro') setArt(m, 'block', BLK.pro(m));
    else if (name === 'Hinge') setArt(m, 'block', BLK.hinge(m, ps));
    else if (name === 'Zone') setArt(m, 'block', BLK.zone(m, ps), 'Zone');
    else if (name === 'Pull' || name === 'Combo'){
      W.rhist.pop();
      if (!a || a.kind !== 'block' || !a.target){ toast('Tap the defender he blocks first.'); return; }
      pushRHist();
      if (name === 'Pull'){ a.pull = !isPulling(m, a); delete a.label; syncBlocks(); }
      else if (a.t2){ a.t2 = null; delete a.label; syncBlocks(); }
      else { W.pick = 'combo'; diag('chip', `${m.tag} combo: waiting for the second man`); return; }
    }

  const i = artInfo(m), mn = motionName(m);

}
function endChip(e, cancel){

function parseDefTokens(text){
  const toks = String(text || '').trim().replace(/^D\s+/, '').split(/\s+/).filter(Boolean);
  const box = [], dbs = [], errors = [];
  const sideOf = c => c === 's' ? W.strength : (W.strength === 'R' ? 'L' : 'R');
  toks.forEach(tk => {
    let m;
    if ((m = tk.match(/^([sw]?)(0|1|2i|2|3|4i|4|5|7|6|9)(\^|')?$/))){
      const tx = TECH_X.find(([t]) => t === m[2])[1];
      if (tx !== 0 && !m[1]){ errors.push(`"${tk}": expected s or w in front, like w${m[2]}`); return; }
      const x = tx === 0 ? 0 : (sideOf(m[1]) === 'R' ? tx : -tx);
      const lb = m[3] === "'";
      box.push({x, d:lb ? 5 : 1, hand:lb ? null : (m[3] === '^' ? 'up' : 'down')});
    }
    else if ((m = tk.match(/^([sw])([ITSNW])(['"]?)$/))) dbs.push(`${sideOf(m[1])}:${m[2]}:${m[3] === '' ? 'p' : (m[3] === "'" ? 'o' : 'd')}`);
    else if ((m = tk.match(/^M(['"])$/))) dbs.push(`M:M:${m[1] === "'" ? 'o' : 'd'}`);
    else errors.push(`"${tk}": expected like w5, s9^, w2', sN', M"`);
  });
  const bk = box.map(b => b.x + '/' + b.d);
  if (new Set(bk).size !== bk.length) errors.push('box: two men on one technique at the same depth');
  if (new Set(dbs).size !== dbs.length) errors.push('backs: two men in one slot');
  if (box.length + dbs.length > 11) errors.push(`count: expected 11 or fewer, got ${box.length + dbs.length}`);
  return {box, dbs, errors};
}

/* ================= PBA · shared by Playbook and chalk =================
   Play art (square, Polaroid-style), coverage calls built on any front, the front's ID, and the glossary that
   says what every naming word means. Pure: no page, no storage. Yards: x across from the ball (right +),
   Y from the line of scrimmage (toward the defense +). The ball sits in the middle of the field. */
const PBA = (() => {
  'use strict';
  const FW = 160 / 3, HASH = 70.75 / 3, HX = FW / 2 - HASH;
  const BALL_COL = {I:6, T:9, S:12}, SIDE_COL = {N:8, W:4};
  const QB_DEPTH = {under:1, pistol:4, gun:5};
  const DROW = {p:1, o:6, d:12};
  const RCOLS = ['I','T','S','N','W'];
  const DB_KEYS = ['L','R'].flatMap(s => RCOLS.flatMap(c => ['p','o','d'].map(r => `${s}:${c}:${r}`))).concat(['M:M:o','M:M:d']);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const f1 = v => (Math.round(v * 10) / 10).toString();
  const mirror = k => { const p = String(k).split(':'); p[0] = p[0] === 'L' ? 'R' : p[0] === 'R' ? 'L' : p[0]; return p.join(':'); };
  const TECH = [['0',0],['1',0.5],['2i',1.5],['2',2],['3',2.5],['4i',3.5],['4',4],['5',4.5],['7',5.5],['6',6],['9',6.5]];
  const techOf = x => { const a = Math.abs(x); const t = TECH.find(([,v]) => Math.abs(v - a) < 0.01); return t ? t[0] : String(a); };

  /* ---- geometry: the same slots both apps use ---- */
  function offXY(key, qb){
    const [side, col, row] = String(key).split(':'), sg = side === 'R' ? 1 : -1;
    if (col in BALL_COL) return {x:sg * BALL_COL[col], r:+row};
    if (col in SIDE_COL) return {x:(side === 'R' ? FW - SIDE_COL[col] : SIDE_COL[col]) - FW / 2, r:+row};
    if (col === 'FB') return {x:side === 'M' ? 0 : sg * 2, r:qb === 'gun' ? 5 : 4};
    if (col === 'TB') return {x:0, r:7};
    if (col === 'HB') return {x:sg * 4, r:1};
    return null;
  }
  function dbXY(key){
    const [side, col, row] = String(key).split(':'), d = DROW[row], sg = side === 'R' ? 1 : -1;
    if (d == null) return null;
    if (col === 'M') return {x:0, d};
    if (col in BALL_COL) return {x:sg * BALL_COL[col], d};
    if (col in SIDE_COL) return {x:(side === 'R' ? FW - SIDE_COL[col] : SIDE_COL[col]) - FW / 2, d};
    return null;
  }
  const offY = r => -r - 0.6, defY = d => d - 0.4;

  /* ---- who is who on a front: corners, safeties, the rest ---- */
  function people(front){
    const D = [];
    (front.box || []).forEach((b,i) => D.push({k:'b' + i, kind:'box', x:+b.x, Y:defY(b.d), d:b.d, lvl:b.d === 1 ? 'dl' : 'lb', hand:b.d === 1 ? (b.hand || 'down') : null}));
    (front.dbs || []).forEach((o,i) => { const q = dbXY(o.slot); if (q) D.push({k:'d' + i, kind:'db', slot:o.slot, x:q.x, Y:defY(q.d), d:q.d, lvl:'db'}); });
    return D;
  }
  function targets(off){
    if (!off || !Array.isArray(off.tokens)) return [];
    return off.tokens.filter(t => t && t.slot && t.type !== 'L').map(t => { const q = offXY(t.slot, off.qb); return q ? {key:t.slot, x:q.x, Y:offY(q.r), type:t.type} : null; }).filter(Boolean);
  }
  function roster(front, strong){
    const sg = strong === 'L' ? -1 : 1, D = people(front), dbs = D.filter(d => d.lvl === 'db');
    const corner = s => dbs.filter(d => Math.sign(d.x) === s && Math.abs(d.x) >= 8).sort((a,b) => Math.abs(b.x) - Math.abs(a.x))[0] || null;
    const cS = corner(sg), cW = corner(-sg);
    const others = dbs.filter(d => d !== cS && d !== cW);
    /* the free safety is the deepest, most central back; the strong safety the next deepest, strong side first */
    let FS = others.filter(d => d.d >= 6).sort((a,b) => b.d - a.d || Math.abs(a.x) - Math.abs(b.x))[0] || null;
    let SS = others.filter(d => d !== FS && d.d >= 6).sort((a,b) => b.d - a.d || ((b.x * sg > 0) - (a.x * sg > 0)) || Math.abs(a.x) - Math.abs(b.x))[0] || null;
    if (FS && SS && FS.x * sg > 0 && SS.x * sg < 0){ const t = FS; FS = SS; SS = t; }
    const saf = [FS, SS].filter(Boolean);
    const nick = others.filter(d => !saf.includes(d));
    const downs = D.filter(d => d.lvl === 'dl' && d.hand !== 'up');
    const ups = D.filter(d => d.lvl === 'dl' && d.hand === 'up').sort((a,b) => a.x * sg - b.x * sg);
    const lbs = D.filter(d => d.lvl === 'lb').sort((a,b) => a.x * sg - b.x * sg);
    const mike = lbs.length ? lbs.slice().sort((a,b) => Math.abs(a.x) - Math.abs(b.x))[0] : null;
    return {sg, D, dbs, cS, cW, FS, SS, nick, downs, ups, lbs, mike};
  }

  /* ---- coverage calls: every one works on any front with enough bodies; the front's own logic picks who ---- */
  const COVS = [
    {id:'c0',  name:'Cover 0',        code:'C0',  shell:0, need:{},                note:'All-out man. Nobody deep. Six or more come.'},
    {id:'c1',  name:'Cover 1',        code:'C1',  shell:1, need:{saf:1},           note:'Man free: one post safety, man under, five rush.'},
    {id:'c1h', name:'Cover 1 Hole',   code:'C1H', shell:1, need:{saf:1},           note:'Man free with a rat: a backer sits in the hole, four rush.'},
    {id:'c1r', name:'Cover 1 Robber', code:'C1R', shell:1, need:{saf:2},           note:'Man free. The strong safety robs the hole; a backer takes the tight end.'},
    {id:'c2',  name:'Cover 2',        code:'C2',  shell:2, need:{saf:2},           note:'Two deep halves. Hard corners squat the flats. Five under.'},
    {id:'c2t', name:'Tampa 2',        code:'C2T', shell:2, need:{saf:2, lb:1},     note:'Cover 2 with the Mike running the deep middle hole.'},
    {id:'c2m', name:'2 Man',          code:'C2M', shell:2, need:{saf:2},           note:'Halves over man. Everyone under trails with inside leverage.'},
    {id:'c3',  name:'Cover 3 Sky',    code:'C3',  shell:1, need:{saf:1, cb:2},     note:'Corners and the free safety split the deep thirds. The strong safety rolls down to the curl-flat.'},
    {id:'c3c', name:'Cover 3 Cloud',  code:'C3C', shell:1, need:{saf:2, cb:2},     note:'The strong corner squats the flat; the strong safety bails to his deep third.'},
    {id:'c3b', name:'Cover 3 Buzz',   code:'C3B', shell:1, need:{saf:2, cb:2},     note:'The strong safety buzzes to the hook-curl; the Sam widens to the flat.'},
    {id:'c4',  name:'Cover 4',        code:'C4',  shell:2, need:{saf:2, cb:2},     note:'Quarters: four deep, three under. Safeties read #2 and fit the run.'},
    {id:'c4p', name:'Cover 4 Palms',  code:'C4P', shell:2, need:{saf:2, cb:2},     note:'Quarters look. Corners clue #2: vertical, stay in quarters; out, squat him and it is Cover 2.'},
    {id:'c6',  name:'Cover 6',        code:'C6',  shell:2, need:{saf:2, cb:2},     note:'Split field: quarters to the strength, cloud (a half and a squat corner) away.'},
    {id:'fz',  name:'Fire Zone',      code:'FZ',  shell:1, need:{saf:1, cb:2, lb:1}, note:'Five-man zone pressure: a backer blitzes. Three under, three deep.'}
  ];
  const UN = {1:['Middle hook'], 2:['Hook','Hook'], 3:['Curl-flat','Middle hook','Curl-flat'], 4:['Curl-flat','Hook','Hook','Curl-flat'],

  /* ---------- a logged play → the call ---------- */
  const RMAP = {Fade:'Go', 'Skinny post':'Post', 'Quick out':'Out', 'Deep out':'Sail', 'Out & up':'Go', 'Stop & go':'Go', Sluggo:'Go', 'Post-corner':'Corner', 'Corner-post':'Post', Angle:'Choice', Whip:'Drag', 'Pivot':'Choice'};

    add('off', 'pers', persText(pr, rawP), {why:pr.backs + ' back' + (pr.backs === 1 ? '' : 's') + ', ' + pr.te + ' tight end' + (pr.te === 1 ? '' : 's') + ' — said only on a play.', alts:[pr.d, pr.d + ' personnel']}, 'pers');

    const dz = o.design;
    const letterAt = slot => { const i = (p.off.tokens || []).findIndex(t => t.slot === slot); return i >= 0 ? A.letters[i] : null; };
    const sgS = A.strong === 'R' ? 1 : -1;
    const routes = {};
    let carry = null;
    if (dz && Array.isArray(dz.arts)){
      dz.arts.forEach(a => {
        const who = letterAt(a.who) || a.tag || '';
        if (a.mname && who){

        const dd = [def, press && press, cov].filter(Boolean).join(', ');

    if (len === 'pro') return [off].concat(mv, [play]).filter(Boolean).join(' ');

      const setW = vis(s.off).filter(c => c.part !== 'pers').map(c => c.show === c.neutral && ENG.ABBR[c.neutral] ? ENG.ABBR[c.neutral] : c.show).join(' ');
      const mvW = vis(s.move).map(c => c.show.replace(/ (Strong|Weak)$/, (m, w) => ' ' + w[0]));
      let pW = play;
      Object.keys(RUN_S).forEach(k => { if (k !== 'done' && pW.startsWith(k + ' ')) pW = RUN_S[k] + pW.slice(k.length).replace(/ (Strong|Weak)/, (m, w) => ' ' + w[0]); });

/* ================= names on the phone: config, chips, the name step, the Names sheet =================
   The set's name is read from its slots by NAMES. What you change is kept as parts (locks, hidden words, added tags),
   your own name for a set is kept as myName, and the config syncs to chalk in phone.json. */
const NAMEKEY = 'pb.names';
function namesLoad(){ NAMES.use(lsGetJSON(NAMEKEY, null) || {}); }
function namesSave(){ const c = NAMES.cfg(); c.at = isoNow(); lsSetRaw(NAMEKEY, JSON.stringify(c)); }
function namesAdopt(src){
  if (!src || typeof src !== 'object') return false;

/* the set as the name engine sees it */
const nameX = (f, extra) => Object.assign({id:f.id, qb:f.qb, xol:!!f.xol, tokens:f.tokens, myName:f.myName || null, nameOv:f.base ? null : (f.nameOv || null)}, extra || {});

/* the call block on a logged play: read-only chips (tap or hold explains), the call at the detail length */
function callBlock(p){

  const all = ['off','move','play','def','press','cov','sit'].flatMap(k => V.segs[k]);
  nchipCtx('play:' + p.id, {chips:all, ro:true});
  return `<div class="lbl">The call</div>${nchipsHTML('play:' + p.id, all, true)}<div class="ncall">${esc(NAMES.callText(V, NAMES.st().len.detail, 'slash'))}</div>`;

/* one-time: sets named before the neutral names keep their old name as an alias; the engine's read shows */
function namesMigrate(){

    if (f.nf || !Array.isArray(f.tokens)) return;
    const neutral = NAMES.setText(nameX(f), 'pro', {neutral:true});

/* ---- chips: tap = options, hold = explain, swipe = hide ---- */
const NCH = {};
const NKL = {backfield:'Backfield', word:'Formation', dir:'Strength', tag:'Tag', family:'Family', pers:'Personnel', motion:'Motion', play:'Play', def:'Defense', cov:'Coverage', press:'Pressure', sit:'Situation'};

function nchipHTML(ctx, c){
  const nt = NAMES.st().showNeutral && c.show !== c.neutral ? `<span class="nt">${esc(c.neutral)}</span>` : '';
  return `<button class="nchip k-${c.kind}${c.unsure ? ' unsure' : ''}${c.locked ? ' locked' : ''}${c.hidden ? ' hid' : ''}" data-ck="${esc(ctx)}" data-cp="${esc(c.part)}"><span class="k">${esc(npartLabel(c))}</span><span class="v">${esc(c.show)}</span>${nt}</button>`;
}
function nchipsHTML(ctx, chips, ro){

  return `<div class="nchips${ro ? ' ro' : ''}">${chips.map(c => nchipHTML(ctx, c)).join('')}</div>${ro ? '' : '<div class="nleg">Tap a word for options · hold to explain · swipe to hide · dashed = judgment call</div>'}`;

/* ctx: {chips, store() → {locks, hidden}, saved(), back()} */
function nchipCtx(key, o){ NCH[key] = o; }
function nglossOf(w){
  const g = [].concat(PBA.GLOSS.pro.words, PBA.GLOSS.desc.words, PBA.GLOSS.defense.words).find(([k]) => k.split(/\s*\/\s*|\s*\(/)[0].trim().toLowerCase() === String(w).toLowerCase());
  if (g) return g[1] + (g[2] && g[2] !== '—' ? ' Opposite: ' + g[2] + '.' : '');
  if (ENG.PLAIN[w]) return ENG.PLAIN[w][0].toUpperCase() + ENG.PLAIN[w].slice(1) + '.';
  const r = CALL.RUNS.find(x => String(w).startsWith(x.k)); if (r) return r.why;
  const cn = Object.keys(CALL.CONCEPT).find(k => String(w).startsWith(k)); if (cn) return CALL.CONCEPT[cn].why;

    <h3 class="nsv">${esc(c.show)}</h3>
    ${c.show !== c.neutral ? `<p>Neutral word underneath: <b>${esc(c.neutral)}</b></p>` : ''}
    <p>${esc(c.why || '')}</p>${g && g !== c.why ? `<div class="ngl"><b>${esc(c.neutral)}</b> — ${esc(g)}</div>` : ''}
    ${explain || R.ro ? `<div class="row">${R.ro ? '' : '<button class="btn" data-act="nchipMore">More options</button>'}<button class="btn pri" data-act="nchipBack">Got it</button></div>` : `
    ${alts.length > 1 ? `<div class="lbl">Say it another way</div><div class="sugs">${alts.map((a, i) => `<button class="sug c ${a === c.show || a === c.neutral ? 'on' : ''}" data-act="nchipAlt" data-i="${i}">${esc(a)}<small>${a === c.auto ? 'rule read' : 'lock this'}</small></button>`).join('')}</div>` : ''}
    <div class="row"><button class="btn" data-act="nchipLock">${c.locked ? 'Unlock' : 'Lock'}</button><button class="btn" data-act="nchipHide">${c.hidden ? 'Show' : 'Hide'}</button><button class="btn" data-act="nchipReset">Reset</button></div>
    <button class="btn" data-act="nchipBack">Done</button>`}`);
  NCH._alts = alts;
}
function nchipDo(kind, val){
  const o = NCH._open; if (!o) return;
  const R = NCH[o.key]; if (!R) return;
  const s = R.store(); s.locks = s.locks || {}; s.hidden = s.hidden || [];
  const c = R.chips.find(x => x.part === o.part);
  if (kind === 'alt'){ if (c && val === c.auto) delete s.locks[o.part]; else s.locks[o.part] = val; }
  if (kind === 'lock'){ if (s.locks[o.part] != null) delete s.locks[o.part]; else if (c) s.locks[o.part] = c.neutral; }
  if (kind === 'hide'){ const i = s.hidden.indexOf(o.part); if (i >= 0) s.hidden.splice(i, 1); else s.hidden.push(o.part); }
  if (kind === 'reset'){ delete s.locks[o.part]; const i = s.hidden.indexOf(o.part); if (i >= 0) s.hidden.splice(i, 1); }

(function nchipGestures(){

    g.t = setTimeout(() => { if (g && !g.swiped){ g.fired = true; nchipOpen(el.dataset.ck, el.dataset.cp, true); } }, 480);
  });
  document.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;

    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ clearTimeout(g.t); g.el.style.transform = `translateX(${Math.max(-60, Math.min(60, dx))}px)`; g.el.style.opacity = String(1 - Math.min(0.6, Math.abs(dx) / 120)); if (Math.abs(dx) > 44) g.swiped = true; }

const persOf = v => { const s = String(v == null ? '' : v); return /^\d\d$/.test(s) && +s[0] + +s[1] <= 5 ? s : null; };
const qbOf = v => ({U:'under', S:'gun', G:'gun', P:'pistol', under:'under', gun:'gun', pistol:'pistol'})[v] || null;
const codeBodyOf = code => String(code || '').replace(/^O(6\/)?\d\d/, 'O$1');
const fmGet = id => (id && (S.formations.find(o => o.id === id) || BASE.formations.find(o => o.id === id))) || null;
const frGet = id => (id && (S.fronts.find(o => o.id === id) || BASE.fronts.find(o => o.id === id))) || null;
const fmName = (f, len) => !f ? '' : Array.isArray(f.tokens) && f.tokens.length ? NAMES.setText(nameX(f), NAMING === 'desc' ? 'plain' : (len || NAMES.st().len.list)) : (f.name || '');
const frName = f => f.base && NAMING === 'desc' && f.summary ? f.summary : f.name;
/* the name a base set is filed under: its pro name (Rt/Lt follows the play's strength), or the description with this
   play's personnel (the TE words go when it changed) and its sides turned when the strength is left */
function fmFiled(f, pers, strength){
  if (!f || !Array.isArray(f.tokens)) return (f && f.name) || '';
  let off = offFromSet(f, pers);
  if (strength === 'L' && strengthOf(off.tokens) === 'R') off = mirrorOff(off);
  return NAMES.setText(nameX(f, {qb:off.qb, xol:!!off.xol, tokens:off.tokens}), NAMING === 'desc' ? 'plain' : 'pro', {field:strength || null});
}
const mirrorOff = off => Object.assign({}, off, {tokens:off.tokens.map(t => ({type:t.type, slot:mirrorKey(t.slot)}))});
/* any set with any personnel: same slots, the men typed again the way a pasted code is */
function retype(off, pers){
  if (!persOf(pers)) return null;
  const xol = !!off.xol;
  if (+pers[0] + +pers[1] > 5 - (xol ? 1 : 0)) return null;
  const out = off.tokens.map(t => ({slot:t.slot, ol:t.type === 'L'}));
  const types = inferTypes(out, pers);
  const o = {pers, xol, qb:off.qb, tokens:out.map((q,i) => ({type:types[i], slot:q.slot}))};
  return validateOffense(o).length ? null : o;
}
function offFromSet(f, pers){
  const off = {pers:f.pers, xol:!!f.xol, qb:f.qb, tokens:f.tokens.map(t => ({type:t.type, slot:t.slot}))};
  if (pers && pers !== off.pers){ const r = retype(off, pers); if (r) return r; diag('retype', `${f.name} does not take ${pers} personnel: kept ${off.pers}`); }
  return off;
}
/* a front (stored strong right, or carrying the strength it was logged with) on a play with this strength */
function frontDef(d, strength, name){
  const flip = (d.strength === 'L' ? 'L' : 'R') !== (strength === 'L' ? 'L' : 'R');
  const box = d.box.map(b => { const x = flip && b.x !== 0 ? -b.x : b.x; return {x, d:b.d, hand:b.d === 1 ? b.hand : null, tech:techOf(x), label:b.label || null, cat:b.cat || (b.d === 1 && b.hand === 'down' ? 'DL' : 'LB')}; });
  const dbs = d.dbs.map(o => ({slot:flip ? mirrorKey(o.slot) : o.slot, label:o.label || null, kind:o.kind === 'deep' ? 'deep' : 'rest'}));
  const out = {box, dbs, shell:d.shell, summary:frontSummary(box, d.shell) + (d.cov ? ` · ${d.cov.name} · ${d.cov.pressure}` : ''), front:name || d.name || null};
  if (d.cov) out.cov = d.cov;
  if (d.roles && !flip) out.roles = d.roles;
  return out;
}
const frontNorm = (def, strength) => strength === 'L' ? Object.assign(mirrorDef(def), {strength:'R', roles:null}) : def;

/* ---- the base book: base-book.json beside this page, a copy kept on the phone ---- */
function baseAccept(b, stage){
  if (!b || !Array.isArray(b.formations) || !Array.isArray(b.fronts)){ fail(stage, 'a base book with formations[] + fronts[]', b ? Object.keys(b).join(',') : String(b)); return false; }
  const fms = [], frs = []; let bad = 0;
  b.formations.forEach(f => { const e = f && f.id ? validateOffense(f) : ['no id']; if (e.length){ bad++; diag(stage, `base set ${f && f.id}: ${e[0]}`); return; } fms.push(Object.assign({}, f, {base:true})); });
  b.fronts.forEach(f => { const e = f && f.id ? validateDefense(f) : ['no id']; if (e.length){ bad++; diag(stage, `base front ${f && f.id}: ${e[0]}`); return; } frs.push(Object.assign({}, f, {base:true})); });
  BASE.formations = fms; BASE.fronts = frs; BASE.at = b.at || null; BASE.state = 'on';
  diag(stage, `base book: ${fms.length} sets, ${frs.length} fronts, ${bad} skipped, written ${b.at}`);
  if (bad) toast(`<b>${esc(stage)}</b>: ${bad} base item(s) failed checks. See Diagnostics.`, 'err');
  return true;
}
async function baseLoad(){

    if (baseAccept(b, 'base.fetch')) lsSetRaw('pb.base', JSON.stringify(b));
  } catch(e){ diag('base.fetch', `base book not fetched (${e && e.message})${cached ? ': using the copy on this phone' : ''}`); if (!cached) BASE.state = 'error'; }
  setsTidy();   // 0.15.0: with the base book in, one set per formation and every set in a family
  adoptIpad();

/* ================= 0.15.0 families: every set lives in one — Gun, Pistol, Empty, Ace, I, Pro, … and any you add =================
   A base set's family is the NFL base book's (or wherever you moved it); yours is its own. A set made by changing another
   keeps that one's family unless you pick another; a set made from nothing reads its backfield. And one formation is one
   set: a set of yours that matches a base set stands in for it, and logging a play never makes a copy of a base set. */
const FAM_ORDER = ['Gun', 'Pistol', 'Empty', 'Ace', 'I', 'Pro', 'Heavy', 'Goal line', 'T', 'Wing-T', 'Option', 'Wildcat', 'Single wing', 'Victory', 'Trick'];
const FAM_OLD = {'Shotgun':'Gun', 'Singleback':'Ace', 'Split backs':'Pro', 'I formation':'I', 'T formation':'T'};   // the base book's first words for them
const famLabel = s => { const t = String(s == null ? '' : s).trim(); return FAM_OLD[t] || t; };
function famGuess(f){   // a set from nothing: the backfield says the family
  const back = ((f && Array.isArray(f.tokens)) ? f.tokens : []).filter(t => t && /:(FB|TB)$/.test(t.slot || '')).map(t => t.slot);
  if (!back.length) return 'Empty';
  if (f.qb === 'gun') return 'Gun';
  if (f.qb === 'pistol') return 'Pistol';
  if (back.length >= 3) return 'T';
  if (back.length === 2) return back.includes('L:FB') && back.includes('R:FB') ? 'Pro' : 'I';
  return 'Ace';
}
function codeOfSet(f){   // a base set's code as this app writes it (the book's own field is not trusted)
  if (!f) return '';
  if (!f.base) return f.code || '';
  if (!f._code){ try { f._code = formationCodeOf(f); } catch(e){ f._code = f.code || ''; } }
  return f._code;
}
let BASE_CODES = null, BASE_SIG = '';
function baseByCode(code){
  const sig = `${BASE.formations.length}|${BASE.at || ''}|${BASE.formations[0] ? BASE.formations[0].id : ''}`;
  if (!BASE_CODES || BASE_SIG !== sig){ BASE_CODES = new Map(); BASE.formations.forEach(b => { const c = codeOfSet(b); if (c && !BASE_CODES.has(c)) BASE_CODES.set(c, b); }); BASE_SIG = sig; }
  return (code && BASE_CODES.get(code)) || null;
}
const baseVisible = () => { const mine = new Set(S.formations.filter(f => !f._bad).map(f => f.code)); return BASE.formations.filter(b => !mine.has(codeOfSet(b))); };
function famOf(f){
  if (!f) return 'Other';
  return famLabel(f.base ? (S.famOv[f.id] || f.family) : f.family) || famGuess(f);
}
function famList(){   // the usual families that have sets, then yours in the order you made them, then any other a set carries
  const have = new Set(allSets().map(famOf)), out = FAM_ORDER.filter(x => have.has(x));
  S.famList.forEach(x => { if (!out.includes(x)) out.push(x); });
  [...have].forEach(x => { if (!out.includes(x)) out.push(x); });
  return out;
}
const famKnown = v => famList().concat(FAM_ORDER).find(x => x.toLowerCase() === String(v || '').trim().toLowerCase()) || null;
function famAdd(v){ const k = famKnown(v); if (k) return k; const t = String(v || '').trim(); if (!t) return null; S.famList.push(t); return t; }
function famApply(f, fam){   // move a set to a family; a base set's move is kept beside the book
  const v = famAdd(fam); if (!f || !v) return false;
  if (f.base) S.famOv[f.id] = v;
  else { f.family = v; f.updated = isoNow(); }
  if (!saveStore('family.set')) return false;
  if (!f.base) dbPut('formations', f, 'family.set');
  diag('family', `${f.base ? 'base ' : ''}${f.id} → ${v}`);
  return true;
}
function famSheet(title, cur, act, id){
  const at = id ? ` data-id="${esc(id)}"` : '';
  showSheet(`<h3>${esc(title)}</h3><p>Every set lives in one family. Pick one, or start a new one.</p>
    <div class="sugs">${famList().map(x => `<button class="sug${x === cur ? ' on' : ''}" data-act="${act}" data-v="${esc(x)}"${at}>${esc(x)}${x === cur ? '<small>now</small>' : ''}</button>`).join('')}</div>
    <div class="row"><input id="famNew" class="txt" placeholder="A new family" autocomplete="off" autocapitalize="words" spellcheck="false"><button class="btn pri slim" data-act="${act}" data-new="1"${at}>Add</button></div>
    <button class="btn" data-act="closeSheet">Cancel</button>`);
}
const famTyped = d => d.new ? String($('#famNew') ? $('#famNew').value : '').trim() : String(d.v || '').trim();
/* one formation, one set, every set in a family, no side in a name. On boot and after a merge; changes only what needs it. */
function setsTidy(){
  if (EMBED || !Array.isArray(S.formations)) return 0;
  const mine = new Map(); S.formations.forEach(f => { if (f && !f._bad && f.code) mine.set(f.code, f); });
  let fam = 0, moved = 0, named = 0;
  S.formations.forEach(f => {
    if (!f || f._bad || f.family) return;
    const b = baseByCode(f.code);
    f.family = b ? famOf(b) : famGuess(f); f.updated = isoNow(); fam++;
  });
  const baseIds = new Map(BASE.formations.map(b => [b.id, b]));
  S.plays.forEach(p => {   // a play logged on a base set you also keep a copy of: onto your copy, so the set is one row everywhere
    const b = p && p.formationId ? baseIds.get(p.formationId) : null; if (!b) return;
    const u = mine.get(codeOfSet(b)); if (!u) return;
    p.formationId = u.id; p.updated = isoNow(); moved++;
  });
  if (NAMES.st().dir === 'none'){
    const SIDE = /\b(Rt|Lt|Right|Left)\b/;
    S.formations.forEach(f => {
      if (!f || f._bad || f.myName || !SIDE.test(f.name || '')) return;
      const nm = NAMES.setText(nameX(f), 'pro', {neutral:true}); if (nm && nm !== f.name){ f.name = nm; f.updated = isoNow(); named++; }
    });
    S.plays.forEach(p => {
      if (!p || p._bad || !p.off || !Array.isArray(p.off.tokens) || !SIDE.test(p.name || '')) return;
      const u = S.formations.find(x => x.id === p.formationId);
      const nm = (u && u.myName) || NAMES.setText({qb:p.off.qb, xol:!!p.off.xol, tokens:p.off.tokens}, 'pro', {neutral:true});
      if (nm && nm !== p.name){ p.name = nm; p.updated = isoNow(); named++; }
    });
  }
  if (fam || moved || named){ saveStore('sets.tidy'); diag('sets.tidy', `${fam} sets given a family, ${moved} plays moved onto your copy of a base set, ${named} names without a side`); }
  return fam + moved + named;
}

}
function baseFmRows(act){

/* ---- the card's swipe: right confirms, left parks ---- */
const SWIPE = {id:null, x0:0, y0:0, dx:0, on:false, block:0, el:null};
document.addEventListener('pointerdown', e => {
  const c = e.target.closest && e.target.closest('#card');
  if (!c || VIEW !== 'home' || EMBED || e.target.closest('[data-noswipe]')) return;   // 0.16.0: the strip scrubs, it doesn't swipe
  Object.assign(SWIPE, {id:e.pointerId, x0:e.clientX, y0:e.clientY, dx:0, on:false, el:c});
});
document.addEventListener('pointermove', e => {
  if (e.pointerId !== SWIPE.id || !SWIPE.el) return;
  const dx = e.clientX - SWIPE.x0, dy = e.clientY - SWIPE.y0;
  if (!SWIPE.on){
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) SWIPE.on = true;
    else if (Math.abs(dy) > 12){ SWIPE.id = null; SWIPE.el = null; return; }
    else return;
  }
  SWIPE.dx = dx;
  SWIPE.el.style.transform = `translateX(${dx}px) rotate(${(dx / 40).toFixed(2)}deg)`;
  SWIPE.el.dataset.lean = dx > 60 ? 'ok' : dx < -60 ? 'park' : '';
});
function swipeEnd(e){
  if (e.pointerId !== SWIPE.id) return;
  const c = SWIPE.el, dx = SWIPE.dx, on = SWIPE.on;
  SWIPE.id = null; SWIPE.el = null;
  if (!c || !on) return;
  SWIPE.block = performance.now() + 350;
  diag('card.swipe', `${Math.round(dx)} px`);
  if (dx > 110 && e.type === 'pointerup') ACT.cardOk();
  else if (dx < -110 && e.type === 'pointerup') ACT.cardPark();
  else { c.style.transition = 'transform .18s'; c.style.transform = ''; c.dataset.lean = ''; setTimeout(() => { c.style.transition = ''; }, 200); }
}
document.addEventListener('pointerup', swipeEnd);
document.addEventListener('pointercancel', swipeEnd);


/* ================= 0.9.1: coverage calls on any front, Polaroid picks, one book, the words explained =================
   Pick a front, pick a call: every defender gets his job and his spot from the front's own logic (PBA.covPlan),
   then drag anyone to match the film — his job goes with him. The call keeps its name until a job changes by hand. */
const edFront = () => ({box:W.def.box.map(b => ({x:b.x, d:b.d, hand:b.d === 1 ? b.hand : null})),
  dbs:W.def.deep.concat(W.def.rest).filter(o => o.slot).map(o => ({slot:o.slot, kind:W.def.deep.includes(o) ? 'deep' : 'rest'})), shell:W.def.shell});
const edIds = () => ({box:W.def.box.map(b => b.id), dbs:W.def.deep.concat(W.def.rest).filter(o => o.slot).map(o => o.id)});
const edOff = () => (W && W.tokens && W.tokens.some(t => t.slot)) ? {qb:W.qb, tokens:W.tokens.filter(t => t.slot).map(t => ({type:t.type, slot:t.slot}))} : null;
const mirrorFront = f => ({box:f.box.map(b => Object.assign({}, b, {x:b.x === 0 ? 0 : -b.x})), dbs:f.dbs.map(o => Object.assign({}, o, {slot:mirrorKey(o.slot)})), shell:f.shell});
const planIds = (plan, ids) => { const m = {}; plan.people.forEach(p => { const i = +p.k.slice(1); m[p.k] = p.kind === 'box' ? ids.box[i] : ids.dbs[i]; }); return m; };
function applyCall(cid){
  const front = edFront(), ids = edIds(), n = front.box.length + front.dbs.length;
  if (n !== 11){ toast(`Place all 11 first. The defense has ${n}.`); return false; }
  const plan = PBA.covPlan(front, edOff(), W.strength, cid);
  if (!plan){ toast('That call needs more backs than this front has.'); return false; }
  const P = PBA.placeDbs(front, plan);
  const byId = new Map(W.def.deep.concat(W.def.rest).filter(o => o.slot).map(o => [o.id, o]));
  const deep = [], rest = [];
  ids.dbs.forEach((id, i) => { const o = byId.get(id); if (!o) return; o.slot = P.dbs[i].slot; (P.dbs[i].kind === 'deep' ? deep : rest).push(o); });
  W.def.deep = deep; W.def.rest = rest; W.def.shell = P.shell; W.def.shellBuilt = true; W.def.cur = 0;
  const M = planIds(plan, ids), rolesById = {}, areasById = {};
  Object.entries(plan.roles).forEach(([k, r]) => { if (M[k]) rolesById[M[k]] = {job:r.job, on:r.on || null}; });
  Object.entries(plan.areas).forEach(([k, a]) => { if (M[k]) areasById[M[k]] = a; });
  W.defCall = {id:plan.id, name:plan.name, code:plan.code, rolesById, areasById};
  W.droles = {}; W.roleKeys = {}; W.dsel = null; W.dirty = true;
  defList().forEach(d => { if (rolesById[d.id]) W.droles[d.key] = Object.assign({}, rolesById[d.id]); W.roleKeys[d.id] = d.key; });
  diag('call.apply', `${plan.name} · ${plan.pressure} · shell ${P.shell}`, {roles:Object.keys(rolesById).length});
  return true;
}
/* the shell follows the backs: safeties at 12 are the deep ones (two at most) */
function reshell(){
  const all = W.def.deep.concat(W.def.rest), deep = all.filter(o => o.slot && /:(I|T|S|M):d$/.test(o.slot)).slice(0, 2);
  W.def.deep = deep; W.def.rest = all.filter(o => !deep.includes(o)); W.def.shell = deep.length;
}
/* a defender dragged to a new spot keeps his job (jobs key on the spot) */
function rolesFollow(){
  if (!W || !W.def || !W.droles) return;
  const D = defList(), prev = W.roleKeys || {}, next = {}, keys = new Set(D.map(d => d.key));
  D.forEach(d => {
    next[d.id] = d.key;
    const o = prev[d.id];
    if (o && o !== d.key && W.droles[o] && !keys.has(o)){ W.droles[d.key] = W.droles[o]; delete W.droles[o]; if (W.dsel === o) W.dsel = d.key; }
  });
  W.roleKeys = next;
}
/* the coverage on the field: the call's own name and zones while every job is still the call's, else read from the jobs */
function covNow(){
  const base = readCoverage(); if (!base) return null;
  const c = W && W.defCall; if (!c) return base;
  const D = defList();
  const ok = D.every(d => { const w = c.rolesById[d.id], j = jobOf(d.key); return w && j && w.job === j.job && (w.job !== 'Man' || (w.on || null) === (j.on || null)); });
  if (!ok) return base;
  const areas = {}; D.forEach(d => { const a = c.areasById[d.id]; if (a) areas[d.key] = a; });
  return Object.assign({}, base, {name:c.name, code:c.code, areas, call:c.id});
}
function restoreCall(d){
  if (!d || !d.call || !W || !W.def) return;
  const front = edFront(), ids = edIds(), plan = PBA.covPlan(front, edOff(), W.strength, d.call);
  if (!plan) return;
  const M = planIds(plan, ids), rolesById = {}, areasById = {};
  if (!Object.keys(W.droles || {}).length){
    const keyOf = new Map(defList().map(x => [x.id, x.key]));
    W.droles = W.droles || {};
    Object.entries(plan.roles).forEach(([k, r]) => { const key = keyOf.get(M[k]); if (key) W.droles[key] = {job:r.job, on:r.on || null}; });
  }
  defList().forEach(x => { const j = jobOf(x.key); if (j) rolesById[x.id] = {job:j.job, on:j.on || null}; });
  Object.entries(plan.areas).forEach(([k, a]) => { if (M[k]) areasById[M[k]] = a; });
  W.defCall = {id:d.call, name:(d.cov && d.cov.name) || plan.name, code:(d.cov && d.cov.code) || plan.code, rolesById, areasById};
  W.roleKeys = {}; defList().forEach(x => { W.roleKeys[x.id] = x.key; });
}

/* ---- tendencies: the game-plan sheet's buckets, from what you logged ---- */
function tendRows(plays, keyOf){
  const g = new Map();
  plays.forEach(p => { const k = keyOf(p); if (!k) return; let r = g.get(k); if (!r){ r = {k, n:0, t:0, run:0, pass:0, rs:0, rw:0, ps:0, pw:0}; g.set(k, r); } r.n++;
    const t = p.res && p.res.ptype; if (t !== 'run' && t !== 'pass') return; r.t++; r[t]++;
    const d = p.res.dir; if (d === 'strong') r[t === 'run' ? 'rs' : 'ps']++; else if (d === 'weak') r[t === 'run' ? 'rw' : 'pw']++; });
  return [...g.values()];
}
function tendTable(title, rows, order){
  if (!rows.length) return '';
  const pc = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
  const R = order ? rows.sort((a,b) => order.indexOf(a.k) - order.indexOf(b.k)) : rows.sort((a,b) => b.n - a.n).slice(0, 14);
  return `<h4 class="tt">${esc(title)}</h4><table class="tend"><thead><tr><th></th><th>n</th><th>Run</th><th>Pass</th><th>Run S/W</th><th>Pass S/W</th></tr></thead><tbody>${R.map(r =>

/* ================= 0.12.0 the games: every snap of every game, from the repo (data/games.json, data/pbp/<season>/<game>.json) ================= */
const GAMES = {index:null, state:'off', err:null, cache:new Map(), busy:new Set()};
const GAMEV = {season:null, week:null, gid:lsGetRaw('pb.game.cur') || null, side:lsGetRaw('pb.game.side') || null, key:null};
const GAME_LS_MAX = 8;
async function fetchJSON(url){

}
function gamesCheck(idx){
  const bad = [];

    if (idx.v !== 1) bad.push(`v: expected 1, got ${idx.v}`);
    if (!Array.isArray(idx.games)) bad.push(`games: expected array, got ${typeof idx.games}`);
    else idx.games.slice(0, 3).forEach(g => { if (!g || typeof g.id !== 'string' || !g.away || !g.home || !g.teams) bad.push(`game row missing id/away/home/teams: ${JSON.stringify(g).slice(0, 80)}`); });
    if (!idx.seasons || typeof idx.seasons !== 'object') bad.push('seasons: missing');
  }
  return bad;
}
async function gamesLoad(){
  if (EMBED) return;

  let idx = null, from = 'repo';
  try { idx = await fetchJSON('data/games.json'); }
  catch(e){ idx = lsGetJSON('pb.games', null); from = 'this phone'; GAMES.err = String(e && e.message); diag('games', `index not fetched (${GAMES.err}); ${idx ? 'using the copy on this phone' : 'no copy on this phone'}`); }
  if (!idx){ GAMES.state = 'error'; GAMES.err = 'no connection, and no copy on this phone yet'; if (VIEW === 'home') renderHome(); return; }
  const bad = gamesCheck(idx);
  if (bad.length){ GAMES.state = 'error'; GAMES.err = bad[0]; fail('games.index', 'data/games.json with v 1, seasons{} and games[]', bad.join('; '), JSON.stringify(idx).slice(0, 300)); if (VIEW === 'home') renderHome(); return; }
  GAMES.index = idx; GAMES.state = 'on'; GAMES.err = null;
  if (from === 'repo') lsSetRaw('pb.games', JSON.stringify(idx));
  diag('games', `${idx.games.length} games from ${from}, built ${idx.built}`, Object.fromEntries(Object.entries(idx.seasons).map(([s, v]) => [s, v.games])));
  if (GAMEV.gid && gameRow(GAMEV.gid)) gameLoad(GAMEV.gid);
  if (VIEW === 'home') renderHome();
}
const gameRow = gid => GAMES.index ? GAMES.index.games.find(g => g.id === gid) || null : null;
function gameCheck(g, gid){
  const bad = [];

  if (g.id !== gid) bad.push(`id: expected ${gid}, got ${g.id}`);
  if (!Array.isArray(g.drives) || !g.drives.length) bad.push('drives: expected a non-empty array');
  else g.drives.forEach((d, i) => { if (!d || !Array.isArray(d.plays) || !d.pos) bad.push(`drive ${i}: needs pos and plays[]`); else if (d.plays.some(p => !p || typeof p.key !== 'string' || !p.res)) bad.push(`drive ${i}: a play without key/res`); });

}
function gameLsPut(gid, g){
  const list = (lsGetJSON('pb.g.list', []) || []).filter(k => k !== gid); list.push(gid);
  while (list.length > GAME_LS_MAX){ const k = list.shift(); try { localStorage.removeItem('pb.g.' + k); } catch(e){} }
  lsSetRaw('pb.g.list', JSON.stringify(list));
  if (lsSetRaw('pb.g.' + gid, JSON.stringify(g)) !== true) diag('games', `${gid} not kept on this phone (storage full?)`);
}
async function gameLoad(gid){
  if (GAMES.cache.has(gid) || GAMES.busy.has(gid)) return GAMES.cache.get(gid) || null;
  const row = gameRow(gid); if (!row){ diag('games', `${gid}: not in the index`); return null; }

  catch(e){ g = lsGetJSON('pb.g.' + gid, null); from = 'this phone'; diag('games', `${gid} not fetched (${e && e.message}); ${g ? 'using the copy on this phone' : 'no copy on this phone'}`); }

  if (from === 'repo') gameLsPut(gid, g);

const gameQ = p => { const fx = ipadFact(p.key); return {key:p.key, sit:{down:p.down, dist:p.dist, yard:p.yard, qtr:p.q, clock:p.clock, pos:p.pos, def:p.def}, desc:p.desc || '',

  res:p.res || null, f:p.f || null, pp:p.pp || null, at:null, fromGame:true, np:!!p.np}; };
const gameDrives = (g, side) => g.drives.filter(d => d.pos === side);
const gamePlays = (g, side) => gameDrives(g, side).flatMap(d => d.plays);
const loggedKey = key => S.plays.some(p => p.key === key && !p._bad);

function gameFind(key){
  const gid = String(key || '').split(':')[0], g = GAMES.cache.get(gid); if (!g) return null;

function parseDesc(desc){
  const d = String(desc || '').toLowerCase().replace(/^\(\d+:\d+\)\s*/, ''); if (!d) return null;
  if (/\bpunts?\b|field goal|kicks off|kickoff|extra point|two-point|\bno play\b|aborted/.test(d) && !/\bpass\b|\bsacked\b|\bscrambles?\b|\b(left|right) (end|tackle|guard)\b|up the middle/.test(d)) return null;
  let ptype = null;
  if (/\bpass\b|\bsacked\b|\bscrambles?\b|\bspiked?\b/.test(d)) ptype = 'pass';
  else if (/\b(left|right) (end|tackle|guard)\b|up the middle|\brush(es|ed)?\b|\bkneels?\b/.test(d)) ptype = 'run';
  if (!ptype) return null;
  let loc = null, gap = null, len = null;
  const m1 = /\b(short|deep) (left|middle|right)\b/.exec(d); if (m1){ len = m1[1]; loc = m1[2]; }
  const m2 = /\b(left|right) (end|tackle|guard)\b/.exec(d); if (m2){ loc = m2[1]; gap = m2[2]; }
  if (/up the middle/.test(d)){ loc = 'middle'; gap = 'middle'; }
  const my = /for (-?\d+) yards?/.exec(d); const yds = my ? +my[1] : (/for no gain|incomplete/.test(d) ? 0 : null);
  const scr = /scrambles?/.test(d), sack = /sacked/.test(d), td = /touchdown/.test(d), int = /intercepted/.test(d);
  return {ptype, loc, gap:ptype === 'run' && !scr ? gap : null, len:ptype === 'pass' ? len : null, yds, sack, scr, td, int, fd:false, expl:yds != null && (ptype === 'run' ? yds >= 10 : yds >= 20), from:'desc'};
}
function resOf(q){   // the iPad's nflverse result first, else the words under the clip; never a question
  const r = q && q.res && typeof q.res === 'object' && (q.res.ptype === 'run' || q.res.ptype === 'pass') ? q.res : null;
  if (r) return r;
  const d = parseDesc(q && q.desc);
  if (d && q && q.sit && q.sit.dist != null && d.yds != null) d.fd = d.yds >= +q.sit.dist || d.td;
  return d;
}
function resLine(r){   // "Pass · short right · +12 · 1st down"
  if (!r) return '';

}
