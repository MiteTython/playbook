  dfrontPick(d){
    const [kind, id] = d.id.split(':');
    W.defSrc = {kind, id:id || null};
    applyDefSrc(); W.dirty = true;
    hideSheet(); refresh();
  },
  rmode(d){ W.rmode = d.v; W.pick = null; if (d.v === 'block' && V.z <= 1.01) boxView(); diag('art.mode', d.v); refresh(); },
  rdone(){ selectMan(null); refresh(); },
  dside(d){ W.side = d.v; W.dsel = null; W.rsel = null; if (d.v === 'D' && V.z > 1.01) viewForStep(); diag('design.side', d.v === 'D' ? 'defense jobs' : 'offense'); refresh(); },
  dpick(d){ W.dsel = W.dsel === d.id ? null : d.id; refresh(); },
  dselNone(){ W.dsel = null; refresh(); },
  djob(d){ if (!W.dsel) return; setJob(W.dsel, d.v); diag('jobs.set', `${W.dsel} → ${d.v}`); refresh(); },
  dfill(d){ if (d.v === 'clear'){ W.droles = {}; diag('jobs.clear', 'all jobs cleared'); } else fillJobs(d.v); W.dsel = null; W.dirty = true; refresh(); },
  toJobs(){ const n = defList().length; if (n !== 11){ toast(`Place all 11 first. The defense has ${n}.`); return; } W.dsel = null; setStep('djobs'); diag('flow', 'shell → jobs'); refresh(); },
  toRestJ(){ setStep('rest'); refresh(); },
  pside(d){
    W.pside = +d.v; W.psideSet = true;
    if (W.concept && !W.rsel){ pushRHist(); buildConcept(W.concept.id, W.pside, W.concept.carrier || null); W.dirty = true; }
    else diag('art.side', `play side ${W.pside > 0 ? 'right' : 'left'}`);
    refresh();
  },
  rundo(){
    if (!W.rhist.length) return;
    popRHist(); W.dirty = true;
    diag('art.undo', `${W.rhist.length} steps left`);
    refresh();
  },
  rdeep(d){
    const m = W.rsel ? manById(W.rsel) : null, a = m && W.routes[m.id];
    if (!a) return;
    pushRHist();
    if (a.kind === 'block') return;
    if (!deepen(a, +d.v)){ W.rhist.pop(); toast('Can not go shorter.'); return; }
    delete a.label; delete a.cname; W.dirty = true;
    const i = artInfo(m);
    diag('art.depth', `${m.tag} ${+d.v > 0 ? '+' : ''}${d.v} yd → ${i ? i.name + ' ' + i.code : ''}`);
    refresh();
  },
  rflip(){
    const m = W.rsel ? manById(W.rsel) : null, a = m && (W.rmode === 'motion' ? W.motion : W.routes)[m.id];
    if (!a || (a.kind === 'block' && W.rmode !== 'motion')) return;
    pushRHist();
    a.pts = a.pts.map(([x,y]) => [-x, y]); delete a.label; delete a.cname; W.dirty = true;
    const i = artInfo(m), mn = motionName(m);
    diag('art.flip', `${m.tag} → ${W.rmode === 'motion' ? 'motion ' + mn : (i ? i.name + ' ' + i.code : '')}`);
    refresh();
  },
  rdel(){
    const m = W.rsel ? manById(W.rsel) : null, store = W.rmode === 'motion' ? W.motion : W.routes;
    if (!m || !store[m.id]) return;
    pushRHist(); delete store[m.id]; W.dirty = true;
    diag('art.erase', `${m.tag} ${W.rmode === 'motion' ? 'motion' : 'assignment'} erased`);
    refresh();
  },
  rclear(){
    if (!Object.keys(W.routes).length && !Object.keys(W.motion).length) return;
    pushRHist(); W.routes = {}; W.motion = {}; W.concept = null; W.pick = null; W.dirty = true;
    diag('art.clear', 'all art cleared');
    refresh();
  },
  saveDesignAsk(){
    if (!Object.keys(W.routes).length && !Object.keys(W.motion).length){ toast('Draw something first.'); return; }
    const dbl = doubleIds();
    const named = men().filter(m => m.kind !== 'ol').map(m => { const i = artInfo(m, dbl), mn = motionName(m); return (i || mn) ? `${m.tag}${mn ? ' ' + mn : ''}${i ? ' ' + i.name : ''}` : null; }).filter(Boolean);
    const sugg = W.name || (W.concept ? `${W.setName} ${W.concept.name} ${W.concept.ps > 0 ? 'Right' : 'Left'}` : `${W.setName}: ${named.slice(0, 3).join(', ')}`);
    showSheet(`<h3>Name this play</h3><p>${esc(named.join(' · '))} vs ${esc(W.defName)}</p>
      <input id="dzName" class="txt" value="${esc(sugg)}" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
      <div class="row"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn pri" data-act="saveDesign">Save play</button></div>`);
  },
  saveDesign(){
    const inp = $('#dzName');
    const name = inp ? inp.value.trim() : '';
    if (!name){ toast('Give the play a name.'); return; }
    saveDesign(name);
  },
  dzMenu(d){
    const dz = S.designs.find(o => o.id === d.id); if (!dz) return;
    showSheet(`<h3>${esc(dz.name)}</h3><p>${esc(dz.setName || '')} vs ${esc(dz.defName || '')}</p>
      ${dz._bad ? `<p class="bad">${esc(dz._bad)}</p>` : codeRow(dz.code, 'play code')}
      <button class="btn" data-act="openDesign" data-id="${dz.id}">Open</button>
      <button class="btn danger" data-act="dzDel" data-id="${dz.id}">Delete</button>
      <button class="btn" data-act="closeSheet">Cancel</button>`);
  },
  dzDel(d){
    const dz = S.designs.find(o => o.id === d.id); if (!dz) return;
    showSheet(`<h3>Delete ${esc(dz.name)}?</h3><p>This can not be undone.</p>
      <div class="row"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn danger" data-act="dzDelYes" data-id="${dz.id}">Delete</button></div>`);
  },
  dzDelYes(d){
    const i = S.designs.findIndex(o => o.id === d.id); if (i < 0) return;
    const [dz] = S.designs.splice(i, 1);
    if (!saveStore('delete.design')) S.designs.splice(i, 0, dz);
    else { tomb(dz.id); dbDel('designs', dz.id, 'delete.design'); }
    hideSheet(); refresh();
  },
  frontNew(){
    hideSheet();
    W = newWork('dtemplate'); W.tokens = [];
    setStep('box'); setView('editor'); refresh();
    diag('flow', 'new defense front');
  },
  strong(d){ W.strength = d.v; refresh(); },
  kmode(d){ W.def.mode = d.v; refresh(); },
  key(d){
    const x = parseFloat(d.x), mode = W.def.mode || 'down', lvl = mode === 'lb' ? 5 : 1;
    const here = W.def.box.find(b => b.x === x && b.d === lvl);
    if (here){
      if (lvl === 1 && here.hand !== mode){ here.hand = mode; diag('key.hand', `${techOf(x)} (x${x}) → hand ${mode}`); }
      else { W.def.box = W.def.box.filter(b => b !== here); diag('key.remove', `${techOf(x)} (x${x}) depth ${lvl}, box now ${W.def.box.length}`); }
    } else {
      const b = {id:nid(), x, d:lvl, hand:lvl === 1 ? mode : null};
      W.def.box.push(b); (W.def.hist = W.def.hist || []).push(b.id);
      diag('key.add', `${techOf(x)} (x${x}) ${lvl === 1 ? 'hand ' + mode : 'LB'}, box now ${W.def.box.length}`);
    }
    W.def.pendingHand = null; W.def.sel = null;
    refresh();
  },
  kundo(){
    const h = W.def.hist || [];
    let done = false;
    while (h.length && !done){ const id = h.pop(); if (W.def.box.some(b => b.id === id)){ W.def.box = W.def.box.filter(b => b.id !== id); done = true; } }
    if (!done && W.def.box.length) W.def.box.pop();
    diag('key.undo', `box now ${W.def.box.length}`);
    refresh();
  },
  kclear(){ W.def.box = []; W.def.hist = []; W.def.sel = null; diag('key.clear', 'box cleared'); refresh(); },
  dtype(){
    const cur = defCode({box:W.def.box, dbs:W.def.deep.concat(W.def.rest).filter(o => o.slot).map(o => ({slot:o.slot}))}, W.strength).slice(2);
    showSheet(`<h3>Type the defense</h3>
      <p>Left to right, strong and weak from the offense. <b>w5</b> 5-tech weak · <b>s9^</b> hand up · <b>0</b> nose · <b>w2'</b> linebacker over the weak guard. Add backs to fill all 11: <b>wN'</b> <b>sS"</b> <b>M"</b>.</p>
      <label class="lbl" for="dcode">Front, or the whole defense</label>
      <input id="dcode" class="txt mono" value="${esc(cur)}" placeholder="w5 w3 s1 s9^ w2' s2'" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <div class="row"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn def" data-act="dtypeApply">Apply</button></div>`);
  },
  dtypeApply(){
    const inp = $('#dcode');
    const text = inp ? inp.value : '';
    const res = parseDefTokens(text);
    if (res.errors.length){ diag('type.parse', res.errors.join('; '), text); toast(`<b>Type</b>: ${esc(res.errors[0])}`, 'err'); return; }
    defFromParsed(res);
    hideSheet();
    const total = res.box.length + res.dbs.length;
    diag('type.apply', `${res.box.length} in the box, ${res.dbs.length} backs`, text);
    if (res.dbs.length && total === 11){ setStep('rest'); rebuildRest(); toast('All 11 set. Check them, then save.'); }
    else toast(`${total} placed.`);
    refresh();
  },
  savedFronts(){
    const fr = S.fronts.filter(f => !f._bad).sort((a,b) => String(a.name || '').localeCompare(String(b.name || '')));
    showSheet(`<h3>Load a saved front</h3>
      ${fr.length ? `<div class="list">${fr.map(f => `<button class="li" data-act="loadFront" data-id="${f.id}"><span class="li-main"><span class="li-t">${esc(f.name)}</span><span class="li-s mono">${esc(f.code)}</span></span></button>`).join('')}</div>`
        : '<p>No saved fronts yet. Build one with New defense front on the home screen.</p>'}
      <p>It loads to this play's strong side. Drag anyone to fix him.</p>
      <button class="btn" data-act="closeSheet">Cancel</button>`);
  },
  loadFront(d){
    const f = S.fronts.find(o => o.id === d.id); if (!f) return;
    loadFrontInto(f); hideSheet();
    diag('def.loadFront', `"${f.name}" ${f.code} strong ${W.strength}`);
    setStep('rest'); rebuildRest(); refresh();
    toast(`Loaded ${esc(f.name)}. Check it, then save.`);
  },
  saveFrontAsk(){
    const d = defObject();
    const errs = validateDefense(d);
    if (errs.length){ fail('save.front', 'valid defense', errs.join('; '), d); return; }
    const cur = W.editFront ? (S.fronts.find(o => o.id === W.editFront) || {}).name : '';
    showSheet(`<h3>Name this front</h3>
      <p class="mono">${esc((W.strength === 'L' ? defCode(mirrorDef(d), 'R') : defCode(d, 'R')))}</p>
      <input id="frontName" class="txt" value="${esc(cur || frontSuggest(d))}" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
      <div class="row"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn def" data-act="saveFront">Save front</button></div>`);
  },
  saveFront(){
    const inp = $('#frontName');
    const name = inp ? inp.value.trim() : '';
    if (!name){ toast('Give the front a name.'); return; }
    saveFront(name);
  },
  frMenu(d){
    const f = S.fronts.find(o => o.id === d.id); if (!f) return;
    showSheet(`<h3>${esc(f.name)}</h3><p>${esc(f.summary || '')}</p>
      ${f._bad ? `<p class="bad">${esc(f._bad)}</p>` : codeRow(f.code, 'front code')}
      <button class="btn" data-act="frEdit" data-id="${f.id}">Edit the front or rename it</button>
      <button class="btn danger" data-act="frDel" data-id="${f.id}">Delete</button>
      <button class="btn" data-act="closeSheet">Cancel</button>`);
  },
  frEdit(d){
    hideSheet();
    const f = S.fronts.find(o => o.id === d.id); if (!f) return;
    W = newWork('dtemplate'); W.tokens = []; W.editFront = f.id; W.strength = 'R';
    loadFrontInto(f);
    setStep('box'); setView('editor'); refresh();
  },
  frDel(d){
    const f = S.fronts.find(o => o.id === d.id); if (!f) return;
    showSheet(`<h3>Delete ${esc(f.name)}?</h3><p>Plays that used it keep their own copy.</p>
      <div class="row"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn danger" data-act="frDelYes" data-id="${f.id}">Delete</button></div>`);
  },
  frDelYes(d){
    const i = S.fronts.findIndex(o => o.id === d.id); if (i < 0) return;
    const [f] = S.fronts.splice(i, 1);
    if (!saveStore('delete.front')) S.fronts.splice(i, 0, f);
    else { tomb(f.id); dbDel('fronts', f.id, 'delete.front'); }
    hideSheet(); refresh();
  },
  /* box */
  hand(d){
    const b = W.def.box.find(o => o.id === W.def.pendingHand);
    if (b){ b.hand = d.v; diag('box.hand', `tech ${techOf(b.x)} hand ${d.v}`); }
    W.def.pendingHand = null; refresh();
  },
  selHand(d){ const b = W.def.box.find(o => o.id === W.def.sel); if (b && isLine(b)){ b.hand = d.v; diag('box.hand', `tech ${techOf(b.x)} hand ${d.v}`); } refresh(); },
  removeBox(){
    const b = W.def.box.find(o => o.id === W.def.sel);
    W.def.box = W.def.box.filter(o => o.id !== W.def.sel);
    if (b) diag('box.remove', `tech ${techOf(b.x)} depth ${b.d}, box now ${W.def.box.length}`);
    W.def.sel = null; refresh();
  },
  toRest(){
    if (W.def.pendingHand){ toast('Pick hand down or hand up first.'); return; }
    W.def.sel = null;
    setStep('rest');
    if (!W.def.shellBuilt) setShell(W.def.shell); else rebuildRest();
    diag('flow', `box → shell: ${W.def.box.length} in the box, ${restCount()} to place`);
    refresh();
  },
  toBox(){ setStep('box'); refresh(); },
  shell(d){ setShell(+d.v); refresh(); },
  rpick(d){ W.def.cur = +d.i; refresh(); },
  rnext(){
    const n = W.def.rest.length;
    for (let k = 1; k <= n; k++){ const i = (W.def.cur + k) % n; if (!W.def.rest[i].slot){ W.def.cur = i; break; } }
    refresh();
  },
  saveDef(){ saveDef(); },
  /* diagnostics */
  copyLog(){ copyText(DIAG.map(e => `${new Date(e.t).toISOString()} ${e.s}  ${e.m}${e.d !== undefined ? '  ' + JSON.stringify(e.d) : ''}`).join('\n'), 'Log'); },
  copyData(){ copyText(JSON.stringify({version:VERSION, store:S, dumps:lsGetJSON(KEYS.dumps, [])}, (k,v) => (k === '_bad' || k === '_conv' || k === '_sync') ? undefined : v, 1), 'Data'); },
  qStart(){ const q = queueOpen()[0]; if (q) startQueued(q); },
  qOpen(d){ const q = SYNC.ipad.queue.find(o => o.key === d.key); if (q) startQueued(q); },
  syncSheet(){
    showSheet(`<h3>Sync with the iPad</h3>
      <p>${esc(syncWord())}${SYNC.err ? ' · ' + esc(SYNC.err) : ''}${SYNC.id ? '<br>Shared file: ' + esc(SYNC.id.slice(0, 8)) + '…' : ''}</p>
      <p>Paste a GitHub token with one permission: Gists, read and write. It stays on this phone.</p>
      <label class="lbl" for="ghTok">GitHub token</label>
      <input id="ghTok" class="txt mono" type="password" placeholder="${SYNC.token ? 'Saved. Paste a new one to replace it' : 'github_pat_…'}" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row"><button class="btn" data-act="closeSheet">Close</button><button class="btn pri" data-act="syncSave">Save and connect</button></div>
      ${SYNC.token ? '<button class="btn danger" data-act="syncOff">Disconnect this phone</button>' : ''}
      <button class="btn" data-act="importAsk">Import data</button>`);
  },
  syncSave(){
    const inp = $('#ghTok'), v = inp ? inp.value.trim() : '';
    if (!v && !SYNC.token){ toast('Paste the token first.'); return; }
    if (v){ lsSetRaw('pb.gh.token', v); lsSetRaw('pb.gh.gist', ''); }
    hideSheet(); syncStart(); toast('Connecting to GitHub…'); refresh();
  },
  syncOff(){ clearTimeout(SYNC.timer); clearTimeout(SYNC.wtimer); lsSetRaw('pb.gh.token', ''); lsSetRaw('pb.gh.gist', ''); SYNC.token = null; SYNC.id = null; SYNC.state = 'off'; diag('sync', 'disconnected'); hideSheet(); refresh(); },
  importAsk(){
    showSheet(`<h3>Import data</h3>
      <p>Paste what Copy data gave you in the old app (Diagnostics → Copy data). It merges: nothing here is lost.</p>
      <textarea id="importBox" class="txt mono" style="height:160px;padding:10px" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="row"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn pri" data-act="importDo">Import</button></div>`);
  },
  importDo(){
    const box = $('#importBox'), raw = box ? box.value.trim() : '';
    let obj;
    try { obj = JSON.parse(raw); } catch(e){ fail('import.parse', 'the JSON from Copy data', String(e), raw.slice(0, 200)); return; }
    const src = obj && obj.store ? obj.store : obj;
    if (!src || !['formations','plays','fronts','designs'].some(k => Array.isArray(src[k]))){ fail('import.shape', 'formations[] / plays[] / fronts[] / designs[]', Object.keys(src || {}).join(',') || typeof src); return; }
    const c = mergeStore(src, 'import');
    hideSheet(); refresh();
    toast(`Imported. Sets ${c.formations} · plays ${c.plays} · fronts ${c.fronts} · drawn ${c.designs}.`);
  },
  clearLog(){ DIAG = []; lsSetRaw(KEYS.diag, '[]'); lsSetRaw(KEYS.dumps, '[]'); diag('diag', 'log and dumps cleared'); refresh(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === 'closeSheet' && el.id === 'sheet' && e.target !== el) return;
  const fn = ACT[act];
  if (!fn){ fail('ui', 'known action', act); return; }
  try { fn(el.dataset, el); }
  catch(err){ fail('action.' + act, 'no error', err.message, String(err.stack || '')); }
});

/* ================= boot ================= */
DIAG = lsGetJSON(KEYS.diag, []);
if (!Array.isArray(DIAG)) DIAG = [];
diag('boot', `v${VERSION} start, ${navigator.userAgent}`);
loadStore();
if ('ResizeObserver' in window) new ResizeObserver(() => { if (VIEW === 'editor' && measure()){ clampCam(); render(); } }).observe($('#fieldWrap'));
window.addEventListener('resize', () => { if (VIEW === 'editor' && measure()){ clampCam(); render(); } });
setView('home'); refresh();
connectDb();
syncStart();
})();
</script>

</body>
</html>
