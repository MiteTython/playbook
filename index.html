<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Playbook">
<meta name="theme-color" content="#0E1114">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Playbook Logger</title>
<style>
/* layout: one-screen phone app — top bar, real-scale field canvas, bottom control panel */
:root{
  --bg:#0E1114; --panel:#151A1F; --raise:#1F262D; --raise2:#323B44; --line:rgba(255,255,255,.09);
  --fg:#EEF1F3; --fg2:#98A3AC; --accent:#4DA3FF; --on-accent:#06121F;
  --danger:#FF6B5E; --warn:#FFB340; --ok:#3DDC84; --toast:#2A323A;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF1F4; --panel:#FFFFFF; --raise:#E6EAEE; --raise2:#CFD6DD; --line:rgba(0,0,0,.08);
  --fg:#11161B; --fg2:#56616B; --accent:#0B6BD3; --on-accent:#FFFFFF;
  --danger:#C93A2C; --warn:#9A5800; --ok:#16864A; --toast:#FFFFFF; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#EEF1F4; --panel:#FFFFFF; --raise:#E6EAEE; --raise2:#CFD6DD; --line:rgba(0,0,0,.08);
  --fg:#11161B; --fg2:#56616B; --accent:#0B6BD3; --on-accent:#FFFFFF;
  --danger:#C93A2C; --warn:#9A5800; --ok:#16864A; --toast:#FFFFFF; color-scheme:light;}
:root[data-theme="dark"]{
  --bg:#0E1114; --panel:#151A1F; --raise:#1F262D; --raise2:#323B44; --line:rgba(255,255,255,.09);
  --fg:#EEF1F3; --fg2:#98A3AC; --accent:#4DA3FF; --on-accent:#06121F;
  --danger:#FF6B5E; --warn:#FFB340; --ok:#3DDC84; --toast:#2A323A; color-scheme:dark;}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button,select{font-family:var(--font);touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.top{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px}
.icon-btn{width:40px;height:40px;border-radius:20px;border:0;background:var(--raise);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.icon-btn[hidden]{display:none!important}
.top-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
#topTitle{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topSub{font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.view{flex:1;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 32px}
.editor{display:flex;flex-direction:column}
#fieldWrap{flex:1;min-height:220px;position:relative;touch-action:none;background:#122019;overflow:hidden}
#field{position:absolute;inset:0;width:100%;height:100%;display:block}
#fitBtn{position:absolute;right:10px;top:10px;height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(255,255,255,.25);
  background:rgba(20,26,30,.75);color:#F2F4F3;font-size:13px;font-weight:700}
.panel{flex:none;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;position:relative;box-shadow:0 -10px 28px rgba(0,0,0,.28);
  padding:14px 16px 14px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg2)}
.row{display:flex;gap:8px;align-items:center}
.btn{height:50px;border-radius:14px;border:0;background:var(--raise);color:var(--fg);font-size:16px;font-weight:600;padding:0 14px;flex:1;min-width:0}
.btn.pri{background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.def{background:#FF8A3D;color:#111418;font-weight:700}
.btn.danger{color:var(--danger)}
.btn.slim{flex:0 0 auto}
.btn.small{height:40px;font-size:14px;border-radius:11px;padding:0 12px}
.keys{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.key{height:44px;border:0;border-radius:9px;background:var(--raise);color:var(--fg);font-size:15px;font-weight:700;padding:0;font-variant-numeric:tabular-nums}
.key.on{background:#FF8A3D;color:#111418}
.key.up{background:transparent;box-shadow:inset 0 0 0 2px #FF8A3D;color:#FF8A3D}
.key.lb{background:var(--raise2);box-shadow:inset 0 0 0 2px var(--fg)}
.key.dim{box-shadow:inset 0 -3px 0 rgba(255,138,61,.7)}
.key.key0{width:56px;flex:none}
.mid{display:flex;gap:6px;align-items:center}
.mid .side{flex:1;font-size:12px;color:var(--fg2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.mid .side.r{text-align:right}
.status.code-line{font-family:var(--mono);font-size:13px;color:var(--fg)}
/* home, v0.5 */
.sub{color:var(--fg2);margin:-8px 0 16px;font-size:14px;font-variant-numeric:tabular-nums}
.hero{display:flex;gap:14px;align-items:center;width:100%;padding:16px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);text-align:left;box-sizing:border-box}
.hero b{font-size:19px;display:block}
.hero small{display:block;opacity:.82;font-size:13px;margin-top:3px;line-height:17px}
.hero-ic{width:46px;height:46px;border-radius:23px;background:rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 26px}
.tile{min-height:84px;border-radius:18px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:3px;box-sizing:border-box}
.tile i{width:22px;height:5px;border-radius:3px;display:block;margin-bottom:6px}
.tile b{font-size:15px}
.tile small{font-size:12.5px;color:var(--fg2);line-height:16px}
.chev{color:var(--fg2);flex:none;font-size:18px}
/* designer */
.pick{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--fg);font-size:13.5px;font-weight:600;padding:0 10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.rgrid{display:grid;grid-template-rows:repeat(3,36px);grid-auto-flow:column;grid-auto-columns:minmax(74px,max-content);gap:6px;
  overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.rgrid::-webkit-scrollbar{display:none}
.rchip{height:36px;border-radius:11px;border:1px solid var(--line);background:var(--raise);color:var(--fg);font-size:13px;font-weight:700;padding:0 10px;touch-action:pan-x;
  white-space:nowrap;-webkit-user-select:none;user-select:none}
.rchip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.rgrid.two{grid-template-rows:repeat(2,36px)}
.qjob{max-width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--fg2);font-weight:600}
.q.cur .qjob{color:var(--fg)}
.qdot.sq{border-radius:5px}
.q.side{background:var(--raise2);padding:0 16px;font-weight:700}
.rchip:active{background:var(--raise2)}
.ghost{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-130%);padding:8px 14px;border-radius:14px;background:#FFFFFF;color:#111418;
  font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rinfo{color:var(--fg);min-height:38px}
.rinfo b{font-weight:800}
.sheet > .btn{flex:none}
.btn:disabled{opacity:.38;cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raise);border-radius:11px;padding:2px;flex:1}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;color:var(--fg2);font-size:14px;font-weight:600;padding:0 4px}
.seg button.on{background:var(--raise2);color:var(--fg)}
.sel{height:42px;border-radius:11px;border:0;background:var(--raise);color:var(--fg);font-size:15px;font-weight:600;padding:0 10px;flex:0 0 112px;
  font-variant-numeric:tabular-nums}
.scrollx{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.scrollx::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;min-width:48px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:transparent;color:var(--fg);
  font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.on{background:var(--fg);color:var(--bg);border-color:transparent}
.chip:disabled{opacity:.35}
.q{flex:none;height:46px;padding:0 14px 0 6px;border-radius:23px;background:var(--raise);display:flex;align-items:center;gap:8px;
  border:2px solid transparent;color:var(--fg);font-size:14px;font-weight:600}
.q.cur{border-color:var(--accent)}
.qdot{width:32px;height:32px;border-radius:16px;background:var(--raise2);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#111418;flex:none}
.qdot.tri{border-radius:4px;clip-path:polygon(0 8%,100% 8%,50% 100%);padding-bottom:6px;box-sizing:border-box}
.status{font-size:14px;line-height:19px;color:var(--fg2);min-height:19px}
.status.err{color:var(--danger);font-weight:600}
.status.warn{color:var(--warn)}
.hand{height:64px;font-size:17px}
.front{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:34px}
.ft{height:32px;min-width:32px;padding:0 8px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;
  font-size:15px;background:#FF8A3D;color:#111418;box-sizing:border-box;font-variant-numeric:tabular-nums}
.ft.up{background:transparent;border:2px solid #FF8A3D;color:#FF8A3D}
.ft.lb{background:var(--raise2);color:var(--fg)}
.ft.sel{outline:2px solid var(--fg);outline-offset:1px}
.sep{width:1px;height:22px;background:var(--line)}
.txt{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:var(--fg);font-size:17px;padding:0 14px;
  font-family:var(--font);-webkit-user-select:text;user-select:text;width:100%;box-sizing:border-box}
.txt.mono{font-family:var(--mono);font-size:14px}
.sugs{display:flex;flex-direction:column;gap:6px}
.sug{height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:15px;font-weight:600;text-align:left;padding:0 14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug.on{border-color:var(--accent);color:var(--accent)}
.sug small{color:var(--fg2);font-weight:500;margin-left:6px}
.code{display:flex;align-items:center;gap:8px;background:var(--raise);border-radius:11px;padding:6px 6px 6px 12px}
.code code{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;line-height:17px;word-break:break-word;-webkit-user-select:text;user-select:text;color:var(--fg)}
.code button{flex:none;height:34px;padding:0 12px;border-radius:9px;border:0;background:var(--raise2);color:var(--fg);font-size:13px;font-weight:700}
.mono{font-family:var(--mono)}
/* home */
.home h1{font-size:34px;line-height:40px;margin:6px 0 14px;letter-spacing:-.4px}
.home-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:22px}
.home-actions .btn{height:56px}
button.li-main{font:inherit}
.sec{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.sec h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin:0;display:flex;justify-content:space-between}
.list{background:var(--panel);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);
  width:100%;text-align:left;box-sizing:border-box}
.li:last-child{border-bottom:0}
.li-n{width:40px;font-size:17px;font-weight:800;color:var(--fg2);font-variant-numeric:tabular-nums;flex:none}
.li-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s.mono{font-size:12px}
.li-b{flex:none;height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--raise);color:var(--fg);font-size:14px;font-weight:600}
.empty{padding:18px 14px;color:var(--fg2);font-size:14px;line-height:20px}
.bad{color:var(--danger);font-weight:600}
.ver{color:var(--fg2);font-size:12px;text-align:center}
/* sheet + toast */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--panel);border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:78%;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.grab{width:36px;height:5px;border-radius:3px;background:var(--raise2);align-self:center}
.sheet h3{margin:4px 0 0;font-size:18px}
.sheet p{margin:0;color:var(--fg2);line-height:20px}
.toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:30;background:var(--toast);color:var(--fg);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:19px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.err{border-color:var(--danger)}
.toast.err b{color:var(--danger)}
/* diagnostics */
.diag h1{font-size:28px;margin:6px 0 12px}
.diag h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);margin:18px 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--fg2)}
.log{font-family:var(--mono);font-size:11px;line-height:16px;white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px;margin:0;-webkit-user-select:text;user-select:text}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px}
summary{font-weight:600;font-size:14px}
#copyBox{width:100%;height:160px;font-family:var(--mono);font-size:11px;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:10px;
  -webkit-user-select:text;user-select:text;margin-top:10px;box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{transform:translateY(-6px);opacity:0}}}
</style>
<style>#app{padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
</head>
<body>


<div id="app">
  <header class="top">
    <button id="topL" class="icon-btn" data-act="topL" aria-label="Back" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="topLIcon" d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div class="top-mid"><div id="topTitle">Playbook</div><div id="topSub"></div></div>
    <button id="topR" class="icon-btn" data-act="topR" aria-label="Diagnostics">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
    </button>
  </header>
  <main id="home" class="view scroll home"></main>
  <section id="editor" class="view editor" hidden>
    <div id="fieldWrap"><svg id="field" role="img" aria-label="Football field"></svg><button id="fitBtn" data-act="fit" hidden>Fit field</button></div>
    <div id="panel" class="panel"></div>
  </section>
  <section id="diag" class="view scroll diag" hidden></section>
</div>
<div id="sheet" class="sheet-back" data-act="closeSheet" hidden><div class="sheet" id="sheetBody"></div></div>
<div id="toast" class="toast" data-act="dismissToast" hidden></div>

<script>
(() => {
'use strict';
const VERSION = '0.8.0';
const KEYS = {store:'pb.store', diag:'pb.diag', dumps:'pb.dumps', base:'pb.baseline', bad:'pb.store.bad'};
const LETTER_COLOR = {X:'#FF5A4E', Y:'#FFD23F', Z:'#B78CFF', H:'#4DA3FF', F:'#3DDC84'};
const PERS = ['11','12','10','13','21','22','20','23','01','02','00','31','30'];
const QB_DEPTH = {under:1, pistol:4, gun:5};
const QB_LETTER = {under:'U', pistol:'P', gun:'G'};
const QB_FROM_LETTER = {U:'under', P:'pistol', G:'gun'};
const QB_LABEL = {under:'Under C', pistol:'Pistol', gun:'Gun'};
const OL = [{x:-4,l:'LT'},{x:-2,l:'LG'},{x:0,l:''},{x:2,l:'RG'},{x:4,l:'RT'}];
/* techniques in yards from the ball (center 0, guards ±2, tackles ±4, tight end ±6) */
const TECH_X = [['0',0],['1',0.5],['2i',1.5],['2',2],['3',2.5],['4i',3.5],['4',4],['5',4.5],['7',5.5],['6',6],['9',6.5]];
const TECH_SPOTS = TECH_X.flatMap(([t,x]) => x === 0 ? [x] : [-x, x]);
const techOf = x => { const a = Math.abs(x); const hit = TECH_X.find(([,v]) => Math.abs(v - a) < 0.01); return hit ? hit[0] : String(a); };
/* NFL field: 53⅓ yd wide, hashes 70'9" from each sideline */
const FW = 160 / 3, HASH_L = 70.75 / 3, HASH_R = FW - 70.75 / 3;
const BALL_X = {L:HASH_L, M:FW / 2, R:HASH_R};
/* ---- slots ----
   Offense receiver slot  "L|R : I|T|S|N|W : 0|1|3"   (0 on the ball, 1 off, 3 stack)
   Offense backfield slot "L|M|R:FB" fullback depth (beside the QB in the gun) · "M:TB" tailback · "L|R:HB" H-back
   Defense back slot      "L|R : I|T|S|N|W : p|o|d"  or "M:M:o|d" (middle of the field)
   I T S sit 6, 9, 12 yd from the ball; N and W sit 8 and 4 yd in from the sideline. */
const RCOLS = ['I','T','S','N','W'];
const BALL_COL = {I:6, T:9, S:12};
const SIDE_COL = {N:8, W:4};
const OROWS = [0,1,3];
const OMARK = {0:'', 1:"'", 3:'"'};
const MARK_ROW = {'':0, "'":1, '"':3};
const COL_RANK = {I:1, O:1, T:2, S:3, N:4, W:5};
const OFF_KEYS = ['L','R'].flatMap(s => RCOLS.flatMap(c => OROWS.map(r => `${s}:${c}:${r}`))).concat(['L:FB','M:FB','R:FB','M:TB','L:HB','R:HB']);
const DROW_DEPTH = {p:1, o:6, d:12};
const DMARK = {p:'', o:"'", d:'"'};
const DNOM = {I:6, T:9, S:12, N:18, W:22, M:0};
const DB_KEYS = ['L','R'].flatMap(s => RCOLS.flatMap(c => ['p','o','d'].map(r => `${s}:${c}:${r}`))).concat(['M:M:o','M:M:d']);
const TYPE_LABEL = {B:'RB', T:'TE', W:'WR', L:'OL'};
const DEF_ORANGE = '#FF8A3D';
const $ = s => document.querySelector(s);
const svg = $('#field');
const mirrorKey = k => { const p = k.split(':'); p[0] = p[0] === 'L' ? 'R' : p[0] === 'R' ? 'L' : p[0]; return p.join(':'); };

/* ================= diagnostics: always on ================= */
let DIAG = [];
let diagTimer = null;
let failing = false;
function lsGetRaw(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSetRaw(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return e; } }
function lsGetJSON(k, fb){ const raw = lsGetRaw(k); if (raw == null) return fb; try { return JSON.parse(raw); } catch(e){ return fb; } }
function diag(stage, msg, data){
  const e = {t:Date.now(), s:stage, m:msg};
  if (data !== undefined) e.d = data;
  DIAG.push(e);
  if (DIAG.length > 400) DIAG.splice(0, DIAG.length - 400);
  try { console.log('[pb]', stage, msg, data === undefined ? '' : data); } catch(_){}
  if (!diagTimer) diagTimer = setTimeout(() => { diagTimer = null; lsSetRaw(KEYS.diag, JSON.stringify(DIAG)); }, 400);
}
function snapshot(){
  try { return JSON.parse(JSON.stringify({view:VIEW, W, V})); } catch(e){ return {snapshotError:String(e)}; }
}
function dump(stage, expected, got, extra){
  let arr = lsGetJSON(KEYS.dumps, []);
  if (!Array.isArray(arr)) arr = [];
  const n = (arr.length ? (arr[arr.length-1].n|0) : 0) + 1;
  arr.push({n, t:new Date().toISOString(), version:VERSION, stage, expected, got, extra:extra === undefined ? null : extra, state:snapshot()});
  while (arr.length > 5) arr.shift();
  lsSetRaw(KEYS.dumps, JSON.stringify(arr));

}
function fail(stage, expected, got, extra){

  let n = 0;
  try { n = dump(stage, expected, got, extra); toast(`<b>${esc(stage)}</b>: expected ${esc(expected)}, got ${esc(got)}. Dump #${n} in Diagnostics.`, 'err'); }

}

/* ================= slot geometry (pure) ================= */
function slotXY(key, hash, qb){
  const [side, col, row] = key.split(':');
  const bxv = BALL_X[hash] != null ? BALL_X[hash] : BALL_X.M;
  const sg = side === 'R' ? 1 : -1;
  if (col in BALL_COL) return {x:sg * BALL_COL[col], r:+row};
  if (col in SIDE_COL) return {x:(side === 'R' ? FW - SIDE_COL[col] : SIDE_COL[col]) - bxv, r:+row};
  if (col === 'FB') return {x:side === 'M' ? 0 : sg * 2, r:qb === 'gun' ? 5 : 4};
  if (col === 'TB') return {x:0, r:7};
  if (col === 'HB') return {x:sg * 4, r:1};
  return null;
}
function slotOK(key, type, qb){
  const [side, col, row] = key.split(':');
  if (RCOLS.includes(col)) return type !== 'L' || row === '0';
  if (type === 'L') return false;
  if (col === 'FB' && side === 'M') return qb === 'under';
  return true;
}
function dbXY(key, hash){
  const [side, col, row] = key.split(':');
  const bxv = BALL_X[hash] != null ? BALL_X[hash] : BALL_X.M;
  const d = DROW_DEPTH[row], sg = side === 'R' ? 1 : -1;
  if (col === 'M') return {x:FW / 2 - bxv, d};
  if (col in BALL_COL) return {x:sg * BALL_COL[col], d};
  return {x:(side === 'R' ? FW - SIDE_COL[col] : SIDE_COL[col]) - bxv, d};
}

/* ================= formation code (strong / weak) =================
   O + personnel (6/ in front for a sixth lineman) + QB letter, then each man in 2–3 characters:
   s strong / w weak + I T S N W (O = extra lineman) + nothing on the ball, ' off, " stack
   backfield Hw Bw B T Bs Hs. Order: weak outside → in, backfield, strong inside → out.
   Strong = more men on that side (receivers + H-backs); tie → more tight ends; tie → the code that sorts first. */
function sideCounts(tokens){
  const c = {L:{n:0, t:0}, R:{n:0, t:0}};
  tokens.forEach(t => {
    if (!t.slot || t.type === 'L') return;
    const [side, col] = t.slot.split(':');
    if (side === 'M') return;
    if (RCOLS.includes(col) || col === 'HB'){ c[side].n++; if (t.type === 'T') c[side].t++; }
  });
  return c;
}
function codeBody(tokens, strong){
  const sw = side => side === strong ? 's' : 'w';
  const items = tokens.filter(t => t.slot).map(t => {
    const [side, col, row] = t.slot.split(':');
    if (RCOLS.includes(col)){
      const c = t.type === 'L' ? 'O' : col, st = sw(side), ri = OROWS.indexOf(+row);
      return {k:st === 'w' ? -100 + (5 - COL_RANK[c]) * 10 + ri : 100 + COL_RANK[c] * 10 + ri, s:st + c + OMARK[+row]};
    }
    if (col === 'FB'){ if (side === 'M') return {k:-10, s:'B'}; const st = sw(side); return {k:st === 'w' ? -15 : 5, s:'B' + st}; }
    if (col === 'TB') return {k:-5, s:'T'};
    if (col === 'HB'){ const st = sw(side); return {k:st === 'w' ? -20 : 10, s:'H' + st}; }
    return {k:999, s:'?'};
  });
  items.sort((a,b) => a.k - b.k || (a.s < b.s ? -1 : a.s > b.s ? 1 : 0));
  return items.map(i => i.s).join(' ');
}
function strengthOf(tokens){
  const c = sideCounts(tokens);
  if (c.L.n !== c.R.n) return c.R.n > c.L.n ? 'R' : 'L';
  if (c.L.t !== c.R.t) return c.R.t > c.L.t ? 'R' : 'L';
  return codeBody(tokens, 'R') <= codeBody(tokens, 'L') ? 'R' : 'L';
}
const persStr = (pers, xol) => (xol ? '6/' : '') + pers;
function formationCodeOf(off){ return `O${persStr(off.pers, off.xol)}${QB_LETTER[off.qb]} ${codeBody(off.tokens, strengthOf(off.tokens))}`; }
const spotStr = sp => sp === 50 ? '50' : (sp < 0 ? String(sp) : '+' + sp);
const spotLabel = sp => sp === 50 ? '50' : (sp < 0 ? `Own ${-sp}` : `Opp ${sp}`);
const spotAbs = sp => sp === 50 ? 50 : (sp < 0 ? -sp : 100 - sp);
function defCode(def, strong){
  const sgnSide = side => side === strong ? 1 : -1;
  const items = [];
  def.box.forEach(b => {
    const side = b.x > 0 ? 'R' : 'L';
    const st = b.x === 0 ? '' : (side === strong ? 's' : 'w');
    items.push({k:b.x === 0 ? 0 : sgnSide(side) * Math.abs(b.x), d:b.d, s:st + techOf(b.x) + (b.d === 1 ? (b.hand === 'up' ? '^' : '') : "'")});
  });
  def.dbs.forEach(o => {
    const [side, col, row] = o.slot.split(':');
    if (col === 'M') items.push({k:0, d:DROW_DEPTH[row], s:'M' + DMARK[row]});
    else items.push({k:sgnSide(side) * DNOM[col], d:DROW_DEPTH[row], s:(side === strong ? 's' : 'w') + col + DMARK[row]});
  });
  items.sort((a,b) => a.k - b.k || a.d - b.d || (a.s < b.s ? -1 : a.s > b.s ? 1 : 0));
  return 'D ' + items.map(i => i.s).join(' ');
}
function playCode(p){
  let s = `${p.fcode} | ${p.strength}${p.hash}${spotStr(p.spot)}`;
  if (p.def) s += ' | ' + defCode(p.def, p.strength) + (p.def.cov ? ` | ${p.def.cov.code} ${p.def.cov.rcode}` : '');
  return s;
}
function parseFormation(text){
  const errors = [];
  const parts = String(text || '').trim().split('|').map(s => s.trim());
  const s = (parts[0] || '').replace(/\s+/g, ' ');
  const m = s.match(/^O(6\/)?(\d\d)([UPG])\s+(.+)$/);
  if (!m) return {errors:[`header: expected like O11G or O6/22U, got "${s.slice(0, 12)}"`]};
  const xol = !!m[1], pers = m[2], qb = QB_FROM_LETTER[m[3]];
  const out = [];
  m[4].split(' ').forEach(tk => {
    let r;
    if ((r = tk.match(/^([sw])([ITSNWO])(['"]?)$/))) out.push({slot:`${r[1] === 's' ? 'R' : 'L'}:${r[2] === 'O' ? 'I' : r[2]}:${MARK_ROW[r[3]]}`, ol:r[2] === 'O'});
    else if ((r = tk.match(/^B([sw]?)$/))) out.push({slot:`${r[1] === '' ? 'M' : (r[1] === 's' ? 'R' : 'L')}:FB`});
    else if (tk === 'T') out.push({slot:'M:TB'});
    else if ((r = tk.match(/^H([sw])$/))) out.push({slot:`${r[1] === 's' ? 'R' : 'L'}:HB`});
    else errors.push(`token: expected like wN sS' Bs T Hw, got "${tk}"`);
  });
  const nol = out.filter(o => o.ol).length;
  if (out.length !== 5) errors.push(`players: expected 5, got ${out.length}`);
  if (nol !== (xol ? 1 : 0)) errors.push(`extra lineman: expected ${xol ? 1 : 0} O token, got ${nol}`);
  if (new Set(out.map(o => o.slot)).size !== out.length) errors.push('slots: two men in one slot');
  if (+pers[0] + +pers[1] > 5 - (xol ? 1 : 0)) errors.push(`personnel: ${persStr(pers, xol)} needs more skill players than fit`);
  let sit = null;
  if (parts[1]){
    const sm = parts[1].match(/^([LR])([LMR])(50|[+-]\d{1,2})$/);
    if (sm) sit = {strength:sm[1], hash:sm[2], spot:sm[3] === '50' ? 50 : parseInt(sm[3], 10)};
    else errors.push(`situation: expected like RM-35, got "${parts[1].slice(0, 10)}"`);
  }
  return {errors, xol, pers, qb, out, sit};
}
function inferTypes(out, pers){
  const type = {};
  out.forEach((o,i) => { if (o.ol) type[i] = 'L'; });
  const free = pred => out.map((o,i) => i).filter(i => !type[i] && pred(out[i]));
  const take = (list, n, t) => { for (const i of list){ if (n <= 0) break; if (!type[i]){ type[i] = t; n--; } } return n; };
  let nb = +pers[0], nt = +pers[1];
  nb = take(free(o => o.slot === 'M:TB'), nb, 'B');
  nb = take(free(o => /:FB$/.test(o.slot)), nb, 'B');
  nb = take(free(o => /:HB$/.test(o.slot)), nb, 'B');
  take(free(() => true), nb, 'B');
  nt = take(free(o => /:I:0$/.test(o.slot)), nt, 'T');
  nt = take(free(o => /:I:/.test(o.slot)), nt, 'T');
  nt = take(free(o => /:HB$/.test(o.slot)), nt, 'T');
  take(free(() => true), nt, 'T');
  return out.map((o,i) => type[i] || 'W');
}

/* ================= store ================= */
let S = {v:1, seq:0, formations:[], plays:[], fronts:[], designs:[]};
/* older grids → slots */
function toYards(skill){ return skill.map(p => ({type:p.type, letter:p.letter, x:p.x != null ? p.x : Math.round(p.c * 2 / 3), r:p.r})); }
function nearestOffSlots(skill, hash, qb){
  const used = new Set();
  return skill.map(p => {
    let best = null, bd = Infinity;
    OFF_KEYS.forEach(k => {
      if (used.has(k) || !slotOK(k, p.type, qb)) return;
      const q = slotXY(k, hash, qb);
      const d = Math.hypot(q.x - p.x, (q.r - p.r) * 1.5);
      if (d < bd){ bd = d; best = k; }
    });
    used.add(best);
    return {type:p.type, slot:best};
  });
}
function nearestDbSlot(x, d, hash, used){
  let best = null, bd = Infinity;
  DB_KEYS.forEach(k => {
    if (used.has(k)) return;
    const q = dbXY(k, hash);
    const dist = Math.hypot(q.x - x, (q.d - d) * 0.7);
    if (dist < bd){ bd = dist; best = k; }
  });
  used.add(best);
  return best;
}
function strongRight(tokens){ return strengthOf(tokens) === 'L' ? tokens.map(t => Object.assign({}, t, {slot:t.slot && mirrorKey(t.slot)})) : tokens; }
function normFormation(f){
  if (!f || f.fmt === 4) return f;
  try {
    if (Array.isArray(f.skill)){
      const tokens = nearestOffSlots(toYards(f.skill), 'M', f.qb);
      f.tokens = strongRight(tokens); f.xol = false;
      f.code = formationCodeOf(f);
      delete f.skill; delete f.sig; delete f.grid;
      f.fmt = 4; f._conv = true;
    }
  } catch(e){ f._bad = 'convert: ' + e.message; }
  return f;
}
function normPlay(p){
  if (!p || p.fmt === 4) return p;
  try {
    const hash = p.hash || 'M', spot = p.spot == null ? -35 : p.spot;
    if (p.off && Array.isArray(p.off.skill)){
      p.off = {pers:p.off.pers, xol:false, qb:p.off.qb, tokens:nearestOffSlots(toYards(p.off.skill), hash, p.off.qb)};
    }
    p.hash = hash; p.spot = spot;
    if (p.off && p.off.tokens){ p.strength = strengthOf(p.off.tokens); p.fcode = formationCodeOf(p.off); }
    if (p.def && Array.isArray(p.def.box)){
      const box = p.def.box.map(b => {
        let x = b.x;
        if (x == null){ const tech = TECH_X[Math.min(10, Math.abs(b.c))]; x = (b.c < 0 ? -1 : 1) * tech[1]; }
        const d = (b.d != null ? b.d : (b.lvl === 1 ? 1 : 5)) === 1 ? 1 : 5;
        return {x, d, hand:d === 1 ? b.hand : null, tech:techOf(x), label:b.label, cat:b.cat};
      });
      const used = new Set();
      const dbs = (p.def.others || []).map(o => ({slot:nearestDbSlot(o.x != null ? o.x : Math.round(o.c * 2 / 3), o.d, hash, used), label:o.label, kind:o.kind}));
      p.def = {box, dbs, shell:p.def.shell, summary:p.def.summary};
    }
    delete p.grid; delete p.code;
    p.fmt = 4; p._conv = true;
  } catch(e){ p._bad = 'convert: ' + e.message; }
  return p;
}
function checkFormation(f){ const e = f._bad && /^convert/.test(f._bad) ? [f._bad] : validateOffense(f); if (e.length) f._bad = e[0]; else delete f._bad; return e; }
function checkFront(f){ const e = validateDefense(f); if (!e.length && !f.code) e.push('code: missing'); if (e.length) f._bad = e[0]; else delete f._bad; return e; }
function checkDesign(d){
  let e = validateOffense(d && d.off);
  const arts = Array.isArray(d.arts) ? d.arts : d.routes;
  const ok = q => q && Number.isFinite(q.x) && Number.isFinite(q.y);
  if (!Array.isArray(arts)) e.push(`arts: expected array, got ${typeof arts}`);
  else arts.forEach((r,i) => {
    if (r.pts != null && (!Array.isArray(r.pts) || r.pts.length < 2 || !r.pts.every(ok))) e.push(`arts[${i}].pts: expected 2+ {x,y} points, got ${JSON.stringify(r.pts).slice(0, 60)}`);
    if (r.mo != null && (!Array.isArray(r.mo) || r.mo.length < 2 || !r.mo.every(ok))) e.push(`arts[${i}].mo: expected 2+ {x,y} points, got ${JSON.stringify(r.mo).slice(0, 60)}`);
    const who = r.who || r.slot;
    if (!e.length && !OL_ID.includes(who) && who !== 'QB' && !((d.off && d.off.tokens) || []).some(t => t.slot === who)) e.push(`arts[${i}]: no man at ${who}`);
  });
  if (d.def) e = e.concat(validateDefense(d.def));
  if (e.length) d._bad = e[0]; else delete d._bad;
  return e;
}
function checkPlay(p){
  const e = p._bad && /^convert/.test(p._bad) ? [p._bad] : validateOffense(p.off).concat(p.def ? validateDefense(p.def) : []);
  if (!e.length && !/^[LR]$/.test(p.strength || '')) e.push(`strength: expected L|R, got ${p.strength}`);
  if (e.length) p._bad = e[0]; else delete p._bad;
  return e;
}
function loadStore(){
  const t0 = performance.now();
  const raw = lsGetRaw(KEYS.store);
  if (raw == null){ diag('boot.store', 'no saved store, starting empty'); return; }
  let obj;
  try { obj = JSON.parse(raw); }
  catch(e){ lsSetRaw(KEYS.bad, raw); fail('boot.store.parse', 'valid JSON', `unparseable, ${raw.length} chars kept at ${KEYS.bad}`, String(e)); return; }
  const bad = [];
  if (!obj || typeof obj !== 'object') bad.push(['object', typeof obj]);
  else {
    if (!Array.isArray(obj.formations)) bad.push(['formations[]', typeof obj.formations]);
    if (!Array.isArray(obj.plays)) bad.push(['plays[]', typeof obj.plays]);
  }
  if (bad.length){ lsSetRaw(KEYS.bad, raw); fail('boot.store.shape', bad.map(b=>b[0]).join(' + '), bad.map(b=>b[1]).join(' + ')); return; }
  S = {v:1, seq:obj.seq|0, formations:obj.formations.map(normFormation), plays:obj.plays.map(normPlay), fronts:Array.isArray(obj.fronts) ? obj.fronts : [],
    designs:Array.isArray(obj.designs) ? obj.designs : []};
  let flagged = 0, conv = 0;
  S.designs.forEach(d => { if (checkDesign(d).length){ flagged++; diag('boot.validate', `design ${d.id}: ${d._bad}`); } });
  S.fronts.forEach(f => { if (checkFront(f).length){ flagged++; diag('boot.validate', `front ${f.id}: ${f._bad}`); } });
  S.formations.forEach(f => { if (f._conv) conv++; if (checkFormation(f).length){ flagged++; diag('boot.validate', `formation ${f.id}: ${f._bad}`); } });
  S.plays.forEach(p => {
    if (p._conv) conv++;
    if (checkPlay(p).length){ flagged++; diag('boot.validate', `play ${p.id}: ${p._bad}`); }
    if (p.n > S.seq) S.seq = p.n;
  });
  diag('boot.store', `ok: ${S.formations.length} formations, ${S.plays.length} plays, ${S.designs.length} designs, ${conv} converted to slots, ${flagged} flagged, ${raw.length} bytes, ${(performance.now()-t0).toFixed(1)} ms`);
  if (flagged) toast(`<b>boot.validate</b>: ${flagged} saved item(s) failed checks. See Diagnostics.`, 'err');
}
function saveStore(stage){
  const t0 = performance.now();
  const clean = JSON.stringify(S, (k,v) => (k === '_bad' || k === '_conv') ? undefined : v);
  const r = lsSetRaw(KEYS.store, clean);
  if (r !== true){ fail(stage + '.write', 'storage write ok', String(r && r.name || r), {bytes:clean.length}); return false; }
  diag(stage, `local write ok, ${clean.length} bytes, ${(performance.now()-t0).toFixed(1)} ms`);
  if (stage !== 'db.snapshot') syncMark();

}
/* ---- Claude account storage (db capability); this device's copy is the cache. Off the Claude page it stays on this device. ---- */
let DB = null, dbState = 'connecting';
const migrating = {formations:false, plays:false, fronts:false, designs:false};
const NORM = {plays:p => normPlay(p), formations:f => normFormation(f), fronts:f => f, designs:d => d};
const CHECK = {plays:p => checkPlay(p), formations:f => checkFormation(f), fronts:f => checkFront(f), designs:d => checkDesign(d)};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dbBody = obj => JSON.parse(JSON.stringify(obj, (k,v) => (k === '_bad' || k === '_sync' || k === '_conv') ? undefined : v));
async function dbPut(coll, obj, stage){
  if (!DB) return false;
  const t0 = performance.now();
  const ref = DB.collection(coll).doc(obj.id);
  let err = null;
  for (let attempt = 1; attempt <= 2; attempt++){
    try { await ref.set(dbBody(obj)); diag(stage + '.db', `set ${coll}/${obj.id} ok (try ${attempt}) ${(performance.now()-t0).toFixed(0)} ms`); return true; }
    catch(e){ err = e; if (!(e && e.code === 'unavailable') || attempt === 2) break; await sleep(400 + Math.random() * 600); }
  }
  fail(stage + '.db', `${coll}/${obj.id} saved to Claude`, `${err && err.code}: ${err && err.message}`, {coll, id:obj.id, note:'kept on this device; uploads again next open'});
  return false;
}
async function dbDel(coll, id, stage){
  if (!DB) return false;
  try { await DB.collection(coll).doc(id).delete(); diag(stage + '.db', `delete ${coll}/${id} ok`); return true; }
  catch(e){ fail(stage + '.db', `${coll}/${id} deleted at Claude`, `${e && e.code}: ${e && e.message}`); return false; }
}
async function uploadLocalOnly(coll, items){
  if (migrating[coll] || !items.length) return;
  migrating[coll] = true;
  diag('db.migrate', `${coll}: uploading ${items.length} saved only on this device`);
  for (const it of items) await dbPut(coll, it, 'db.migrate');
  migrating[coll] = false;
}
function onCollection(coll, snap){
  const t0 = performance.now();
  const items = [];
  const reupload = [];
  let pending = 0;
  snap.docs.forEach(d => {
    if (!d.exists) return;
    let body = JSON.parse(JSON.stringify(d.data()));
    if (!body.id) body.id = d.id;
    body = NORM[coll](body);
    if (body._conv) reupload.push(body);
    if (d.metadata && d.metadata.hasPendingWrites) pending++; else body._sync = true;
    items.push(body);
  });
  const ids = new Set(items.map(i => i.id));
  const localOnly = S[coll].filter(i => !ids.has(i.id) && !i._sync);
  const droppedElsewhere = S[coll].filter(i => !ids.has(i.id) && i._sync).length;
  S[coll] = items.concat(localOnly);
  S[coll].forEach(i => CHECK[coll](i));
  S.seq = Math.max(S.seq, ...S.plays.map(p => p.n | 0), 0);
  saveStore('db.snapshot');
  diag('db.snapshot', `${coll}: ${items.length} at Claude (${pending} pending, ${reupload.length} converted), ${localOnly.length} only here, ${droppedElsewhere} deleted elsewhere, cache ${snap.metadata.fromCache}, ${(performance.now()-t0).toFixed(1)} ms`);
  if (!snap.metadata.fromCache){ uploadLocalOnly(coll, localOnly.concat(reupload.filter(r => !r._bad))); }
  if (VIEW === 'home') renderHome();
}
async function connectDb(){
  if (!window.claude || typeof window.claude.use !== 'function'){ dbState = 'off'; diag('db', 'no Claude runtime here: saving on this device only'); if (VIEW === 'home') renderHome(); return; }
  let ns = null;
  try { ns = await window.claude.use('db'); } catch(e){ ns = null; diag('db', 'use(db) threw: ' + (e && e.message)); }
  if (!ns){ dbState = 'off'; diag('db', 'db not available in this view: saving on this device only'); if (VIEW === 'home') renderHome(); return; }
  DB = ns; dbState = 'on';
  diag('db', 'connected to Claude storage');
  ['formations', 'plays', 'fronts', 'designs'].forEach(coll => {
    DB.collection(coll).onSnapshot(snap => onCollection(coll, snap), e => {
      fail('db.subscribe.' + coll, 'live updates', `${e && e.code}: ${e && e.message}`);
      if (e && (e.code === 'revoked' || e.code === 'not_granted')){ DB = null; dbState = 'off'; }
      if (VIEW === 'home') renderHome();
    });
  });
  if (VIEW === 'home') renderHome();
}
function pushBaseline(kind, obj){
  let arr = lsGetJSON(KEYS.base, []);

/* ================= sync: one private GitHub Gist, one file per device =================
   phone.json — written only by this app: formations, fronts, designs, plays, deleted ids, hold.
   ipad.json  — written only by chalk on the iPad: queue (plays waiting to be logged), tags (sets picked there).
   Neither side ever writes the other's file, so nothing gets overwritten. Pull every 4 s while the app
   is open (an unchanged gist answers 304 and costs nothing); writes wait 1.5 s so a burst becomes one save. */
const GIST_DESC = 'chalk-playbook sync v1';
const SYNC = {token:null, id:null, etag:null, state:'off', err:null, lastPull:0, lastPush:0, ipad:{queue:[], tags:[], at:null},
  hold:null, timer:null, wtimer:null, writing:false, dirty:false, deleted:[], merged:false, failed:false};
function syncLoadCfg(){
  SYNC.token = lsGetRaw('pb.gh.token') || null;
  SYNC.id = lsGetRaw('pb.gh.gist') || null;
  const d = lsGetJSON('pb.deleted', []); SYNC.deleted = Array.isArray(d) ? d : [];
  const ip = lsGetJSON('pb.ipad', null); if (ip && Array.isArray(ip.queue)) SYNC.ipad = ip;
}
async function gh(method, path, body, etag){
  const t0 = performance.now();
  const headers = {'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + SYNC.token, 'X-GitHub-Api-Version':'2022-11-28'};
  if (etag) headers['If-None-Match'] = etag;
  let res;
  try { res = await fetch('https://api.github.com' + path, {method, headers, body:body ? JSON.stringify(body) : undefined, cache:'no-store'}); }
  catch(e){ throw {status:0, msg:'network: ' + String(e && e.message || e)}; }
  const ms = (performance.now() - t0).toFixed(0), left = res.headers.get('x-ratelimit-remaining');
  if (res.status === 304) return {status:304};
  const text = await res.text();
  let json = null; try { json = text ? JSON.parse(text) : null; } catch(_){}
  diag('sync.http', `${method} ${path.replace(/\?.*/, '')} → ${res.status} in ${ms} ms, ${left} calls left this hour`);
  if (!res.ok) throw {status:res.status, msg:(json && json.message) || text.slice(0, 160), body:text.slice(0, 2000), left};
  return {status:res.status, json, etag:res.headers.get('ETag')};
}
const strip = (k,v) => (k === '_bad' || k === '_sync' || k === '_conv') ? undefined : v;
function phoneJSON(){
  return JSON.stringify({v:1, at:new Date().toISOString(), formations:S.formations, fronts:S.fronts, designs:S.designs, plays:S.plays,
    deleted:SYNC.deleted.slice(-500), hold:SYNC.hold}, strip);
}
function tomb(id){ SYNC.deleted.push(id); lsSetRaw('pb.deleted', JSON.stringify(SYNC.deleted.slice(-500))); }
const stamp = o => String(o.updated || o.created || o.t || '');
/* bring in another copy (the gist's, or pasted data): union by id, the newer copy wins, deleted ids stay deleted */
function mergeStore(src, stage){
  const dead = new Set(SYNC.deleted.concat(Array.isArray(src.deleted) ? src.deleted : []));
  SYNC.deleted = [...dead]; lsSetRaw('pb.deleted', JSON.stringify(SYNC.deleted.slice(-500)));
  const counts = {};
  ['formations','fronts','designs','plays'].forEach(coll => {
    const theirs = Array.isArray(src[coll]) ? src[coll] : [];
    let added = 0, newer = 0;
    const mine = new Map(S[coll].map(o => [o.id, o]));
    theirs.forEach(o => {
      if (!o || !o.id || dead.has(o.id)) return;
      const cur = mine.get(o.id);
      const norm = NORM[coll](JSON.parse(JSON.stringify(o)));
      if (!cur){ mine.set(o.id, norm); added++; }
      else if (stamp(o) > stamp(cur)){ mine.set(o.id, norm); newer++; }
    });
    S[coll] = [...mine.values()].filter(o => !dead.has(o.id));
    S[coll].forEach(o => CHECK[coll](o));
    counts[coll] = `${added} new, ${newer} newer`;
  });
  S.seq = Math.max(S.seq, ...S.plays.map(p => p.n | 0), 0);
  saveStore(stage);
  diag(stage, 'merged', counts);
  return counts;
}
async function readFile(f){
  if (!f) return null;
  let c = f.content;
  if (f.truncated){ const r = await fetch(f.raw_url, {cache:'no-store'}); c = await r.text(); diag('sync.raw', `${f.filename} was over 1 MB: read raw, ${c.length} bytes`); }
  try { return JSON.parse(c); }
  catch(e){ fail('sync.parse', `${f.filename} as JSON`, String(e), c.slice(0, 300)); return null; }
}
async function syncFind(){
  if (SYNC.id) return;
  for (let page = 1; page <= 5; page++){
    const r = await gh('GET', `/gists?per_page=100&page=${page}`);
    const hit = (r.json || []).find(g => g.description === GIST_DESC);
    if (hit){ SYNC.id = hit.id; lsSetRaw('pb.gh.gist', hit.id); diag('sync.find', `found the sync gist ${hit.id}`); return; }
    if (!r.json || r.json.length < 100) break;
  }
  const r = await gh('POST', '/gists', {description:GIST_DESC, public:false, files:{
    'phone.json':{content:phoneJSON()}, 'ipad.json':{content:JSON.stringify({v:1, at:new Date().toISOString(), queue:[], tags:[]})}}});
  SYNC.id = r.json.id; lsSetRaw('pb.gh.gist', SYNC.id);
  diag('sync.find', `no sync gist yet: made ${SYNC.id}`);
}
async function syncPull(){
  const r = await gh('GET', `/gists/${SYNC.id}`, null, SYNC.etag);
  if (r.status === 304) return false;
  SYNC.etag = r.etag;
  const files = (r.json && r.json.files) || {};
  const ip = await readFile(files['ipad.json']);
  if (ip){
    const bad = [];
    if (!Array.isArray(ip.queue)) bad.push(`queue: expected array, got ${typeof ip.queue}`);
    if (ip.tags != null && !Array.isArray(ip.tags)) bad.push(`tags: expected array, got ${typeof ip.tags}`);
    if (bad.length) fail('sync.ipad', 'ipad.json with queue[] and tags[]', bad.join('; '), JSON.stringify(ip).slice(0, 400));
    else {
      const before = SYNC.ipad.queue.length;
      SYNC.ipad = {queue:ip.queue, tags:ip.tags || [], at:ip.at || null};
      lsSetRaw('pb.ipad', JSON.stringify(SYNC.ipad));
      pushBaseline('ipad', SYNC.ipad);
      diag('sync.pull', `iPad: ${ip.queue.length} queued (was ${before}), ${(ip.tags || []).length} tags, written ${ip.at}`);
    }
  }
  if (!SYNC.merged){
    const ph = await readFile(files['phone.json']);
    if (ph) mergeStore(ph, 'sync.merge');
    SYNC.merged = true;
    syncMark();
  }
  return true;
}
function syncMark(ms){
  if (!SYNC.token) return;
  SYNC.dirty = true;
  clearTimeout(SYNC.wtimer);
  SYNC.wtimer = setTimeout(syncPush, ms == null ? 1500 : ms);
}
async function syncPush(){
  if (!SYNC.token) return;
  if (!SYNC.id || !SYNC.merged || SYNC.writing){ SYNC.wtimer = setTimeout(syncPush, 1500); return; }
  SYNC.writing = true; SYNC.dirty = false;
  const content = phoneJSON();
  try {
    await gh('PATCH', `/gists/${SYNC.id}`, {files:{'phone.json':{content}}});
    SYNC.lastPush = Date.now(); syncOk();
    diag('sync.push', `phone.json saved, ${content.length} bytes`);
  } catch(e){ syncFail('push', e); SYNC.dirty = true; }
  SYNC.writing = false;
  if (SYNC.dirty) syncMark(SYNC.state === 'error' ? 15000 : 1500);
  if (VIEW === 'home') renderHome();
}
function syncOk(){ if (SYNC.state !== 'on') diag('sync', 'connected'); SYNC.state = 'on'; SYNC.err = null; SYNC.failed = false; }
function syncFail(stage, e){
  const was = SYNC.state;
  SYNC.state = e.status === 401 ? 'auth' : 'error';
  SYNC.err = `${e.status || 'no answer'}: ${e.msg}`;
  if (!SYNC.failed || was !== SYNC.state) fail('sync.' + stage, 'GitHub answers 2xx', SYNC.err, {body:e.body, callsLeft:e.left});
  else diag('sync.' + stage, `still failing: ${SYNC.err}`);
  SYNC.failed = true;
}
async function syncTick(){
  clearTimeout(SYNC.timer);
  if (SYNC.token && document.visibilityState !== 'hidden'){
    try { await syncFind(); const changed = await syncPull(); SYNC.lastPull = Date.now(); syncOk(); if (changed && VIEW === 'home') renderHome(); }
    catch(e){ syncFail('pull', e); if (VIEW === 'home') renderHome(); }
  }
  if (SYNC.token) SYNC.timer = setTimeout(syncTick, SYNC.state === 'on' ? 4000 : 20000);
}
function syncStart(){
  syncLoadCfg();
  if (!SYNC.token){ SYNC.state = 'off'; diag('sync', 'no token: this phone only'); return; }
  SYNC.state = 'connecting'; SYNC.merged = false; SYNC.etag = null;
  syncTick();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && SYNC.token) syncTick(); });
/* the iPad follows the phone: while a queued play is open here, chalk holds it on the snap */
function setHold(key, frame){
  SYNC.hold = key ? {key, frame:frame || 'snap', at:new Date().toISOString()} : null;
  diag('sync.hold', key ? `iPad: hold ${key} on the ${SYNC.hold.frame}` : 'iPad: let go');
  syncMark(300);
}
const queueOpen = () => SYNC.ipad.queue.filter(q => q && q.key && !S.plays.some(p => p.key === q.key)).sort((a,b) => String(a.at || '').localeCompare(String(b.at || '')));
const syncWord = () => ({on:'Synced', connecting:'Connecting…', error:'Sync failing', auth:'Token rejected', off:'Not synced'}[SYNC.state] || SYNC.state);

/* ================= validation at the seams ================= */
function validateOffense(o){
  const e = [];
  if (!o || typeof o !== 'object') return [`offense: expected object, got ${typeof o}`];
  if (!/^\d\d$/.test(o.pers || '')) e.push(`pers: expected two digits, got ${JSON.stringify(o.pers)}`);
  if (!(o.qb in QB_DEPTH)) e.push(`qb: expected under|pistol|gun, got ${JSON.stringify(o.qb)}`);
  if (!Array.isArray(o.tokens) || o.tokens.length !== 5){
    e.push(`players: expected 5, got ${Array.isArray(o.tokens) ? o.tokens.length : typeof o.tokens}`);
    return e;
  }
  const seen = new Set();
  o.tokens.forEach((t,i) => {
    if (!t || !OFF_KEYS.includes(t.slot)) e.push(`player[${i}].slot: expected a slot like R:S:1, got ${t && t.slot}`);
    else if (!slotOK(t.slot, t.type, o.qb)) e.push(`player[${i}]: ${TYPE_LABEL[t.type] || t.type} cannot stand at ${t.slot} with the QB ${o.qb}`);
    if (!/^[BTWL]$/.test(t && t.type || '')) e.push(`player[${i}].type: expected B/T/W/L, got ${t && t.type}`);
    if (t && seen.has(t.slot)) e.push(`player[${i}]: slot ${t.slot} used twice`);
    if (t) seen.add(t.slot);
  });
  const nL = o.tokens.filter(t => t && t.type === 'L').length;
  if (nL !== (o.xol ? 1 : 0)) e.push(`extra lineman: expected ${o.xol ? 1 : 0}, got ${nL}`);
  const on = 5 + o.tokens.filter(t => t && t.slot && /:[ITSNW]:0$/.test(t.slot)).length;
  if (on < 7) e.push(`line: expected 7+ on the line, got ${on}`);
  return e;
}
function validateDefense(d){
  const e = [];
  if (!d || !Array.isArray(d.box) || !Array.isArray(d.dbs)) return [`defense: expected box[] + dbs[], got ${d ? Object.keys(d).join(',') : d}`];
  d.box.forEach((b,i) => {
    if (typeof b.x !== 'number' || Math.abs(b.x) > 6.5 || !Number.isInteger(b.x * 2)) e.push(`box[${i}].x: expected a technique spot within ±6.5, got ${b.x}`);
    if (b.d !== 1 && b.d !== 5) e.push(`box[${i}].d: expected 1 or 5, got ${b.d}`);
    if (b.d === 1 && b.hand !== 'down' && b.hand !== 'up') e.push(`box[${i}].hand: expected down|up, got ${b.hand}`);
  });
  const seen = new Set();
  d.dbs.forEach((o,i) => {
    if (!DB_KEYS.includes(o.slot)) e.push(`dbs[${i}].slot: expected a slot like R:N:o, got ${o.slot}`);
    if (seen.has(o.slot)) e.push(`dbs[${i}]: slot ${o.slot} used twice`);
    seen.add(o.slot);
  });
  const tot = d.box.length + d.dbs.length;
  if (tot !== 11) e.push(`count: expected 11 defenders, got ${tot}`);
  if (d.roles != null){
    if (!Array.isArray(d.roles)) e.push(`roles: expected array, got ${typeof d.roles}`);
    else d.roles.forEach((r,i) => { if (!r || !['Rush','Man','Zone','Spy'].includes(r.job)) e.push(`roles[${i}].job: expected Rush|Man|Zone|Spy, got ${r && r.job}`); });
  }
  if (![0,1,2].includes(d.shell)) e.push(`shell: expected 0|1|2, got ${d.shell}`);
  return e;
}

/* ================= working state ================= */
let VIEW = 'home', PREV_VIEW = 'home';
let W = null;
let uid = 1;
const nid = () => 'k' + (uid++);
let drag = null, bubble = null, chipDrag = null;
const RKINDS = new Set(['rv','rb','rs']);

function buildTokens(pers, xol, old){
  const rb = +pers[0], te = +pers[1], wr = Math.max(0, 5 - rb - te - (xol ? 1 : 0));
  const types = [...(xol ? ['L'] : []), ...Array(te).fill('T'), ...Array(wr).fill('W'), ...Array(rb).fill('B')];
  const pool = old.slice();
  return types.map(t => {
    const i = pool.findIndex(p => p.type === t);
    if (i >= 0) return Object.assign({}, pool.splice(i,1)[0]);
    return {id:nid(), type:t, slot:null};
  });
}
function newDef(){ return {box:[], shell:2, deep:[], rest:[], cur:0, pendingHand:null, sel:null, shellBuilt:false, mode:'down', hist:[]}; }
function newWork(mode){
  return {mode, step:'off', pers:'11', xol:false, qb:'gun', hash:'M', spot:-35, strength:'R', tokens:buildTokens('11', false, []), cur:0, name:'', editId:null, playId:null, def:newDef(),
    droles:{}, dsel:null, side:'O', routes:{}, motion:{}, rmode:'route', pside:1, psideSet:false, concept:null, pick:null, rsel:null, rhist:[], defSrc:{kind:'preset', id:'43o'}, defName:'4-3 Over', setName:'', editDesign:null, dirty:false};
}
function loadOffInto(w, off, letters){
  w.pers = off.pers; w.xol = !!off.xol; w.qb = off.qb;
  w.tokens = off.tokens.map(t => ({id:nid(), type:t.type, slot:t.slot, fixed:letters ? (t.letter || null) : undefined}));
  w.cur = 0;
}
function loadDefInto(w, d){
  w.def = newDef();
  if (!d) return;
  w.def.box = d.box.map(b => ({id:nid(), x:b.x, d:b.d, hand:b.d === 1 ? b.hand : null}));
  w.def.shell = d.shell;
  w.def.deep = d.dbs.filter(o => o.kind === 'deep').map(o => ({id:nid(), slot:o.slot}));
  w.def.rest = d.dbs.filter(o => o.kind !== 'deep').map(o => ({id:nid(), slot:o.slot}));
  w.def.shellBuilt = true;
  w.droles = {}; w.dsel = null;
  (d.roles || []).forEach(r => { w.droles[r.key] = {job:r.job, on:r.on || null}; });
}

/* ================= field geometry (world units are yards) =================
   X = yards from the left sideline (0..53⅓). Y = yards from the line of scrimmage, + toward the defense.
   Offense man at depth r sits at Y = −r − 0.6; defender at depth d sits at Y = d − 0.4. */
const G = {W:390, H:420, s:7, anchorY:240};
const V = {z:1, camX:FW / 2, camY:0};
const bx = () => BALL_X[W ? W.hash : 'M'];
const SC = () => G.s * V.z;
const sx = X => G.W / 2 + (X - V.camX) * SC();
const sy = Y => G.anchorY - (Y - V.camY) * SC();
const wx = px => V.camX + (px - G.W / 2) / SC();
const wy = py => V.camY + (G.anchorY - py) / SC();
const offY = r => -r - 0.6;
const defY = d => d - 0.4;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const oxy = key => slotXY(key, W.hash, W.qb);
const dxy = key => dbXY(key, W.hash);
function measure(){
  const wrap = $('#fieldWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return false;
  G.W = w; G.H = h; G.s = w / 56; G.anchorY = h * 0.6;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  return true;
}
function clampCam(){
  V.z = clamp(V.z, 1, 4);
  const halfW = G.W / 2 / SC();
  V.camX = V.z <= 1.01 ? FW / 2 : clamp(V.camX, halfW - 1.5, FW - halfW + 1.5);
  V.camY = clamp(V.camY, -25, 40);
}
function viewForStep(){
  if (!W) return;
  if (W.step === 'box'){ V.z = 2.4; V.camX = bx(); V.camY = 3.4; }
  else if (W.step === 'rest' || W.step === 'djobs'){ V.z = 1; V.camX = FW / 2; V.camY = 6; }
  else if (W.step === 'view'){ V.z = 1; V.camX = FW / 2; V.camY = 4; }
  else if (W.step === 'routes'){ V.z = 1; V.camX = FW / 2; V.camY = 8; }
  else { V.z = 1; V.camX = FW / 2; V.camY = 0; }
  clampCam();
}
const rad = () => clamp(0.85 * SC(), 6.5, 13);
function snapBox(p){
  const X = wx(p.x) - bx(), Y = wy(p.y);
  if (Y < -0.6) return null;
  if (Math.abs(X) > 7.25) return null;
  let best = TECH_SPOTS[0];
  TECH_SPOTS.forEach(v => { if (Math.abs(v - X) < Math.abs(best - X)) best = v; });
  const d = Y + 0.4;
  if (d < 2.4) return {x:best, d:1};
  if (d <= 7.6) return {x:best, d:5};
  return null;
}

/* ================= offense logic ================= */
const isRecSlot = k => !!k && RCOLS.includes(k.split(':')[1]);
function placedPlayers(){
  return W.tokens.filter(t => t.slot && t.type !== 'L').map(t => { const q = oxy(t.slot); return {id:t.id, type:t.type, x:q.x, r:q.r}; });
}
function dispXY(t){
  const p = oxy(t.slot);
  const [side, col, row] = t.slot.split(':');
  const sg = side === 'R' ? 1 : -1;
  if (row === '1' && (col === 'I' || col === 'T' || col === 'S')){
    const order = ['I','T','S'], i = order.indexOf(col);
    if (col === 'I' && W.tokens.some(o => o.slot === `${side}:I:0`)) return {x:p.x + sg, r:p.r};
    for (const j of [i - 1, i + 1]){
      if (j < 0 || j > 2) continue;
      const nk = `${side}:${order[j]}:0`;
      if (W.tokens.some(o => o.slot === nk)){ const nx = oxy(nk).x; return {x:nx + Math.sign(p.x - nx) * 1.5, r:p.r}; }
    }
  }
  return p;
}
const inBackfield = p => p.r >= 2 && Math.abs(p.x) <= 4;
function assignLetters(players){
  const L = {}, free = new Set(['X','Y','Z','H','F']), un = new Set(players.map(p => p.id));
  const take = (p,l) => { L[p.id] = l; free.delete(l); un.delete(p.id); };
  const rem = () => players.filter(p => un.has(p.id));
  const bf = players.filter(inBackfield).sort((a,b) => b.r - a.r || Math.abs(a.x) - Math.abs(b.x));
  if (bf.length) take(bf[0], 'F');
  else { const b = players.find(p => p.type === 'B'); if (b) take(b, 'F'); }
  const tes = rem().filter(p => p.type === 'T').sort((a,b) => (a.r > 0) - (b.r > 0) || Math.abs(a.x) - Math.abs(b.x));
  if (tes.length) take(tes[0], 'Y');
  if (bf.length > 1 && un.has(bf[1].id)) take(bf[1], 'H');
  else if (tes.length > 1 && un.has(tes[1].id)) take(tes[1], 'H');
  const wide = arr => arr.sort((a,b) => Math.abs(b.x) - Math.abs(a.x));
  let xSide = 0;
  const xOn = wide(rem().filter(p => p.type === 'W' && p.r === 0));
  const xAny = wide(rem().filter(p => p.type === 'W'));
  const xPick = xOn[0] || xAny[0];
  if (xPick){ take(xPick, 'X'); xSide = Math.sign(xPick.x) || 1; }
  const zc = wide(rem().filter(p => p.type === 'W'));
  const zPick = zc.find(p => (Math.sign(p.x) || 1) !== xSide) || zc[0];
  if (zPick) take(zPick, 'Z');
  if (free.has('H')){ const h = rem().sort((a,b) => Math.abs(a.x) - Math.abs(b.x))[0]; if (h) take(h, 'H'); }
  const order = ['X','Z','H','Y','F'].filter(l => free.has(l));
  wide(rem()).forEach((p,i) => { if (order[i]) take(p, order[i]); });
  return L;
}
function lettersNow(){
  if (W.step !== 'off' && W.tokens.every(t => t.type === 'L' || t.fixed)){
    const L = {}; W.tokens.forEach(t => { if (t.fixed) L[t.id] = t.fixed; }); return L;
  }
  return assignLetters(placedPlayers());
}
function offStatus(){
  const placed = W.tokens.filter(t => t.slot);
  const left = W.tokens.length - placed.length;
  const onLineMen = placed.filter(t => /:[ITSNW]:0$/.test(t.slot));
  const onLine = 5 + onLineMen.length;
  const issues = [];
  if (!left){
    if (onLine < 7) issues.push({lvl:'err', msg:`Illegal: ${onLine} on the line. Need 7. Put a man on the ball.`});
    else {
      const L = lettersNow();
      ['L','R'].forEach(side => {
        const on = onLineMen.filter(t => t.slot[0] === side).sort((a,b) => Math.abs(oxy(b.slot).x) - Math.abs(oxy(a.slot).x));
        if (!on.length) issues.push({lvl:'warn', msg:`${side === 'L' ? 'LT' : 'RT'} is the end man on the line. He is not eligible.`});
        else if (on[0].type === 'L') issues.push({lvl:'warn', msg:`The extra lineman is the end man on the ${side === 'L' ? 'left' : 'right'}.`});
        on.slice(1).filter(t => t.type !== 'L').forEach(t => issues.push({lvl:'warn', msg:`${L[t.id] || 'A man'} is covered. He is not eligible.`}));
      });
    }
  }
  return {left, placed:placed.length, onLine, issues, legal:!left && onLine >= 7};
}
function offObject(){
  const L = lettersNow();
  return {pers:W.pers, xol:W.xol, qb:W.qb, tokens:W.tokens.map(t => ({type:t.type, slot:t.slot, letter:t.type === 'L' ? null : (L[t.id] || null)}))};
}
function suggestNames(){
  const off = offObject();
  const out = [];
  const code = formationCodeOf(off);
  S.formations.filter(f => f.code === code).forEach(f => out.push({name:f.name, note:'saved'}));
  if (W.editId){ const f = S.formations.find(o => o.id === W.editId); if (f) out.unshift({name:f.name, note:'current'}); }
  const st = strengthOf(off.tokens);

}

const FABBR = {Fake:'FK', 'Hand off':'HO', 'PA fake':'PA', Read:'RD', Boot:'BT', Pitch:'PT', Drop:'DP', Ride:'RI', Sprint:'SP', Option:'OP'};

function men(){

/* ---- routes ---- one leg, in outside-positive yards: oF out flat · oU out and up · V vertical · iU in and up · iF in flat · B back toward the line */
function segKind(a, b){

      blk(R.psY, 'base');
      if (R.fb && R.fb !== forced) blk(R.fb, 'lead', 'Iso', ps * 2.5); else note.push('no lead back');
      carry(R.tb, ps * 2.5);

    case 'trap':
      line(['climb', ['climb', null, lbNear(D, -ps)], 'down', 'trap', 'hinge']);
      blk(R.psY, 'arc');
      carry(pick(R.fb !== forced && R.fb, R.tb), ps * 1.2);

    case 'wham': {

      if (w) blk(w, 'wham', 'Wham'); else note.push('no wham blocker');

    }
    case 'draw':
      line(['pro', 'pro', 'pro', 'pro', 'pro']);

      carry(R.tb, ps, {delay:true});

      if (R.fb && R.fb !== forced) blk(R.fb, 'lead', 'Lead', E.x + ps * 2.5);
      carry(R.tb, E.x + ps * 3, {wide:true});
      if (R.QB){ const c = forced || R.tb; const q = snapAbs(R.QB); put(R.QB, 'fake', [[c ? (q[0] + snapAbs(c)[0]) / 2 + ps * 2.5 : q[0] + ps * 3, q[1] - 0.6]], 'Pitch'); }
      break;
    case 'jet': {
      line([['wide','Zone'], ['wide','Zone'], ['wide','Zone'], ['wide','Zone'], ['wide','Zone']]);
      blk(R.psY, 'reach');
      const j = forced || R.sk.filter(m => m.r < 2 && snapAbs(m)[0] * ps < 0 && m !== R.bsY).sort((a,b) => (a.type === 'W' ? 0 : 1) - (b.type === 'W' ? 0 : 1) || Math.abs(a.x) - Math.abs(b.x))[0]
        || R.sk.find(m => m.r < 2 && m.type === 'W');
      if (j){
        if (!W.motion[j.id]) setMotion(j, 'Jet');
        put(j, 'carry', [[ps * 4, -1.2], [ps * 8.5, 0.6], [ps * 9.5, 5]]);
      } else note.push('no one to run the jet');
      if (R.tb && R.tb !== j) put(R.tb, 'fake', carryPath(R.tb, -ps * 2, ps).slice(0, 2), 'Fake');
      if (R.QB && !R.used.has(R.QB.id)){ setQB(R.QB, 'Hand off', ps); R.used.add(R.QB.id); }
      break;
    }
    case 'buck': {
      const hole = R.psY ? snapAbs(R.psY)[0] + ps * 1.5 : ps * 5.5;
      line(['down', 'pullKick', 'down', ['pullWrap', null, hole], 'hinge']);
      blk(R.psY, 'down');
      if (R.psW) put(R.psW, 'block', [contact(snapAbs(R.psW), lbNear(D, ps * 3))], 'Down');
      const ball = forced || pick(R.tb !== R.fb && R.tb, R.backs.find(b => b !== R.fb), R.bsY);
      if (ball){ const s = snapAbs(ball); put(ball, 'carry', [[s[0] + ps * 2, s[1] - 0.6], [hole - ps * 0.5, -1], [hole + ps * 0.5, 0.8], [hole + ps, 5]]); }
      if (R.fb && R.fb !== ball) put(R.fb, 'fake', [[snapAbs(R.fb)[0] + ps * 0.5, 0.8]], 'Fake');
      if (R.QB){ const q = snapAbs(R.QB); put(R.QB, 'fake', [[q[0] - ps * 0.8, q[1] - 0.4], [q[0] + ps * 0.8, q[1] - 1.2], [q[0] - ps * 5, q[1] - 1.5]], 'Boot'); }
      break;
    }
    case 'belly':
      line(['down', 'down', 'down', 'pullKick', 'hinge']);
      blk(R.psY, 'down');
      if (R.psW) put(R.psW, 'block', [contact(snapAbs(R.psW), lbNear(D, ps * 3))], 'Down');
      carry(pick(R.fb, R.tb), ps * 4);
      if (R.tb && !R.used.has(R.tb.id)) put(R.tb, 'fake', carryPath(R.tb, E.x + ps * 3, ps, {wide:true}).slice(0, 2), 'Fake');
      break;
    case 'wtdown':
      line(['down', 'pullKick', 'down', ['pullWrap', null, ps * 4.5], 'hinge']);
      blk(R.psY, 'down');
      if (R.psW) put(R.psW, 'block', [contact(snapAbs(R.psW), lbNear(D, ps * 3))], 'Down');
      if (R.fb && R.fb !== forced) blk(R.fb, 'lead', 'Lead', ps * 4.5);
      carry(R.tb, ps * 4.5);
      break;
    case 'waggle': {
      line(['base', 'pullKick', 'base', ['pullLead', 'Lead'], 'hinge']);
      const qb = forced || R.QB;
      if (qb){ const q = snapAbs(qb); put(qb, 'carry', [[q[0] - ps, q[1] - 0.5], [q[0] + ps * 2, q[1] - 1.8], [ps * 7, -2.5]]); }
      if (R.fb && !R.used.has(R.fb.id)) put(R.fb, 'fake', [[snapAbs(R.fb)[0] - ps * 1.5, 0.8]], 'Fake');
      if (R.tb && !R.used.has(R.tb.id)){ const s = snapAbs(R.tb); put(R.tb, 'fake', [[s[0] - ps * 3, s[1] - 0.3], [-ps * 7, -1]], 'Fake'); }

      const bsSide = rec.filter(m => snapAbs(m)[0] * ps <= 0).sort((a,b) => Math.abs(snapAbs(a)[0]) - Math.abs(snapAbs(b)[0]));
      psSide.forEach((m,i) => { setRoute(m, i === 0 ? 'Corner' : 'Flat'); R.used.add(m.id); });
      bsSide.forEach((m,i) => { setRoute(m, i === 0 ? 'Drag' : 'Post'); R.used.add(m.id); });
      break;
    }
    case 'veer': case 'midline': {
      if (id === 'veer') line(['climb', 'base', 'base', 'base', 'hinge']);
      else line(['base', 'climb', 'base', 'base', 'hinge']);
      if (id === 'veer') blk(R.psY, 'arc', 'Arc'); else blk(R.psY, 'base');
      const dive = forced || pick(R.fb, R.tb);
      if (dive) put(dive, 'carry', carryPath(dive, id === 'veer' ? ps * 3 : ps * 0.8, ps));
      if (R.QB && R.QB !== dive){ const q = snapAbs(R.QB); put(R.QB, id === 'veer' ? 'carry' : 'fake', id === 'veer' ? [[q[0] + ps, q[1] - 0.2], [ps * 4.5, -1], [ps * 6, 2]] : [[q[0] + ps, q[1] + 0.4], [ps * 2.5, 1]], id === 'veer' ? 'Option' : 'Read'); }
      const pitch = pick(R.tb !== dive && R.tb, R.backs.find(b => b !== dive));
      if (pitch){ const s = snapAbs(pitch); put(pitch, 'fake', [[s[0] + ps * 4, s[1] - 0.5], [ps * 10, -3.5]], 'Pitch'); }
      break;
    }
    case 'speed': {
      line([['wide','Zone'], ['wide','Zone'], ['wide','Zone'], ['wide','Zone'], ['wide','Zone']]);
      blk(R.psY, 'arc', 'Arc');
      const ball = forced || R.QB;
      if (ball){ const q = snapAbs(ball); put(ball, 'carry', [[q[0] + ps * 3, q[1] + 0.3], [ps * 6, 0.5], [ps * 7, 4]], 'Option'); }
      const p = pick(R.tb, R.backs.find(b => b !== ball));
      if (p){ const s = snapAbs(p); put(p, 'fake', [[s[0] + ps * 4, s[1] - 1], [ps * 11, -2]], 'Pitch'); }
      break;
    }
    default: fail('concept', 'a known run concept', id); return;
  }
  /* everyone left: linemen base, ends seal their side, backs fake, receivers stalk, QB hands off */
  ['PST','PSG','C','BSG','BST'].forEach(k => blk(R[k], 'base'));
  if (R.xol) blk(R.xol, snapAbs(R.xol)[0] * ps > 0 ? 'down' : 'hinge');
  if (R.QB && !R.used.has(R.QB.id)){ setQB(R.QB, W.qb !== 'under' && ['iz','sz','oz','power','counter','ch','dart'].includes(id) ? 'Read' : 'Hand off', ps); R.used.add(R.QB.id); }
  R.sk.forEach(m => {
    if (R.used.has(m.id)) return;
    if (m.r >= 2) put(m, 'fake', [[snapAbs(m)[0] - ps * 2, snapAbs(m)[1] + 1.5]], 'Fake');
    else if (m.type === 'W' && Math.abs(snapAbs(m)[0]) > 7) blk(m, 'stalk', 'Stalk');

  diag('concept', `${name} ${ps > 0 ? 'right' : 'left'}${forced ? ', ball to ' + forced.tag : ''}: ${men().map(m => manToken(m)).filter(Boolean).join(' ')}`);

}

const f1 = n => n.toFixed(1);

function tri(x, y, label, style, sel){
  const s = rad() * 1.02;

  let fill = '#2A3139', stroke = '#C4CCD3', tc = '#F2F4F3', dash = '';

  if (style === 'pend'){ fill = '#13241A'; stroke = '#FFFFFF'; tc = '#FFFFFF'; dash = ' stroke-dasharray="3 2"'; }

  if (sel) out += `<circle cx="${f1(x)}" cy="${f1(y - 1)}" r="${f1(s + 5)}" fill="none" stroke="#FFFFFF" stroke-width="2"/>`;
  out += `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="1.6"${dash}/>`;
  if (s >= 7.5) out += TXT(x, y - s * 0.22, label, label.length > 1 ? s * 0.74 : s * 0.92, tc);

function zigzag(sp){
  const out = [sp[0]];
  for (let i = 1; i < sp.length; i++){
    const a = sp[i-1], b = sp[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]);

function blockPts(m, d, d2, pull){
  const s = snapAbs(m), dx = d.x - s[0], dir = Math.sign(dx) || 1;

    let d = D.find(q => q.key === a.target);
    if (!d && a.tx != null){
      d = nearD(D.filter(q => Math.hypot(q.x - a.tx, q.Y - a.tY) <= 2.5), a.tx, a.tY);
      if (d){ diag('block.retarget', `${m.tag}: ${a.target} gone, now ${d.key}`); a.target = d.key; }
    }

      const tx = TECH_X.find(([t]) => t === m[2])[1];

    }
    else if ((m = tk.match(/^([sw])([ITSNW])(['"]?)$/))) dbs.push(`${sideOf(m[1])}:${m[2]}:${m[3] === '' ? 'p' : (m[3] === "'" ? 'o' : 'd')}`);

const ORD = ['', '1st', '2nd', '3rd', '4th'];
const sitWord = q => q && q.down ? `${ORD[q.down] || q.down} & ${q.dist == null ? '?' : q.dist}` : 'Play';

function startQueued(q){
  W = newWork('log');
  W.qkey = q.key; W.qsit = q.sit || null; W.qdesc = q.desc || '';

  if (qb) W.qb = qb;
  if (q.sit && q.sit.yard != null) W.spot = yardToSpot(q.sit.yard);
  setStep('off'); setView('editor'); refresh();
  setHold(q.key, 'snap');
  diag('flow', `queue: logging ${q.key} (${sitWord(q.sit)})`);
}
function goHome(){ if (SYNC.hold) setHold(null); W = null; drag = null; bubble = null; setView('home'); refresh(); }
function startLog(f){

function startTemplate(f){

function goName(){
  const st = offStatus();
  if (st.left || !st.legal){ fail('off.name', 'all 5 placed and 7 on the line', `${st.left} left, ${st.onLine} on the line`); return; }
  W.tokens.forEach(t => { delete t.fixed; });

function upsertFormation(off, name, editId){
  const code = formationCodeOf(off);
  const tokens = strongRight(off.tokens.map(t => ({type:t.type, slot:t.slot})));
  let f = editId ? S.formations.find(o => o.id === editId) : S.formations.find(o => o.code === code);
  const now = new Date().toISOString();
  if (f){
    const was = f.name;
    Object.assign(f, {name, pers:off.pers, xol:off.xol, qb:off.qb, tokens, code, fmt:4, updated:now});
    delete f._bad;
    diag('save.formation', `updated ${f.id}: "${was}" → "${name}" ${code}`);
  } else {
    f = {id:'f' + Date.now().toString(36), name, pers:off.pers, xol:off.xol, qb:off.qb, tokens, code, fmt:4, created:now};
    S.formations.push(f);
    diag('save.formation', `new ${f.id} "${name}" ${code}`);
  }
  return f;
}
function startNext(keep){
  if (keep.queue){
    const nx = queueOpen()[0];
    if (nx){ startQueued(nx); return; }
    setHold(null); toast('The queue is empty. Nice work.'); goHome(); return;
  }
  W = newWork('log');
  Object.assign(W, keep); W.tokens = buildTokens(keep.pers, keep.xol, []);
  setStep('off'); setView('editor'); refresh();
}
function saveOff(after){
  const name = ($('#fname') ? $('#fname').value : W.name).trim();
  if (!name){ toast('Give the set a name. Tap a suggestion or type one.'); return; }
  const off = offObject();
  const errs = validateOffense(off);
  if (errs.length){ fail('save.offense', 'valid offense', errs.join('; '), off); return; }
  const fcode = formationCodeOf(off);
  const rt = parseFormation(fcode);
  if (rt.errors.length){ fail('save.code', 'a code that reads back', rt.errors[0], fcode); return; }
  const f = upsertFormation(off, name, W.mode === 'template' ? W.editId : null);
  if (W.mode === 'template'){
    if (saveStore('save.formation')){ pushBaseline('formation', f); dbPut('formations', f, 'save.formation'); toast(`Saved formation: ${esc(name)}`); goHome(); }
    return;
  }
  const play = {id:'p' + Date.now().toString(36), n:++S.seq, t:new Date().toISOString(), formationId:f.id, name, fcode,
    strength:strengthOf(off.tokens), hash:W.hash, spot:W.spot, off, def:null, fmt:4, key:W.qkey || null, sit:W.qsit || null};
  S.plays.push(play);
  if (!saveStore('save.play')){ S.plays.pop(); S.seq--; return; }
  pushBaseline('play', play);
  dbPut('formations', f, 'save.formation');
  dbPut('plays', play, 'save.play');
  /* the next play keeps personnel, QB depth, hash and spot */
  const keep = {pers:W.pers, xol:W.xol, qb:W.qb, hash:W.hash, spot:W.spot, queue:!!W.qkey};
  if (after === 'def'){
    W.playId = play.id; W.strength = play.strength; W.mode = 'log'; W.chain = keep;
    W.tokens.forEach((t,i) => { t.fixed = play.off.tokens[i] ? (play.off.tokens[i].letter || null) : null; });
    W.def = newDef();
    setStep('box');
    diag('flow', `play ${play.n} logged: ${playCode(play)} → defense`);
    toast(`Play ${play.n} logged. Now the defense.`);
    refresh();
    return;
  }
  diag('flow', `play ${play.n} logged: ${playCode(play)} → next play`);
  startNext(keep);
  toast(`Play ${play.n} logged: ${esc(name)}`);
}
function saveDef(){
  const play = S.plays.find(p => p.id === W.playId);
  if (!play){ fail('save.defense', `play ${W.playId}`, 'not found'); return; }
  const d = defObject();
  const errs = validateDefense(d);
  if (errs.length){ fail('save.defense', 'valid defense', errs.join('; '), d); return; }
  const before = play.def;
  play.def = d;
  if (!saveStore('save.defense')){ play.def = before; return; }
  pushBaseline('play', play);
  dbPut('plays', play, 'save.defense');
  diag('save.defense', `play ${play.n}: ${defCode(d, play.strength)}`);
  toast(`Play ${play.n} defense saved: ${esc(d.summary)}`);
  if (W.chain) startNext(W.chain); else goHome();
}
function frontSuggest(d){
  const dl = d.box.filter(b => b.d === 1 && b.hand === 'down').length;

}
function mirrorDef(d){
  return Object.assign({}, d, {box:d.box.map(b => Object.assign({}, b, {x:b.x === 0 ? 0 : -b.x})), dbs:d.dbs.map(o => Object.assign({}, o, {slot:mirrorKey(o.slot)}))});
}
function saveFront(name){

  const code = defCode(d, 'R');
  let f = W.editFront ? S.fronts.find(o => o.id === W.editFront) : S.fronts.find(o => o.code === code);
  const now = new Date().toISOString();
  if (f){ Object.assign(f, {name, code, box:d.box, dbs:d.dbs, shell:d.shell, summary:d.summary, updated:now}); delete f._bad; }
  else { f = {id:'d' + Date.now().toString(36), name, code, box:d.box, dbs:d.dbs, shell:d.shell, summary:d.summary, created:now}; S.fronts.push(f); }
  if (!saveStore('save.front')) return;
  pushBaseline('front', f);
  dbPut('fronts', f, 'save.front');
  diag('save.front', `"${name}" ${code}`);
  hideSheet();
  toast(`Saved front: ${esc(name)}`);
  goHome();
}
function loadFrontInto(f){
  const flip = W.strength === 'L';
  W.def.box = f.box.map(b => ({id:nid(), x:flip && b.x !== 0 ? -b.x : b.x, d:b.d, hand:b.d === 1 ? b.hand : null}));
  W.def.deep = f.dbs.filter(o => o.kind === 'deep').map(o => ({id:nid(), slot:flip ? mirrorKey(o.slot) : o.slot}));
  W.def.rest = f.dbs.filter(o => o.kind !== 'deep').map(o => ({id:nid(), slot:flip ? mirrorKey(o.slot) : o.slot}));
  W.def.shell = f.shell; W.def.shellBuilt = true; W.def.pendingHand = null; W.def.sel = null; W.def.cur = 0;
  W.droles = {}; W.dsel = null;
}
function loadFromCode(text){
  const t0 = performance.now();
  const res = parseFormation(text);
  if (res.errors.length){ fail('paste.code', 'a valid formation code', res.errors[0], String(text).slice(0, 200)); return false; }
  const types = inferTypes(res.out, res.pers);
  let tokens = res.out.map((o,i) => ({type:types[i], slot:o.slot}));
  const sit = res.sit;
  if (sit && sit.strength === 'L') tokens = tokens.map(t => Object.assign({}, t, {slot:mirrorKey(t.slot)}));
  const off = {pers:res.pers, xol:res.xol, qb:res.qb, tokens};
  const errs = validateOffense(off);
  if (errs.length){ fail('paste.code', 'a legal offense', errs[0], off); return false; }
  loadOffInto(W, off, false);
  if (sit){ W.hash = sit.hash; W.spot = sit.spot; }
  diag('paste.code', `loaded ${formationCodeOf(off)} in ${(performance.now() - t0).toFixed(1)} ms`);
  return true;
}

/* ---- play designer ---- */
function designCode(dz){
  const arts = (dz.arts || []).slice().sort((a,b) => MAN_ORDER.indexOf(a.tag) - MAN_ORDER.indexOf(b.tag));
  const toks = arts.map(a => a.token).filter(Boolean).join(' ');
  const c = dz.concept ? `C:${CONCEPT_ABBR[dz.concept.id] || dz.concept.id}${dz.concept.ps > 0 ? 'R' : 'L'}` : 'C:-';
  return `${dz.fcode} | ${dz.strength} | ${c} | A ${toks || '-'} | ${dz.def ? defCode(dz.def, dz.strength) + (dz.def.cov ? ` | ${dz.def.cov.code} ${dz.def.cov.rcode}` : '') : 'D -'}`;
}
function setNameNow(){
  const code = formationCodeOf(offObject());
  const f = S.formations.find(o => o.code === code);
  if (f) return f.name;
  const sg = suggestNames()[0];
  return sg ? sg.name : code;
}
function goRoutes(){
  const st = offStatus();
  if (st.left || !st.legal){ fail('design.routes', 'all 5 placed and 7 on the line', `${st.left} left, ${st.onLine} on the line`); return; }
  W.setName = setNameNow();
  const L = assignLetters(placedPlayers());
  W.tokens.forEach(t => { t.fixed = t.type === 'L' ? null : (L[t.id] || null); });
  W.strength = strengthOf(W.tokens);
  if (!W.psideSet) W.pside = W.strength === 'R' ? 1 : -1;
  setStep('routes');
  remapRouteSides();
  applyDefSrc();
  if (W.rsel && !men().some(m => m.id === W.rsel)) W.rsel = null;
  diag('flow', `design: ${formationCodeOf(offObject())} strong ${W.strength} vs ${W.defName}`);
  refresh();
}
function startDesign(f){
  W = newWork('design');
  setView('editor');
  if (f){ loadOffInto(W, f, false); goRoutes(); }
  else { setStep('off'); refresh(); }
  diag('flow', f ? `draw a play from "${f.name}"` : 'draw a play from a new set');
}
function openDesign(dz){
  const e = checkDesign(dz);
  if (e.length){ fail('design.open', 'a valid drawn play', e[0], dz); return; }
  W = newWork('design');
  W.hash = dz.hash || 'M'; W.editDesign = dz.id; W.name = dz.name; W.setName = dz.setName || '';
  loadOffInto(W, dz.off, true);
  W.strength = dz.strength || strengthOf(W.tokens);
  setStep('routes');
  const M = men();
  const arts = dz.arts || (dz.routes || []).map(r => ({who:r.slot, kind:'route', pts:r.pts}));
  arts.forEach(r => {
    const m = M.find(q => q.id === r.who || (q.t && q.t.slot === r.who));
    if (!m){ diag('design.open', `no man at ${r.who}: art skipped`); return; }
    if (r.mo) W.motion[m.id] = {pts:r.mo.map(q => [q.x, q.y]), side:Math.sign(m.x) || 0};
    if (r.pts && r.kind){
      const a = W.routes[m.id] = {kind:r.kind, pts:r.pts.map(q => [q.x, q.y]), side:Math.sign(m.x) || 0};
      ['label','target','t2','tx','tY','tl','cname'].forEach(k => { if (r[k] != null) a[k] = r[k]; });
      if (r.pull != null) a.pull = r.pull;
    }
  });
  W.concept = dz.concept || null;
  W.pside = W.concept ? W.concept.ps : (W.strength === 'R' ? 1 : -1); W.psideSet = !!W.concept;
  W.defSrc = dz.defSrc || {kind:'none'};
  if (dz.def){ loadDefInto(W, dz.def); W.defName = dz.defName || 'Defense'; } else { W.def = newDef(); W.defName = 'No defense'; }
  viewForStep(); setView('editor'); refresh();
  diag('flow', `open drawn play "${dz.name}" ${dz.code}`);
}
function saveDesign(name){
  const off = offObject();
  const errs = validateOffense(off);
  if (errs.length){ fail('save.design', 'valid offense', errs.join('; '), off); return; }
  const dbl = doubleIds(), arts = [];
  men().forEach(m => {
    const a = W.routes[m.id], mo = W.motion[m.id];
    const has = !!(a && a.pts.length > 1), hasM = !!(mo && mo.pts.length > 1);
    if (!has && !hasM) return;
    const i = has ? artInfo(m, dbl) : null;
    arts.push({who:m.t ? m.t.slot : m.id, tag:m.tag, kind:has ? a.kind : null, name:i ? i.name : null, code:i ? i.code : null, label:(has && a.label) || null,
      target:(has && a.target) || null, t2:(has && a.t2) || null, pull:has && a.pull != null ? !!a.pull : null, tx:has && a.tx != null ? a.tx : null, tY:has && a.tY != null ? a.tY : null, tl:(has && a.tl) || null, cname:(has && a.cname) || null,
      pts:has ? a.pts.map(([x,y]) => ({x, y})) : null, mo:hasM ? mo.pts.map(([x,y]) => ({x, y})) : null, mname:hasM ? motionName(m) : null, token:manToken(m, dbl)});
  });
  let def = null;
  if (W.def.box.length + W.def.deep.length + W.def.rest.length){
    def = defObject();
    const de = validateDefense(def);
    if (de.length){ fail('save.design', 'valid defense', de.join('; '), def); return; }
  }
  const body = {name, off, fcode:formationCodeOf(off), setName:W.setName, strength:W.strength, hash:W.hash, defName:W.defName, defSrc:W.defSrc, def,
    concept:W.concept || null, arts, fmt:6};
  body.code = designCode(body);
  const chk = checkDesign(Object.assign({}, body));
  if (chk.length){ fail('save.design', 'a drawn play that reads back', chk[0], body); return; }
  const now = new Date().toISOString();
  let dz = W.editDesign ? S.designs.find(o => o.id === W.editDesign) : null;
  const isNew = !dz;
  if (dz){ Object.assign(dz, body, {updated:now}); delete dz.routes; delete dz._bad; }
  else { dz = Object.assign({id:'z' + Date.now().toString(36), created:now}, body); S.designs.push(dz); }
  if (!saveStore('save.design')){ if (isNew) S.designs.pop(); return; }
  pushBaseline('design', dz);
  dbPut('designs', dz, 'save.design');
  W.editDesign = dz.id; W.name = name; W.dirty = false;
  diag('save.design', `${isNew ? 'new' : 'updated'} "${name}" ${dz.code}`);
  hideSheet();
  toast(`Saved: ${esc(name)}`);
  refresh();
}
