/* ---- the art: quiz look, one renderer for sets, the box and the shell (SVG in yards; y down = into the offense's backfield) ---- */
const QZ = (() => {
  const f1 = v => (Math.round(v * 10) / 10).toString();
  const QBY = {under:1.75, pistol:4.6, gun:5.6};
  const FWD = 160 / 3;
  function lettersOf(off){
    try {
      if (!off || !Array.isArray(off.tokens) || !off.tokens.some(t => t && t.slot)) return {};
      return ENG.analyze({qb:off.qb || 'gun', xol:!!off.xol, tokens:off.tokens}, {tb:NAMES.st().tb, families:false}).letters || {};
    } catch(e){ return {}; }
  }
  function offMen(off){
    const out = [];
    ((off && off.tokens) || []).forEach((t, i) => { if (!t || !t.slot) return; const q = PBA.offXY(t.slot, off.qb); if (q) out.push({i, x:q.x, y:q.r + 0.9, type:t.type}); });
    return out;
  }
  function frame(bx, w, h, body, label){
    const pad = 1.3;
    let x0 = bx.x0 - pad, x1 = bx.x1 + pad, y0 = bx.y0 - pad, y1 = bx.y1 + pad;
    const want = w / h, have = (x1 - x0) / (y1 - y0);
    if (have < want){ const add = ((y1 - y0) * want - (x1 - x0)) / 2; x0 -= add; x1 += add; }
    else { const add = ((x1 - x0) / want - (y1 - y0)) / 2; y0 -= add; y1 += add; }
    const lines = [], ticks = [];
    for (let y = Math.ceil(y0 / 5) * 5; y <= y1; y += 5) if (y !== 0) lines.push(`M${f1(x0)} ${y}H${f1(x1)}`);
    for (let y = Math.ceil(y0); y <= y1; y++) if (y % 5) ticks.push(`M-3.4 ${y}h0.65M2.75 ${y}h0.65`);
    return `<svg class="qz" viewBox="${f1(x0)} ${f1(y0)} ${f1(x1 - x0)} ${f1(y1 - y0)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(label || 'Play art')}">`
      + `<rect class="bg" x="${f1(x0)}" y="${f1(y0)}" width="${f1(x1 - x0)}" height="${f1(y1 - y0)}"/><path class="ln" d="${lines.join('')}"/><path class="hs" d="${ticks.join('')}"/>`
      + `<path class="los" d="M${f1(x0)} 0H${f1(x1)}"/>${body}</svg>`;
  }
  function offBody(off, o){
    o = o || {};
    const L = o.letters === false ? {} : lettersOf(off), out = [];
    [-4, -2, 0, 2, 4].forEach(x => out.push(`<rect class="ol" x="${f1(x - 0.62)}" y="0.3" width="1.24" height="1.24" rx="0.25"/>`));
    out.push(`<circle class="qb" cx="0" cy="${QBY[(off && off.qb) || 'gun'] || 5.6}" r="0.7"/>`);
    (o.ghost || []).forEach(g => out.push(`<circle class="man ghost" cx="${f1(g.x)}" cy="${f1(g.y)}" r="0.92"/>`));
    offMen(off).forEach(m => {
      if (m.type === 'L'){ out.push(`<rect class="ol" x="${f1(m.x - 0.62)}" y="${f1(m.y - 0.62)}" width="1.24" height="1.24" rx="0.25"/>`); return; }
      const hi = o.hi === m.i;
      if (hi) out.push(`<circle class="ring" cx="${f1(m.x)}" cy="${f1(m.y)}" r="1.6"/>`);
      out.push(`<circle class="man${hi ? ' hi' : ''}" cx="${f1(m.x)}" cy="${f1(m.y)}" r="0.92"/>`);
      const t = L[m.i]; if (t) out.push(`<text class="mt" x="${f1(m.x)}" y="${f1(m.y + 0.37)}" font-size="1.05">${esc(t)}</text>`);
    });
    return out.join('');
  }
  function set(off, o){
    o = o || {};
    const M = offMen(off), qy = QBY[(off && off.qb) || 'gun'] || 5.6;
    const hx = Math.max(6.5, ...M.map(m => Math.abs(m.x)));
    const y1 = Math.max(qy, 2, ...M.map(m => m.y));
    return frame({x0:-hx, x1:hx, y0:-1.4, y1}, o.w || 358, o.h || 120, offBody(off, o), o.label || 'The set');
  }

/* a set from the book onto the field, as the start: its men, the answers that draw it, what its neighbours disagree on */

/* ---- E02: one question, in role words; the pick's answer is marked; nothing about letters ----
   The pick can't tell the strength (every set in the book is filed strong right), and it can't tell what the closest

function enUnsure(f){

      loadOffInto(W, o, false); W.pers = save.pers; W.wiz = {}; wizInfer();

    } catch(e){ diag('engine', `reading a neighbour set failed: ${e && e.message}`); }

}
const BK_SUB = {wfb:'beside the QB, away from the TE', sfb:'beside the QB, on the TE’s side', tb:'straight behind the QB', fb:'fullback depth, right behind the QB',
  i:'one behind the other', si:'I with the fullback offset to the TE', wi:'I with the fullback offset away', split:'one on each side', house:'three across',
  spi:'power I, the extra back to the TE', wpi:'power I, the extra back away', stb:'deep back + one offset to the TE', wtb:'deep back + one offset away', diamond:'one each side + one deep'};
const TE_WORD = {a:['On the line', 'attached to the tackle, on the ball'], o:['A step off', 'beside the tackle, off the ball'], h:['Wing', 'just outside the tackle, a yard back'],
  s:['In the slot', 'between the tackle and the numbers'], w:['Split wide', 'out by the numbers'], f:['In the backfield', 'lined up as a back']};

  NS:['Spread out', 'one wide, one in the slot'], NT:['Wide & tight', 'one wide, one tight'], ST:['Reduced', 'both inside the numbers'], stack:['Stacked', 'one lined up behind the other'],
  NST:['Spread out', 'spaced across the side'], bunch:['Bunched', 'all within a few yards, someone off the ball'], stackS:['Stack & slot', 'two stacked wide, one in the slot'], tight:['Tight', 'all three close to the line'],

/* ---- 0.14.0: three ways to place the men — Ask (the questions), Grid (the chart), Drag (the field). Any of the three,

/* ---- E03b: drag. A base set on the field. Tap a man in the legend (or on the field) and he's the one that moves: put a
   finger down anywhere on the field and drag — he follows at the same offset, so the finger never covers him. The
   nearest spot he can take is ringed, and the name, the letters and the line count read live as if he were already
   there. Let go and he snaps in; a man already on that spot trades places with him. ---- */
const DMG = (() => {   // the field in screen units: true depth; widths eased so every column sits a finger apart
  const XS = [[0, 0], [2, 18], [4, 36], [6, 60], [9, 86], [12, 112], [FW / 2 - 8, 140], [FW / 2 - 4, 164], [FW / 2, 179]];
  const SY = 26, Y0 = -1.4, Y1 = 9.3, VW = 360, VH = Math.round((Y1 - Y0) * SY);
  const QBY = {under:1.75, pistol:4.6, gun:5.6};
  const px = x => {
    const a = Math.abs(x), s = x < 0 ? -1 : 1;

/* ---- log it: the set filed, the play made, the defense and the call on it, what happened after the snap ---- */
function enLog(scope){
  const q = (EN && EN.q) || {}, st = offStatus();
  if (!st.legal){ toast(st.left ? `${st.left} still to place.` : ((st.issues[0] || {}).msg || 'Not a legal set.'), 'err'); enGoPlace(); renderFlow(); return; }
  W.tokens.forEach(t => { delete t.fixed; });
  const off = offObject(), strength = strengthOf(off.tokens);
  const x = {qb:off.qb, xol:!!off.xol, tokens:off.tokens.map(t => ({type:t.type, slot:t.slot}))};
  const neutral = NAMES.setText(x, NAMING === 'desc' ? 'plain' : 'pro', {field:strength, neutral:true});
  const mine = String(W.myName || '').trim(), name = mine || neutral;
  let def = null, cid = null;
  if (scope !== 'off' && EN.def){
    let d = enClone({box:EN.def.box, dbs:EN.def.dbs, shell:EN.def.shell, strength:'R'});
    d.box.forEach(b => { if (b.d === 1){ if (b.hand !== 'up') b.hand = 'down'; delete b.dep; } else { b.d = 5; b.hand = null; } });
    if (scope === 'all'){
      cid = enCid();
      if (cid){
        const offR = strength === 'L' ? mirrorOff(off) : off, cd = PBA.callDef({box:d.box, dbs:d.dbs, shell:d.shell}, offR, cid);
        if (cd) d = Object.assign(d, {box:cd.box, dbs:cd.dbs, shell:cd.shell, cov:cd.cov, roles:null}); else cid = null;
      }
      if (!cid && EN.post) d.shell = Math.max(0, Math.min(2, +EN.post.deep || 0));
    }
    def = frontDef(d, strength, enFrontName());
    def.box.forEach((b, i) => { const s = d.box[i]; if (b.d !== 1 && s && s.dep && s.dep !== 5) b.dep = s.dep; });
    if (cid) def.call = cid;
    else if (scope === 'all' && EN.post && EN.post.cov != null) def.cov = {name:covWord({cov:EN.post.cov}), code:'C' + EN.post.cov, pressure:EN.post.rush ? `${EN.post.rush}${EN.post.rush >= 6 ? '+' : ''}-man rush` : ''};
    const de = validateDefense(def);
    if (de.length){ fail('engine.log', 'a valid defense', de.join('; '), def); return; }
  }
  const res = cardRes(q, null, strength);
  const how = {v:1, start:EN.start ? {id:EN.start.id, name:EN.start.name} : null, kept:EN.kept, changed:Object.keys(EN.changed), placed:!!EN.placed,
    src:{pers:EN.known.pers ? EN.known.pers.src : 'you', qb:EN.known.qb ? EN.known.qb.src : 'you'}, front:def ? {name:EN.defName, from:EN.defSrc, changes:enDefChanges()} : null};
  const post = scope === 'all' && EN.post ? {deep:+EN.post.deep, rot:EN.post.rot, cov:EN.post.cov == null ? null : String(EN.post.cov), rush:EN.post.rush || null, bl:EN.post.bl || 0, cid,
    src:{deep:'you', rot:'you', cov:EN.post.covSrc || 'you', rush:EN.post.rushSrc || 'you'}} : null;
  const extra = {how}; if (res) extra.res = res; if (post) extra.post = post;
  const baseId = EN.start && EN.start.base && !EN.placed && !Object.keys(EN.changed).length ? EN.start.id : null;
  const fam = enFamNow();   // 0.15.0: the family it was made from, unless you picked another
  let pre = mine ? fileSet(off, name, baseId, fam.v) : null;
  if (pre && pre.base) pre = {f:upsertFormation(off, name, null, fam.v), isNew:true};   // your own name for a base set: your copy carries it (and stands in for the base one)
  if (pre) pre.f.myName = mine;
  const p = makePlay({off, name, baseId, family:fam.v, def, key:q.key || null, sit:q.sit || null, hash:W.hash, spot:W.spot, src:'engine', stage:'engine.log', extra});
  if (!p){ if (pre && pre.isNew){ const i = S.formations.indexOf(pre.f); if (i >= 0) S.formations.splice(i, 1); } return; }
  if (pre && pre.isNew) dbPut('formations', pre.f, 'engine.log');
  if (EN.famYou && EN.fam){ const fs = fmGet(p.formationId); if (fs && famOf(fs) !== EN.fam) famApply(fs, EN.fam); }
  if (q.key){ CARD.delete(q.key); PARK.delete(q.key); parkSave(); if (CARDV.key === q.key){ CARDV.key = null; CARDV.shot = 'snap'; } }
  if (SYNC.hold && q.key && SYNC.hold.key === q.key) setHold(null);
  EN.logged = p; EN.step = 'done';
  diag('engine.log', `play ${p.n} ${q.key || 'by hand'}: ${playCode(p)}${post ? ' · ' + covWord(post) : ''} · ${scope}`);
  renderFlow(); $('#flow').scrollTop = 0;
}

/* ---- E07: logged → next ---- */
function enNext(){
  const q = EN && EN.q, k = q && q.key;

    const gid = String(k).split(':')[0], g = GAMES.cache.get(gid);
    if (g){
      const side = gameSide(g), drive = EN.chain && EN.chain.drive != null ? EN.chain.drive : null;
      const nx = gameNextOpen({gid, side, drive}) || (drive != null ? gameNextOpen({gid, side}) : null);
      if (nx){ const hit = gameFind(nx.key); return Object.assign(nx, {drive:hit ? hit.d : null}); }
      return null;
    }
  }
  return inboxSplit().live.find(x => x.key !== k) || null;
}
function enDefLine(d0, strength){   // the play's defense in strength-right terms: W is always the weak backer
  const d = strength === 'L' ? mirrorDef(d0) : d0, R = QZ.defRoles(d), out = [];

}

      <span class="s">${esc(bits || nx.desc || '')}${bits ? ' — from the data' : ''}</span><button class="fb" data-act="enNextGo">Log it →</button></div>`;

  famNew(){
    showSheet(`<h3>A new family</h3><p>Name it. Move sets in from their cards, or pick it on the card when you log a new set.</p>
      <input id="famNew" class="txt" placeholder="Family name" autocomplete="off" autocapitalize="words" spellcheck="false">
      <div class="row"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn pri" data-act="famNewDo">Add</button></div>`);
  },
  famNewDo(){
    const v = String($('#famNew') ? $('#famNew').value : '').trim();
    if (!v){ toast('Type a name first.'); return; }
    const k = famKnown(v); if (k){ toast(`${esc(k)} is already a family.`); return; }
    S.famList.push(v);
    if (saveStore('family.new')){ diag('family', `new family "${v}"`); hideSheet(); toast(`New family: ${esc(v)}`); renderHome(); }
  },
  enFamSet(d){   // the engine's card: the family this set goes in
    if (!EN) return;
    const v = famTyped(d); if (!v){ toast('Type the new family’s name first.'); return; }
    const k = famAdd(v); if (S.famList.includes(k)) saveStore('family.new');
    EN.fam = k; EN.famYou = true; diag('engine', `family → ${k}`); hideSheet(); renderFlow();
  }
});
/* ================= 0.14.0 actions: three ways to place, the drag ================= */
Object.assign(ACT, {
  enHow(d){   // switch now: the questions, the grid or the field — the men stay where they are
    if (!EN || !W) return;
    const v = d.v === 'grid' || d.v === 'drag' ? d.v : 'ask', at = EN.step;
    if (v === 'drag'){ if (at === 'drag') return; enDragInit(); }
    else if (v === 'grid'){ if (at === 'place') return; enPlaceInit(false); }
    else { if (at === 'ask') return; enGoAsk(); }
    diag('engine', `placing by ${v} (from ${at})`);
    renderFlow(); $('#flow').scrollTop = 0;
  },
  enHowPref(d){   // the first screen: what a picked set opens in
    const v = d.v === 'grid' || d.v === 'drag' ? d.v : 'ask';
    lsSetRaw(HOW_LS, v === 'ask' ? '' : v); diag('engine', `a picked set opens in: ${v}`); renderFlow();
  },
  enDragSel(d){ if (!EN || !EN.drag || !W) return; const i = +d.i; if (!W.tokens[i]) return; EN.drag.sel = i; renderFlow(); },
  enDragUndo(){
    if (!EN || !EN.drag || !EN.drag.hist.length) return;
    const h = EN.drag.hist.pop(); W.tokens.forEach((t, i) => { t.slot = h[i] || null; });
    diag('engine.drag', `undo → ${enNameOf(W.tokens)}`); renderFlow();
  }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (performance.now() < SWIPE.block) return;
  const act = el.dataset.act;
  if (act === 'closeSheet' && el.id === 'sheet' && e.target !== el) return;
  const fn = ACT[act];
  if (!fn){ fail('ui', 'known action', act); return; }
  try { fn(el.dataset, el); }
  catch(err){ fail('action.' + act, 'no error', err.message, String(err.stack || '')); }
});

/* ================= boot ================= */
DIAG = lsGetJSON(KEYS.diag, []);
if (!Array.isArray(DIAG)) DIAG = [];
diag('boot', `v${VERSION} start, ${navigator.userAgent}`);
if ('ResizeObserver' in window) new ResizeObserver(() => { if (VIEW === 'editor' && measure()){ clampCam(); render(); } }).observe($('#fieldWrap'));
window.addEventListener('resize', () => { if (VIEW === 'editor' && measure()){ clampCam(); render(); } });
namesLoad(); nameActs(); zoomWire();
if (EMBED) embedBoot();
else {
  loadStore();
  namesMigrate();
  noDirMigrate();
  NAMING = lsGetRaw('pb.naming') === 'desc' ? 'desc' : 'pro';
  { const pk = lsGetJSON('pb.parked', []); if (Array.isArray(pk)) pk.forEach(k => { if (typeof k === 'string') PARK.add(k); }); }
  { const al = lsGetJSON('pb.adopted', []); if (Array.isArray(al)) ADOPT.log = al.filter(a => a && a.at).slice(0, 30); }
  setView('home'); refresh();
  connectDb();
  syncStart();
  baseLoad();
  gamesLoad();
  clearPrompt();
}
})();
</script>

</body>
